    function renderCalendar() {
        const calendarBody = document.getElementById('calendarBody');
        calendarBody.classList.add('calendar-transitioning');

        setTimeout(() => {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
            
            const midLunar = getLunarInfo(year, month, 15);
            const lunarYearStr = (showLunar && midLunar) ? `${midLunar.gzYear}(${midLunar.shengXiao})年` : '';
            document.getElementById('monthYearDisplay').innerHTML = `${year} 年 ${monthNames[month]} ${lunarYearStr ? `<span class="fs-6 fw-bold ms-1 text-primary d-none d-sm-inline">(${lunarYearStr})</span>` : ''}`;
            
            const rawFirstDay = new Date(year, month, 1).getDay(); 
            const firstDayOfMonth = rawFirstDay === 0 ? 6 : rawFirstDay - 1; 
            const daysInMonth = new Date(year, month + 1, 0).getDate(); 
            const prevMonthDays = new Date(year, month, 0).getDate();

            let prevMonth = month - 1; let prevYear = year;
            if (prevMonth < 0) { prevMonth = 11; prevYear--; }

            let nextMonth = month + 1; let nextYear = year;
            if (nextMonth > 11) { nextMonth = 0; nextYear++; }

            calendarBody.innerHTML = '';

            const createCell = (cYear, cMonth, cDay, isOtherMonth) => {
                const cell = document.createElement('div');
                cell.className = 'day-cell' + (isOtherMonth ? ' other-month' : '');

                const cellDate = new Date(cYear, cMonth, cDay);
                const dayOfWeek = cellDate.getDay(); 
                if (dayOfWeek === 6) {
                    cell.classList.add('weekend-sat-cell');
                } else if (dayOfWeek === 0) {
                    cell.classList.add('weekend-sun-cell');
                }

                const today = new Date();
                if (!isOtherMonth && today.getFullYear() === cYear && today.getMonth() === cMonth && today.getDate() === cDay) {
                    cell.classList.add('today');
                }

                const dateString = `${cYear}-${String(cMonth + 1).padStart(2, '0')}-${String(cDay).padStart(2, '0')}`;
                
                const topRow = document.createElement('div');
                topRow.className = 'day-cell-top';

                const dateNum = document.createElement('div');
                dateNum.className = 'date-number';
                dateNum.textContent = cDay;
                topRow.appendChild(dateNum);

                if (showLunar) {
                    const lunarInfo = getLunarInfo(cYear, cMonth, cDay);
                    if (lunarInfo) {
                        const lunarTag = document.createElement('div');
                        lunarTag.className = 'lunar-tag' + (lunarInfo.isSpecial ? ' lunar-highlight' : '');
                        lunarTag.textContent = lunarInfo.label;
                        lunarTag.title = lunarInfo.tooltip;
                        topRow.appendChild(lunarTag);
                    }
                }
                cell.appendChild(topRow);

                const dayEvents = events.filter(evt => dateString >= evt.start && dateString <= (evt.end || evt.start));
                const isSingleEvent = dayEvents.length === 1;

                const isMiniGrid = dayEvents.length >= 4;

                const eventsWrapper = document.createElement('div');
                eventsWrapper.className = 'events-wrapper' + (isMiniGrid ? ' multi-items' : '');

                dayEvents.forEach(evt => {
                    const chip = document.createElement('div');
                    chip.className = 'event-chip';
                    if (evt.isHighlighted) chip.classList.add('highlight-border');

                    chip.style.backgroundColor = evt.color;
                    chip.style.color = getContrastTextColor(evt.color);
                    
                    let iconHtml = '';
                    if (evt.icon && evt.icon.startsWith('bi-')) {
                        iconHtml = `<i class="bi ${evt.icon} chip-icon"></i>`;
                    } else {
                        iconHtml = `<span class="chip-icon">${escapeHtml(evt.icon || '📌')}</span>`;
                    }
                    
                    const rawLines = (evt.text || '').split('\n');
                    
                    if (isMiniGrid) {
                        chip.classList.add('mini-grid-item');
                        const firstLineSafe = escapeHtml(rawLines[0] || '');
                        chip.innerHTML = `${iconHtml}<span class="line-text">${firstLineSafe}</span>`;
                    } else if (isSingleEvent) {
                        if (rawLines.length <= 1) {
                            chip.classList.add('single-line-full');
                            const safeText = escapeHtml(evt.text || '');
                            chip.innerHTML = `${iconHtml}<span class="full-text">${safeText}</span>`;
                        } else {
                            chip.classList.add('multi-line-mode');
                            let linesHtml = rawLines.map((lineText, idx) => {
                                const safeLine = escapeHtml(lineText);
                                if (idx === 0) {
                                    return `<div class="event-line">${iconHtml}<span class="line-text">${safeLine}</span></div>`;
                                } else {
                                    return `<div class="event-line"><span class="line-text">${safeLine}</span></div>`;
                                }
                            }).join('');
                            chip.innerHTML = linesHtml;
                        }
                    } else {
                        chip.classList.add('multi-line-mode');
                        const firstLineSafe = escapeHtml(rawLines[0] || '');
                        chip.innerHTML = `<div class="event-line">${iconHtml}<span class="line-text">${firstLineSafe}</span></div>`;
                    }

                    chip.title = evt.text;
                    chip.onclick = (e) => { e.stopPropagation(); openModalForEdit(evt.id); };
                    eventsWrapper.appendChild(chip);
                });

                cell.appendChild(eventsWrapper);
                cell.onclick = () => openModalForNew(dateString);
                return cell;
            };

            for (let i = 0; i < firstDayOfMonth; i++) {
                const day = prevMonthDays - firstDayOfMonth + 1 + i;
                calendarBody.appendChild(createCell(prevYear, prevMonth, day, true));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                calendarBody.appendChild(createCell(year, month, day, false));
            }
            
            const totalCells = firstDayOfMonth + daysInMonth;
            const remainingCells = (7 - (totalCells % 7)) % 7;
            for (let day = 1; day <= remainingCells; day++) {
                calendarBody.appendChild(createCell(nextYear, nextMonth, day, true));
            }

            calendarBody.classList.remove('calendar-transitioning');
        }, 150);
    }

    function openModalForNew(dateString) {
        document.getElementById('modalTitle').textContent = '新增行程';
        document.getElementById('currentEditId').value = ''; 
        dateRangePicker.setDate([dateString, dateString]);
        updateModalLunarInfo(dateRangePicker.selectedDates);
        document.getElementById('noteTextarea').value = '';
        document.getElementById('highlightCheckbox').checked = false; 
        
        document.getElementById('colorBlue').checked = true;
        document.getElementById('customColorLabel').style.setProperty('--base-color', '#6366f1');
        document.getElementById('colorCustomRadio').value = '#6366f1';
        document.getElementById('nativeColorInput').value = '#6366f1';

        document.getElementById('customIconInput').value = '';
        document.getElementById('iconCustomLabel').textContent = '➕';
        document.getElementById('iconCustom').value = 'CUSTOM';
        document.getElementById('iconPin').checked = true;
        
        document.getElementById('deleteNoteBtn').style.display = 'none'; 
        noteModal.show();
    }

    function openModalForEdit(eventId) {
        const evt = events.find(e => e.id === eventId);
        if (!evt) return;
        document.getElementById('modalTitle').textContent = '編輯行程';
        document.getElementById('currentEditId').value = evt.id; 
        dateRangePicker.setDate([evt.start, evt.end || evt.start]);
        updateModalLunarInfo(dateRangePicker.selectedDates);
        document.getElementById('noteTextarea').value = evt.text;
        document.getElementById('highlightCheckbox').checked = evt.isHighlighted || false; 
        
        const colorRadio = document.querySelector(`input[name="noteColor"][value="${evt.color}"]`);
        if (colorRadio && colorRadio.id !== 'colorCustomRadio') {
            colorRadio.checked = true;
        } else {
            const customColor = evt.color || '#6366f1';
            document.getElementById('nativeColorInput').value = customColor;
            document.getElementById('customColorLabel').style.setProperty('--base-color', customColor);
            document.getElementById('colorCustomRadio').value = customColor;
            document.getElementById('colorCustomRadio').checked = true;
        }

        if (PRESET_ICONS.includes(evt.icon)) {
            const iconRadio = document.querySelector(`input[name="noteIcon"][value="${evt.icon}"]`);
            if (iconRadio) iconRadio.checked = true;
            document.getElementById('customIconInput').value = '';
            document.getElementById('iconCustomLabel').textContent = '➕';
            document.getElementById('iconCustom').value = 'CUSTOM';
        } else {
            document.getElementById('customIconInput').value = evt.icon || '';
            document.getElementById('iconCustomLabel').textContent = evt.icon || '➕';
            document.getElementById('iconCustom').value = evt.icon || 'CUSTOM';
            document.getElementById('iconCustom').checked = true;
        }

        document.getElementById('deleteNoteBtn').style.display = 'block'; 
        noteModal.show();
    }

    function setupEventListeners() {
        document.getElementById('appTitleBtn').onclick = () => {
            swalWithBootstrapButtons.fire({
                title: '自訂行事曆名稱',
                input: 'text',
                inputValue: appTitle,
                showCancelButton: true,
                confirmButtonText: '儲存名稱',
                cancelButtonText: '取消',
                inputPlaceholder: '請輸入行事曆名稱 (例如：我的商務日誌)',
                inputValidator: (value) => {
                    if (!value || !value.trim()) return '名稱不能為空！';
                    if (value.trim().length > 20) return '名稱建議在 20 字以內。';
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    updateAppTitle(result.value);
                    swalWithBootstrapButtons.fire({ icon: 'success', title: '已更新名稱', text: `已將標題更改為「${appTitle}」`, timer: 1500, showConfirmButton: false });
                }
            });
        };

        // 記事本 模式切換
        document.getElementById('memoToggleBtn').onclick = () => {
            toggleMemoMode();
        };

        // 記事本 收合 按鈕
        document.getElementById('memoCollapseBtn').onclick = () => {
            applyMemoCollapseState(true);
        };

        // 記事本 展開 側條點擊
        document.getElementById('memoCollapsedBar').onclick = () => {
            applyMemoCollapseState(false);
        };

        let memoDebounceTimer;
        document.getElementById('sideMemoArea').oninput = () => {
            clearTimeout(memoDebounceTimer);
            document.getElementById('saveStatus').textContent = "TYPING...";
            memoDebounceTimer = setTimeout(() => saveMemoToDB(), 800);
        };

        document.getElementById('themeSelector').onchange = (e) => applyTheme(e.target.value);
        
        document.getElementById('darkModeBtn').onclick = () => {
            const currentTheme = document.body.className || 'theme-default';
            const newTheme = currentTheme === 'theme-dark' ? 'theme-default' : 'theme-dark';
            document.getElementById('themeSelector').value = newTheme;
            applyTheme(newTheme);
        };

        document.getElementById('lunarToggleBtn').onclick = () => {
            showLunar = !showLunar;
            localStorage.setItem(LUNAR_KEY, showLunar);
            updateLunarButtonState();
            renderCalendar();
        };

        const customInput = document.getElementById('customIconInput');
        const customRadio = document.getElementById('iconCustom');
        const customLabel = document.getElementById('iconCustomLabel');

        customInput.addEventListener('input', () => {
            const val = customInput.value.trim();
            if (val) {
                customLabel.textContent = val;
                customRadio.value = val;
                customRadio.checked = true;
            } else {
                customLabel.textContent = '➕';
                customRadio.value = 'CUSTOM';
            }
        });

        customLabel.addEventListener('click', () => {
            setTimeout(() => customInput.focus(), 100);
        });

        const customColorLabel = document.getElementById('customColorLabel');
        const nativeColorInput = document.getElementById('nativeColorInput');
        const colorCustomRadio = document.getElementById('colorCustomRadio');

        customColorLabel.addEventListener('click', () => {
            nativeColorInput.click();
        });

        nativeColorInput.addEventListener('input', (e) => {
            const chosenColor = e.target.value;
            customColorLabel.style.setProperty('--base-color', chosenColor);
            colorCustomRadio.value = chosenColor;
            colorCustomRadio.checked = true;
        });

        document.getElementById('topAddEventBtn').onclick = () => {
            const todayStr = flatpickr.formatDate(new Date(), "Y-m-d");
            openModalForNew(todayStr);
        };

        document.getElementById('prevMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
        document.getElementById('nextMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };
        
        document.getElementById('todayBtn').onclick = (e) => { 
            currentDate = new Date(); renderCalendar(); e.target.blur(); 
        };
        
        // 鍵盤快捷鍵監聽（Tab 鍵收合／展開）
        document.addEventListener('keydown', (e) => {
            const activeTag = document.activeElement.tagName.toLowerCase();
            const isSwalOpen = document.body.classList.contains('swal2-shown');
            const isModalOpen = document.getElementById('noteModal').classList.contains('show');

            // 彈出視窗或文字輸入框內打字時，保留原生 Tab 焦點切換功能
            if (isSwalOpen || isModalOpen || activeTag === 'input' || (activeTag === 'textarea' && document.activeElement.id !== 'sideMemoArea')) {
                return;
            }

            // 按下 Tab 鍵切換記事本開關
            if (e.key === 'Tab' || e.code === 'Tab') {
                e.preventDefault();
                applyMemoCollapseState(!isMemoCollapsed);
                return;
            }

            if (activeTag === 'textarea' || activeTag === 'select') {
                return;
            }

            let changed = false;

            if (e.key === 'PageDown') {
                currentDate.setMonth(currentDate.getMonth() + 1);
                changed = true;
            } else if (e.key === 'PageUp') {
                currentDate.setMonth(currentDate.getMonth() - 1);
                changed = true;
            } else if (e.key === 'Home') {
                currentDate = new Date(); 
                changed = true;
            }

            if (changed) {
                e.preventDefault(); 
                renderCalendar();
            }
        });
        
        const calendarContainer = document.getElementById('calendarContainer');
        let wheelTimeout;
        calendarContainer.addEventListener('wheel', (e) => {
            e.preventDefault(); 
            if (wheelTimeout) return;
            if (e.deltaY > 0) currentDate.setMonth(currentDate.getMonth() + 1); 
            else currentDate.setMonth(currentDate.getMonth() - 1); 
            renderCalendar();
            wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 200); 
        }, { passive: false });

        let touchstartX = 0;
        let touchendX = 0;
        calendarContainer.addEventListener('touchstart', (e) => {
            touchstartX = e.changedTouches[0].screenX;
        }, { passive: true });

        calendarContainer.addEventListener('touchend', (e) => {
            touchendX = e.changedTouches[0].screenX;
            handleGesture();
        }, { passive: true });

        function handleGesture() {
            const swipeThreshold = 60; 
            if (touchstartX - touchendX > swipeThreshold) {
                currentDate.setMonth(currentDate.getMonth() + 1); 
                renderCalendar();
            } else if (touchendX - touchstartX > swipeThreshold) {
                currentDate.setMonth(currentDate.getMonth() - 1); 
                renderCalendar();
            }
        }

        document.getElementById('exportBtn').onclick = async () => {
            const memo = await dbGet(MEMO_KEY);
            const dataStr = JSON.stringify({ title: appTitle, events, memo: memo || "" }, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            a.href = url; a.download = `BC_${yyyy}-${mm}-${dd}.json`;
            a.click(); URL.revokeObjectURL(url);
        };

        const importInput = document.getElementById('importFile');
        document.getElementById('importBtn').onclick = () => importInput.click();
        
        importInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const importedData = JSON.parse(e.target.result);
                    const isArray = Array.isArray(importedData);
                    
                    if (isArray || (importedData && Array.isArray(importedData.events))) {
                        swalWithBootstrapButtons.fire({
                            title: '匯入資料', text: "您希望如何處理現有的行事曆資料？", icon: 'question',
                            width: 'auto', showDenyButton: true, showCancelButton: true,
                            confirmButtonText: '<i class="bi bi-plus-circle"></i> 合併至現有資料',
                            denyButtonText: '<i class="bi bi-exclamation-triangle"></i> 清除並完全覆寫',
                            cancelButtonText: '取消',
                            customClass: { confirmButton: 'btn btn-primary', denyButton: 'btn btn-danger', cancelButton: 'btn btn-secondary' }
                        }).then(async (result) => {
                            const newEvents = isArray ? importedData : importedData.events;
                            if (result.isConfirmed) {
                                events = events.concat(newEvents);
                                if (!isArray) {
                                    if (importedData.memo) { 
                                        document.getElementById('sideMemoArea').value = importedData.memo; 
                                        await saveMemoToDB(); 
                                    }
                                    if (importedData.title) updateAppTitle(importedData.title);
                                }
                                await saveNotesToDB(); renderCalendar();
                            } else if (result.isDenied) {
                                events = newEvents;
                                if (!isArray) {
                                    if (importedData.memo !== undefined) { 
                                        document.getElementById('sideMemoArea').value = importedData.memo; 
                                        await saveMemoToDB(); 
                                    }
                                    if (importedData.title) updateAppTitle(importedData.title);
                                }
                                await saveNotesToDB(); renderCalendar();
                            }
                        });
                    } else swalWithBootstrapButtons.fire({ icon: 'error', title: '錯誤', text: '無效的檔案格式！內容必須符合 JSON 結構。', confirmButtonText: '了解' });
                } catch (error) { swalWithBootstrapButtons.fire({ icon: 'error', title: '錯誤', text: '讀取檔案失敗！請確認內容為正確的 JSON 格式。', confirmButtonText: '了解' }); }
                importInput.value = ''; 
            };
            reader.readAsText(file);
        });

        document.getElementById('saveNoteBtn').onclick = async () => {
            const id = document.getElementById('currentEditId').value;
            const selectedDates = dateRangePicker.selectedDates;
            if (!selectedDates || selectedDates.length === 0) return swalWithBootstrapButtons.fire({ icon: 'warning', text: '請選擇日期' });
            
            const start = flatpickr.formatDate(selectedDates[0], "Y-m-d");
            const end = selectedDates.length > 1 ? flatpickr.formatDate(selectedDates[1], "Y-m-d") : start;
            const text = document.getElementById('noteTextarea').value.trim();
            const color = document.querySelector('input[name="noteColor"]:checked').value;
            
            const checkedIconRadio = document.querySelector('input[name="noteIcon"]:checked');
            let icon = checkedIconRadio ? checkedIconRadio.value : '📌';
            if (icon === 'CUSTOM') {
                const customVal = document.getElementById('customIconInput').value.trim();
                icon = customVal ? customVal : '📌';
            }

            const isHighlighted = document.getElementById('highlightCheckbox').checked;
            
            if (!text) return swalWithBootstrapButtons.fire({ icon: 'warning', text: '請輸入內容' });
            
            if (id) {
                const index = events.findIndex(e => e.id === id);
                events[index] = { id, start, end, text, color, icon, isHighlighted }; 
            } else {
                events.push({ id: generateId(), start, end, text, color, icon, isHighlighted }); 
            }
            await saveNotesToDB(); renderCalendar(); noteModal.hide();
        };

        document.getElementById('deleteNoteBtn').onclick = () => {
            swalWithBootstrapButtons.fire({ 
                title: '確定刪除？', icon: 'warning', showCancelButton: true, confirmButtonText: '確定', cancelButtonText: '取消', reverseButtons: true
            }).then(async (res) => {
                if (res.isConfirmed) {
                    events = events.filter(e => e.id !== document.getElementById('currentEditId').value);
                    await saveNotesToDB(); renderCalendar(); noteModal.hide();
                }
            });
        };

        document.getElementById('deleteOldBtn').addEventListener('click', () => {
            if (events.length === 0) return swalWithBootstrapButtons.fire({ icon: 'info', title: '提示', text: '沒有紀錄可刪除。', confirmButtonText: '了解' });
            swalWithBootstrapButtons.fire({
                title: '<span class="text-danger">刪除舊紀錄</span>',
                html: '<p class="text-muted fw-bold">選擇日期，將清除<br><b class="text-danger">該日期前</b>的所有行程。</p><input type="text" id="cutoffDateInput" class="form-control text-center mx-auto bg-white fw-bold text-dark" style="max-width: 200px; cursor: pointer;" readonly placeholder="選擇日期">',
                icon: 'warning', showCancelButton: true, confirmButtonText: '確定清除', cancelButtonText: '取消', reverseButtons: true,
                customClass: { confirmButton: 'btn btn-danger', cancelButton: 'btn btn-secondary' },
                didOpen: () => { flatpickr("#cutoffDateInput", { locale: "zh_tw", dateFormat: "Y-m-d", defaultDate: new Date() }); },
                preConfirm: () => {
                    const cutoffDate = document.getElementById('cutoffDateInput').value;
                    if (!cutoffDate) Swal.showValidationMessage('請選擇日期');
                    return cutoffDate;
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const cutoffDate = result.value;
                    const originalCount = events.length;
                    events = events.filter(e => { const eventEnd = e.end || e.start; return eventEnd >= cutoffDate; });
                    await saveNotesToDB(); renderCalendar();
                    swalWithBootstrapButtons.fire({ icon: 'success', title: '完成', text: `刪除了 ${originalCount - events.length} 筆紀錄。`, confirmButtonText: '了解' });
                }
            });
        });

        document.getElementById('clearAllBtn').addEventListener('click', () => {
            if (events.length === 0 && !document.getElementById('sideMemoArea').value) {
                return swalWithBootstrapButtons.fire({ icon: 'info', title: '提示', text: '沒有資料可清除。', confirmButtonText: '了解' });
            }
            swalWithBootstrapButtons.fire({
                title: '<span class="text-warning">⚠️</span> 嚴重警告',
                html: '<span class="fw-bold">確定要清除「所有」行事曆資料嗎？</span><br><br><b class="text-danger fs-5">此動作無法復原！</b>',
                showCancelButton: true, confirmButtonText: '<i class="bi bi-trash3"></i> 清空全部', cancelButtonText: '取消',
                customClass: { confirmButton: 'btn btn-danger', cancelButton: 'btn btn-secondary' }, reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    swalWithBootstrapButtons.fire({
                        title: '<span class="text-danger">❌</span> 最後確認', html: '<span class="text-muted fw-bold">資料一旦刪除就找不回來囉！確定嗎？</span>',
                        showCancelButton: true, confirmButtonText: '非常確定', cancelButtonText: '取消',
                        customClass: { confirmButton: 'btn btn-danger', cancelButton: 'btn btn-secondary' }, reverseButtons: true
                    }).then(async (finalResult) => {
                        if (finalResult.isConfirmed) {
                            events = []; await dbRemove(MEMO_KEY);
                            document.getElementById('sideMemoArea').value = "";
                            document.getElementById('sideMemoPreview').innerHTML = "";
                            await saveNotesToDB(); renderCalendar();
                            swalWithBootstrapButtons.fire({ icon: 'success', title: '已清空', text: '資料已經成功清除。', confirmButtonText: '了解' });
                        }
                    });
                }
            });
        });
    }
</script>
</body>
</html>
