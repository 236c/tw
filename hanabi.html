<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本職人競技花火大會 - 隅田川 Star Mine 連射特等席 (19大Combo旗艦版)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010207;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
            color: #f1f5f9;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* 頂部極簡玻璃擬態懸浮導覽列 */
        .top-nav {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 16, 32, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 6px 16px;
            border-radius: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            white-space: nowrap;
            max-width: 96vw;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .top-nav::-webkit-scrollbar {
            display: none;
        }

        .title-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.92rem;
            font-weight: 800;
            color: #facc15;
            letter-spacing: 0.8px;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
        }

        .fps-badge {
            font-size: 0.74rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-family: monospace;
        }

        .btn-ui {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #f8fafc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-ui:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn-ui.active {
            background: #2563eb;
            border-color: #60a5fa;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
            color: #ffffff;
        }

        .btn-combo {
            background: linear-gradient(135deg, #0284c7 0%, #3b82f6 50%, #8b5cf6 100%);
            border-color: #93c5fd;
            color: #fff;
            box-shadow: 0 0 14px rgba(59, 130, 246, 0.5);
            animation: pulse-combo 2.5s infinite;
        }
        @keyframes pulse-combo {
            0%, 100% { box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); }
            50% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.7); transform: scale(1.02); }
        }

        .btn-surprise {
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            border-color: #d8b4fe;
            color: #fff;
        }

        .btn-finale {
            background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
            border-color: #fca5a5;
            color: #fff;
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.45);
        }

        /* 側邊設定面板 */
        .drawer-panel {
            position: absolute;
            top: 70px;
            right: 18px;
            z-index: 30;
            width: 360px;
            max-height: calc(100vh - 90px);
            background: rgba(10, 16, 32, 0.96);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
            transform: translateX(400px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .drawer-panel.open {
            transform: translateX(0);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 14px;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 2px 6px;
        }

        .control-section {
            margin-bottom: 14px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 5px;
        }

        .control-input {
            width: 100%;
            padding: 7px 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
        }
        .control-input optgroup {
            background: #0d1527;
            color: #38bdf8;
            font-weight: 700;
        }
        .control-input option {
            background: #090e1a;
            color: #f1f5f9;
        }

        .range-slider {
            width: 100%;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        .combo-toast {
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            font-size: 0.88rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #facc15;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(250, 204, 21, 0.4);
            padding: 6px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .combo-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(4px);
        }

        .info-toast {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.55);
            pointer-events: none;
            letter-spacing: 0.8px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.9);
            background: rgba(8, 12, 24, 0.5);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 640px) {
            .top-nav { padding: 5px 10px; gap: 5px; top: 10px; }
            .btn-ui { padding: 4px 8px; font-size: 0.74rem; }
            .title-badge { font-size: 0.8rem; }
            .fps-badge { display: none; }
            .drawer-panel { width: 92vw; right: 4vw; }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="title-badge">🎆 隅田川競技花火</div>
        <div class="fps-badge" id="fpsDisplay">60 FPS</div>
        
        <button class="btn-ui active" id="autoLaunchBtn" title="自動巡航施放">

        <button class="btn-ui" id="fullscreenBtn" title="全螢幕模式">
            <span>⛶ 全螢幕</span>
        </button>

    <div class="combo-toast" id="comboToast">🦚 扇状ワイド・千輪扇型スターマイン</div>

class HanabiSoundEngine {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.compressor = null;
        this.convolver = null;
        this.noiseBuffer = null;
        this.crackleBuffer = null;
        this.activeVoices = 0;
        this.maxVoices = 20; // 放寬發聲數以容納長尾音與多重轟鳴
        this.lastCrackleTime = 0;
        this.lastGhostSoundTime = 0;
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
            
            // 動態壓縮器：保護揚聲器，並在多重爆炸時產生「被推擠」的物理音壓感
            this.compressor = this.ctx.createDynamicsCompressor();
            this.compressor.threshold.value = -12;
            this.compressor.knee.value = 10;
            this.compressor.ratio.value = 6;
            this.compressor.attack.value = 0.002;
            this.compressor.release.value = 0.2;
            this.compressor.connect(this.ctx.destination);

            // 廣域天空卷積混響：高頻迅速被空氣吸收，低頻殘響深遠
            this.convolver = this.ctx.createConvolver();
            const reverbLength = Math.round(this.ctx.sampleRate * 0.8); 
            const impulse = this.ctx.createBuffer(2, reverbLength, this.ctx.sampleRate);
            const leftData = impulse.getChannelData(0);
            const rightData = impulse.getChannelData(1);
            for (let i = 0; i < reverbLength; i++) {
                const t = i / this.ctx.sampleRate;
                const decay = Math.exp(-t * 5.0); // 延長衰減時間，營造更大空間
                const highFreqDamp = Math.max(0, 1 - (t * 4.0)); // 高頻吸收模擬
                leftData[i] = (Math.random() * 2 - 1) * decay * highFreqDamp * 0.4;
                rightData[i] = (Math.random() * 2 - 1) * decay * highFreqDamp * 0.4;
            }
            this.convolver.buffer = impulse;
            
            this.reverbGain = this.ctx.createGain();
            this.reverbGain.gain.value = 0.5; 
            this.convolver.connect(this.reverbGain);
            this.reverbGain.connect(this.compressor);

            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
            this.masterGain.connect(this.compressor); 
            this.masterGain.connect(this.convolver);  

            // 全頻段白雜訊 (用於高頻撕裂與低頻轟鳴的基底)
            const bufferSize = Math.round(this.ctx.sampleRate * 1.5);
            this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const output = this.noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            // 真實物理劈啪聲 (Acoustic Crackle) - 極度稀疏的突波 (Impulses)
            const crackleSize = Math.round(this.ctx.sampleRate * 0.4);
            this.crackleBuffer = this.ctx.createBuffer(1, crackleSize, this.ctx.sampleRate);
            const cOut = this.crackleBuffer.getChannelData(0);
            for (let i = 0; i < crackleSize; i++) {
                // 只有 0.8% 的機率出現爆音，但振幅極大，產生真實鞭炮般的清脆折斷聲
                cOut[i] = (Math.random() > 0.992) ? ((Math.random() * 2 - 1) * 1.5) : 0;
            }
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    }

    playLaunch(panRatio = 0, durationSec = 1.8, isTigerTail = false) {
        if (!soundEnabled) return;
        this.init();
        if (this.activeVoices >= this.maxVoices + 2) return;
        this.activeVoices++;

        const now = this.ctx.currentTime;
        const dur = Math.max(0.6, durationSec * (0.85 + Math.random() * 0.3));
        const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
        if (panner) panner.pan.value = Math.max(-0.8, Math.min(0.8, panRatio));
        const dest = panner ? panner : this.masterGain;
        if (panner) panner.connect(this.masterGain);

        // 1. 砲管發射共振 (Mortar Thump) - 真實彈體離開金屬管的低頻聲
        const thumpOsc = this.ctx.createOscillator();
        const thumpGain = this.ctx.createGain();
        thumpOsc.type = 'sine'; 
        thumpOsc.frequency.setValueAtTime(200 + Math.random() * 50, now);
        thumpOsc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
        thumpGain.gain.setValueAtTime(1.2, now);
        thumpGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        thumpOsc.connect(thumpGain).connect(dest);
        thumpOsc.start(now);
        thumpOsc.stop(now + 0.2);

        // 2. 空氣撕裂呼嘯聲 (Doppler Hiss)
        const noiseNode = this.ctx.createBufferSource();
        noiseNode.buffer = this.noiseBuffer;
        noiseNode.loop = true;
        const filter = this.ctx.createBiquadFilter();
        
        if (isTigerTail) {
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300 + Math.random() * 150, now);
            filter.frequency.linearRampToValueAtTime(1200 + Math.random() * 300, now + dur * 0.3);
            filter.frequency.exponentialRampToValueAtTime(100, now + dur);
        } else {
            filter.type = 'bandpass';
            filter.Q.value = 2.5 + Math.random() * 1.5; 
            filter.frequency.setValueAtTime(400 + Math.random() * 200, now);
            filter.frequency.exponentialRampToValueAtTime(2500 + Math.random() * 800, now + dur * 0.4);
            filter.frequency.exponentialRampToValueAtTime(300, now + dur);
        }

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.001, now);
        noiseGain.gain.linearRampToValueAtTime(isTigerTail ? 0.4 : 0.25, now + dur * 0.15);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        noiseNode.connect(filter).connect(noiseGain).connect(dest);
        noiseNode.start(now);
        noiseNode.stop(now + dur + 0.1);

        setTimeout(() => { this.activeVoices = Math.max(0, this.activeVoices - 1); }, (dur + 0.1) * 1000);
    }

    playBurst(caliberScale = 1.0, panRatio = 0, isSudden = false, isLush = false) {
        if (!soundEnabled) return;
        this.init();
        if (this.activeVoices >= this.maxVoices) return;
        this.activeVoices++;

        const now = this.ctx.currentTime;
        const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
        if (panner) panner.pan.value = Math.max(-0.9, Math.min(0.9, panRatio));
        const dest = panner ? panner : this.masterGain;
        if (panner) panner.connect(this.masterGain);

        // 引入高度隨機性，保證每發煙火的重量感與破裂感都完全不同
        const randomVariability = 0.75 + Math.random() * 0.5; 
        const scale = Math.min(1.8, Math.max(0.6, caliberScale)) * randomVariability;
        const dur = (isSudden ? 1.0 : (isLush ? 2.5 : 1.8)) * scale;

        // 1. 瞬態紙殼破裂音 (Transient Snap) - 極短的尖銳爆音
        const snapNoise = this.ctx.createBufferSource();
        snapNoise.buffer = this.noiseBuffer;
        const snapFilter = this.ctx.createBiquadFilter();
        snapFilter.type = 'highpass';
        snapFilter.frequency.value = isSudden ? 2000 : 800 + Math.random() * 1000;
        const snapGain = this.ctx.createGain();
        snapGain.gain.setValueAtTime(2.5, now);
        snapGain.gain.exponentialRampToValueAtTime(0.01, now + 0.08 + Math.random() * 0.04);
        snapNoise.connect(snapFilter).connect(snapGain).connect(dest);
        snapNoise.start(now);
        snapNoise.stop(now + 0.15);

        // 2. 星玉擴散燃燒聲 (Chemical Sizzle)
        const sizzleNoise = this.ctx.createBufferSource();
        sizzleNoise.buffer = this.noiseBuffer;
        const sizzleFilter = this.ctx.createBiquadFilter();
        sizzleFilter.type = 'bandpass';
        sizzleFilter.frequency.setValueAtTime(3000 + Math.random() * 2000, now);
        sizzleFilter.frequency.exponentialRampToValueAtTime(800, now + dur * 0.5);
        const sizzleGain = this.ctx.createGain();
        sizzleGain.gain.setValueAtTime(0.6, now);
        sizzleGain.gain.exponentialRampToValueAtTime(0.01, now + dur * 0.6);
        sizzleNoise.connect(sizzleFilter).connect(sizzleGain).connect(dest);
        sizzleNoise.start(now);
        sizzleNoise.stop(now + dur * 0.6 + 0.1);

        // 3. 爆炸實體衝擊 (Physical Punch) - 快速下潛的三角波
        const punchOsc = this.ctx.createOscillator();
        punchOsc.type = 'triangle'; 
        punchOsc.frequency.setValueAtTime(150 / scale, now);
        punchOsc.frequency.exponentialRampToValueAtTime(30 / scale, now + 0.12);
        const punchGain = this.ctx.createGain();
        punchGain.gain.setValueAtTime(1.8 * scale, now); 
        punchGain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        punchOsc.connect(punchGain).connect(dest);
        punchOsc.start(now);
        punchOsc.stop(now + 0.3);

        // 4. 空氣置換轟鳴 (Air Displacement Rumble) - 真正的爆炸雷聲，非電子合成音
        const rumbleNoise = this.ctx.createBufferSource();
        rumbleNoise.buffer = this.noiseBuffer;
        const rumbleFilter = this.ctx.createBiquadFilter();
        rumbleFilter.type = 'lowpass';
        // 嚴格截斷高頻，只保留渾厚的低頻空氣震動
        rumbleFilter.frequency.setValueAtTime(120 + Math.random() * 80, now); 
        const rumbleGain = this.ctx.createGain();
        rumbleGain.gain.setValueAtTime(0.001, now);
        // 轟鳴聲會稍晚幾毫秒到達最高點，創造出巨大能量推開空氣的延遲感
        rumbleGain.gain.exponentialRampToValueAtTime(2.2 * scale, now + 0.08); 
        rumbleGain.gain.exponentialRampToValueAtTime(0.001, now + dur * 1.2);
        rumbleNoise.connect(rumbleFilter).connect(rumbleGain).connect(dest);
        rumbleNoise.start(now);
        rumbleNoise.stop(now + dur * 1.2 + 0.1);

        // 5. 城市建築群反射延遲 (Slapback Echo)
        if (Math.random() > 0.3 && !isSudden) {
            const echoDelay = this.ctx.createDelay();
            echoDelay.delayTime.value = 0.05 + Math.random() * 0.08; 
            const echoGain = this.ctx.createGain();
            echoGain.gain.value = 0.25 + Math.random() * 0.35;
            
            snapGain.connect(echoGain);
            punchGain.connect(echoGain);
            echoGain.connect(echoDelay).connect(dest);
        }

        setTimeout(() => { this.activeVoices = Math.max(0, this.activeVoices - 1); }, (dur * 1.2 + 0.1) * 1000);
    }

    playCrackle(panRatio = 0) {
        if (!soundEnabled || !this.crackleBuffer) return;
        this.init();
        const now = this.ctx.currentTime;
        if (now - this.lastCrackleTime < 0.04) return;
        this.lastCrackleTime = now;

        const src = this.ctx.createBufferSource();
        src.buffer = this.crackleBuffer; // 使用新寫的超高對比度突波陣列
        src.playbackRate.value = 0.6 + Math.random() * 0.8;
        
        // 使用帶通濾波器雕塑出真實的「木柴斷裂/鞭炮」頻段
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 2500 + Math.random() * 3000;
        filter.Q.value = 0.8 + Math.random() * 1.5;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.8 + Math.random() * 0.4, now + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12); 

        const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
        if (panner) {
            panner.pan.value = Math.max(-0.8, Math.min(0.8, panRatio));
            src.connect(filter).connect(gain).connect(panner).connect(this.masterGain);
        } else {
            src.connect(filter).connect(gain).connect(this.masterGain);
        }
        src.start(now);
    }

    playGhostReignite(panRatio = 0) {
        if (!soundEnabled) return;
        this.init();
        const now = this.ctx.currentTime;
        if (now - this.lastGhostSoundTime < 0.08) return;
        this.lastGhostSoundTime = now;
        
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 2.0 + Math.random() * 2.0; 
        filter.frequency.setValueAtTime(300 + Math.random() * 200, now);
        filter.frequency.exponentialRampToValueAtTime(1500 + Math.random() * 1000, now + 0.15);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

        const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
        const dest = panner ? panner : this.masterGain;
        if (panner) {
            panner.pan.value = Math.max(-0.8, Math.min(0.8, panRatio));
            panner.connect(this.masterGain);
        }
        
        noise.connect(filter).connect(gain).connect(dest);
        noise.start(now);
        noise.stop(now + 0.3);
    }
}

/**

function buildRomanticScenery() {
    sceneryCanvas.width = canvas.width;
    sceneryCanvas.height = canvas.height;
    const sctx = sceneryCtx;
    sctx.save();
    sctx.scale(dpr, dpr);

    const horizonY = height * 0.82;

    const skyGrad = sctx.createLinearGradient(0, 0, 0, horizonY);
    skyGrad.addColorStop(0, '#010207');
    skyGrad.addColorStop(0.7, '#040714');
    skyGrad.addColorStop(1, '#091024');
    sctx.fillStyle = skyGrad;
    sctx.fillRect(0, 0, width, horizonY);

    const fujiX = width * 0.28;
    const fujiPeakY = horizonY - height * 0.16;
    const fujiBaseW = width * 0.32;
    sctx.fillStyle = '#060a16';
    sctx.beginPath();
    sctx.moveTo(fujiX - fujiBaseW * 0.5, horizonY);
    sctx.quadraticCurveTo(fujiX - fujiBaseW * 0.22, horizonY - height * 0.08, fujiX - 16, fujiPeakY);
    sctx.lineTo(fujiX + 16, fujiPeakY);
    sctx.quadraticCurveTo(fujiX + fujiBaseW * 0.22, horizonY - height * 0.08, fujiX + fujiBaseW * 0.5, horizonY);
    sctx.closePath();
    sctx.fill();

    sctx.fillStyle = '#050814';
    const bCount = Math.floor(width / 34);
    for (let i = 0; i < bCount; i++) {
        const bx = i * 36;
        const bw = 24 + ((i * 17) % 18);
        const bh = 14 + ((i * 31) % 45);
        sctx.fillRect(bx, horizonY - bh, bw, bh);

        if (i % 2 === 0) {
            sctx.fillStyle = (i % 4 === 0) ? 'rgba(56, 189, 248, 0.24)' : 'rgba(253, 224, 71, 0.26)';
            for (let wy = horizonY - bh + 4; wy < horizonY - 4; wy += 7) {
                sctx.fillRect(bx + 4, wy, 2.5, 3);
                if (bw > 26) sctx.fillRect(bx + 11, wy, 2.5, 3);
            }
            sctx.fillStyle = '#050814';
        }
    }

    // 東京晴空塔 (Tokyo Skytree) 比例精修
    const skytreeX = width * 0.72;
    const skytreeHeight = Math.min(height * 0.38, 380); 
    const deck1Y = horizonY - skytreeHeight * 0.65;
    const deck2Y = horizonY - skytreeHeight * 0.80;
    const topY = horizonY - skytreeHeight;
    const baseW = 26;
    const deck1W = 16;
    const deck2W = 10;
    const spireW = 1.5;

    // 心柱 (Shimbashira)
    const coreGrad = sctx.createLinearGradient(skytreeX - baseW/3, 0, skytreeX + baseW/3, 0);
    coreGrad.addColorStop(0, 'rgba(2, 6, 23, 0.8)');
    coreGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.22)'); 
    coreGrad.addColorStop(1, 'rgba(2, 6, 23, 0.8)');
    
    sctx.fillStyle = coreGrad;
    sctx.beginPath();
    sctx.moveTo(skytreeX - baseW/3, horizonY);
    sctx.lineTo(skytreeX - deck1W/3, deck1Y);
    sctx.lineTo(skytreeX + deck1W/3, deck1Y);
    sctx.lineTo(skytreeX + baseW/3, horizonY);
    sctx.fill();

    // 外部鋼骨輪廓
    sctx.fillStyle = 'rgba(6, 10, 20, 0.6)';
    sctx.beginPath();
    sctx.moveTo(skytreeX - baseW/2, horizonY);
    sctx.quadraticCurveTo(skytreeX - deck1W/2 - 1, horizonY - skytreeHeight * 0.3, skytreeX - deck1W/2, deck1Y);
    sctx.lineTo(skytreeX + deck1W/2, deck1Y);
    sctx.quadraticCurveTo(skytreeX + deck1W/2 + 1, horizonY - skytreeHeight * 0.3, skytreeX + baseW/2, horizonY);
    sctx.fill();

    sctx.beginPath();
    sctx.moveTo(skytreeX - deck1W/2 + 1, deck1Y - 8);
    sctx.lineTo(skytreeX - deck2W/2, deck2Y);
    sctx.lineTo(skytreeX + deck2W/2, deck2Y);
    sctx.lineTo(skytreeX + deck1W/2 - 1, deck1Y - 8);
    sctx.fill();

    sctx.beginPath();
    sctx.moveTo(skytreeX - deck2W/2 + 1, deck2Y - 6);
    sctx.lineTo(skytreeX - spireW/2, topY);
    sctx.lineTo(skytreeX + spireW/2, topY);
    sctx.lineTo(skytreeX + deck2W/2 - 1, deck2Y - 6);
    sctx.fill();

    // 細緻鋼骨紋理 (Truss)
    sctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
    sctx.lineWidth = 0.6;
    sctx.beginPath();
    for (let y = horizonY; y > deck1Y; y -= 6) {
        let prog = (horizonY - y) / (horizonY - deck1Y);
        let currW = baseW - (baseW - deck1W) * prog;
        let nextProg = (horizonY - (y - 6)) / (horizonY - deck1Y);
        let nextW = baseW - (baseW - deck1W) * nextProg;
        
        sctx.moveTo(skytreeX - currW/2, y);
        sctx.lineTo(skytreeX + nextW/2, y - 6);
        sctx.moveTo(skytreeX + currW/2, y);
        sctx.lineTo(skytreeX - nextW/2, y - 6);
        if (y % 12 === 0) {
            sctx.moveTo(skytreeX - currW/2, y);
            sctx.lineTo(skytreeX + currW/2, y);
        }
    }
    sctx.stroke();

    // 第一觀景台 (天望甲板)
    sctx.fillStyle = '#050812';
    sctx.fillRect(skytreeX - deck1W/2 - 1.5, deck1Y - 10, deck1W + 3, 10);
    sctx.fillStyle = '#0a1122';
    sctx.fillRect(skytreeX - deck1W/2 - 2.5, deck1Y - 8, deck1W + 5, 4);
    
    sctx.fillStyle = 'rgba(224, 242, 254, 0.6)';
    sctx.shadowColor = 'rgba(125, 211, 252, 0.4)';
    sctx.shadowBlur = 4;
    for(let i=0; i<3; i++) {
        sctx.fillRect(skytreeX - deck1W/2 + 1, deck1Y - 3 - i*3, deck1W - 2, 1.2);
    }
    sctx.shadowBlur = 0;

    // 第二觀景台 (天望回廊)
    sctx.fillStyle = '#0a1122';
    sctx.beginPath();
    sctx.moveTo(skytreeX - deck2W/2 - 1.5, deck2Y);
    sctx.lineTo(skytreeX + deck2W/2 + 1.5, deck2Y - 1);
    sctx.lineTo(skytreeX + deck2W/2 + 0.5, deck2Y - 6);
    sctx.lineTo(skytreeX - deck2W/2 - 0.5, deck2Y - 5);
    sctx.closePath();
    sctx.fill();

    sctx.fillStyle = 'rgba(224, 242, 254, 0.7)';
    sctx.shadowColor = 'rgba(125, 211, 252, 0.4)';
    sctx.shadowBlur = 3;
    sctx.beginPath();
    sctx.moveTo(skytreeX - deck2W/2 - 1, deck2Y - 1);
    sctx.lineTo(skytreeX + deck2W/2 + 1, deck2Y - 2.5);
    sctx.lineTo(skytreeX + deck2W/2 + 1, deck2Y - 3.5);
    sctx.lineTo(skytreeX - deck2W/2 - 1, deck2Y - 2);
    sctx.fill();
    sctx.shadowBlur = 0;

    const waterGrad = sctx.createLinearGradient(0, horizonY, 0, height);
    waterGrad.addColorStop(0, '#040713');
    waterGrad.addColorStop(0.5, '#02040b');
    waterGrad.addColorStop(1, '#010206');
    sctx.fillStyle = waterGrad;
    sctx.fillRect(0, horizonY, width, height - horizonY);

    const reflGrad = sctx.createLinearGradient(0, horizonY, 0, horizonY + skytreeHeight * 0.25);
    reflGrad.addColorStop(0, 'rgba(56, 189, 248, 0.08)');
    reflGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
    sctx.fillStyle = reflGrad;
    sctx.beginPath();
    sctx.moveTo(skytreeX - baseW/2, horizonY);
    sctx.lineTo(skytreeX + baseW/2, horizonY);
    sctx.lineTo(skytreeX + 8, horizonY + skytreeHeight * 0.25);
    sctx.lineTo(skytreeX - 8, horizonY + skytreeHeight * 0.25);
    sctx.fill();

    sctx.strokeStyle = 'rgba(56, 189, 248, 0.16)';
    sctx.lineWidth = 1;
    sctx.beginPath();
    sctx.moveTo(0, horizonY);
    sctx.lineTo(width, horizonY);
    sctx.stroke();

    sctx.fillStyle = '#03050c';
    sctx.beginPath();
    sctx.moveTo(width * 0.58, height);
    sctx.quadraticCurveTo(width * 0.78, horizonY + (height - horizonY) * 0.35, width, horizonY + (height - horizonY) * 0.18);
    sctx.lineTo(width, height);
    sctx.closePath();
    sctx.fill();

    const benchX = width * 0.88;
    const benchY = height - 34;

    sctx.strokeStyle = '#080d1e';
    sctx.lineWidth = 3.5;
    sctx.beginPath();
    sctx.moveTo(benchX - 22, benchY);
    sctx.lineTo(benchX + 22, benchY);
    sctx.moveTo(benchX - 16, benchY);
    sctx.lineTo(benchX - 16, benchY + 12);
    sctx.moveTo(benchX + 16, benchY);
    sctx.lineTo(benchX + 16, benchY + 12);
    sctx.stroke();

    sctx.fillStyle = '#060a17';
    sctx.beginPath();
    sctx.arc(benchX - 5, benchY - 18, 5, 0, Math.PI * 2);
    sctx.fill();
    sctx.fillRect(benchX - 9, benchY - 13, 9, 13);
    sctx.beginPath();
    sctx.arc(benchX + 4, benchY - 16, 4.5, 0, Math.PI * 2);
    sctx.fill();
    sctx.beginPath();
    sctx.moveTo(benchX - 1, benchY - 12);
    sctx.lineTo(benchX + 8, benchY - 1);
    sctx.lineTo(benchX, benchY - 1);
    sctx.closePath();
    sctx.fill();

    sctx.strokeStyle = '#05070f';
    sctx.lineWidth = 1.8;
    for (let k = 0; k < 6; k++) {
        const rootX = width - (k * 22);
        sctx.beginPath();
        sctx.moveTo(rootX, 0);
        sctx.bezierCurveTo(rootX - 15, 40 + k * 8, rootX - 35, 70 + k * 12, rootX - 22, 110 + k * 14);
        sctx.stroke();
    }

    sctx.restore();
}

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.25);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildRomanticScenery();
}
window.addEventListener('resize', resize);
resize();

function launchRocket(targetX = null, targetY = null, customStyleId = null, forceSudden = false, options = {}) {
    const horizonY = height * 0.82;
    const destX = targetX !== null ? targetX : (width * 0.15 + Math.random() * width * 0.7);
    const destY = targetY !== null ? targetY : (height * 0.12 + Math.random() * height * 0.38);

    let styleId = customStyleId || currentStyleId;
    
    if (styleId === 'all') {
        const available = HANABI_STYLES_CATALOG.filter(s => s.id !== 'all' && s.id !== 'random_lush');
        styleId = available[Math.floor(Math.random() * available.length)].id;
    } else if (styleId === 'random_lush') {
        const available = HANABI_STYLES_CATALOG.filter(s => s.isLush);
        if (available.length > 0) {
            styleId = available[Math.floor(Math.random() * available.length)].id;
        } else {
            styleId = HANABI_STYLES_CATALOG[1].id;
        }
    }
    
    const style = HANABI_STYLES_CATALOG.find(s => s.id === styleId) || HANABI_STYLES_CATALOG[1];

    if (forceSudden) {
        explodeRocketDirect(destX, destY, style, true, options.densityMult || 1.0);
        return;
    }

    const startX = options.startX !== undefined ? options.startX : (width * (0.2 + Math.random() * 0.6));
    const startY = horizonY + 8;
    const durationMultiplier = options.durationMult || 1.0;
    const totalDuration = Math.round(ascentBaseSteps * durationMultiplier * (0.94 + Math.random() * 0.12));

    const panRatio = (destX / width) * 2 - 1;
    soundEngine.playLaunch(panRatio, (totalDuration / 60), options.isTigerTail);

    rockets.push({
        startX,
        startY,
        targetX: destX,
        targetY: destY,
        x: startX,
        y: startY,
        px: startX,
        py: startY,
        ppx: startX,
        ppy: startY,
        style,
        t: 0,
        totalDuration,
        isTigerTail: !!options.isTigerTail,
        densityMult: options.densityMult || 1.0,
        colorOverride: options.colorOverride || null
    });
}

function showComboToast(title) {
    const toast = document.getElementById('comboToast');
    toast.textContent = title;
    toast.classList.add('show');
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 2800);
}

    }
    const comboInfo = STARMINE_COMBOS.find(c => c.id === comboKey) || STARMINE_COMBOS[0];

        const count = 7;

        }
    }
    else if (comboKey === 'golden_climax') {
        const count = 10;
        for (let i = 0; i < count; i++) {
            setTimeout(() => {
                const tx = width * 0.1 + Math.random() * (width * 0.8);
                const ty = height * (0.1 + Math.random() * 0.2);
                const styles = ['lush_kamuro_curtain', 'gold_willow_dragon', 'senrin_gold', 'kamuro_saki_wari'];
                const st = styles[i % styles.length];
                launchRocket(tx, ty, st, false, { durationMult: 0.8, densityMult: 0.8, isTigerTail: true });
                if (i === count - 1) setTimeout(() => { isComboActive = false; }, 3500);
            }, i * 150);
        }
    }
    else if (comboKey === 'random_lush_rush') {
        const count = 8;
        for (let i = 0; i < count; i++) {
            setTimeout(() => {
                const tx = width * 0.15 + Math.random() * (width * 0.70);
                const ty = height * 0.12 + Math.random() * (height * 0.25);
                launchRocket(tx, ty, 'random_lush', false, { durationMult: 0.85, densityMult: 0.85, isTigerTail: Math.random() > 0.5 });
                if (i === count - 1) setTimeout(() => { isComboActive = false; }, 3200);
            }, i * 160);
        }
    }
}

const MAX_GLOBAL_STARS = 1350;

function explodeRocketDirect(x, y, style, isSudden = false, densityScale = 1.0, colorOverride = null) {
    ambientFlashes.push({
        x,
        y,
        radius: Math.min(width, height) * (style.isLush ? 0.7 : 0.55) * caliberMultiplier,
        color: isSudden ? '#ffffff' : (colorOverride || (style.colors ? style.colors[0] : '#ffffff')),
        alpha: isSudden ? 0.45 : (style.isLush ? 0.35 : 0.26)
    });

    const panRatio = (x / width) * 2 - 1;
    soundEngine.playBurst(caliberMultiplier, panRatio, isSudden, !!style.isLush);

    let loadFactor = 1.0;
    if (stars.length > 400) {
        loadFactor = Math.max(0.4, (MAX_GLOBAL_STARS - stars.length) / (MAX_GLOBAL_STARS - 400));
    }

    // 依據動態品質因數調節生成的粒子量，避免低端硬體掉幀
    const baseCount = Math.round(style.particles * particleMult * caliberMultiplier * densityScale * loadFactor * perfQuality);
    const totalCount = Math.max(45, baseCount);
    const speedMult = Math.max(1.0, (height / 850)) * caliberMultiplier;
    const baseSpeed = style.baseSpeed * speedMult;
    const baseLifetime = style.cutoffLifetime || 110;

    for (let k = 0; k < totalCount; k++) {
        let vx = 0, vy = 0;
        let color = colorOverride || (style.colors ? style.colors[k % style.colors.length] : '#ffffff');
        let radius = style.isLush ? 2.1 : 1.9;
        let bloomDelay = 0;

        if (style.id === 'gosin_kiku' && !colorOverride) {
            const angle = (k / totalCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.03;
            const layer = k % 5;
            if (layer === 0) { vx = Math.cos(angle) * (baseSpeed * 0.22); vy = Math.sin(angle) * (baseSpeed * 0.22); color = style.core5[0]; }
            else if (layer === 1) { vx = Math.cos(angle) * (baseSpeed * 0.42); vy = Math.sin(angle) * (baseSpeed * 0.42); color = style.core4[0]; }
            else if (layer === 2) { vx = Math.cos(angle) * (baseSpeed * 0.64); vy = Math.sin(angle) * (baseSpeed * 0.64); color = style.core3[0]; }
            else if (layer === 3) { vx = Math.cos(angle) * (baseSpeed * 0.88); vy = Math.sin(angle) * (baseSpeed * 0.88); color = style.core2[0]; }
            else { vx = Math.cos(angle) * (baseSpeed * 1.12); vy = Math.sin(angle) * (baseSpeed * 1.12); color = style.colors[k % style.colors.length]; }
        } else if (style.isRing && !colorOverride) {
            const isCore = (k < totalCount * 0.25);
            if (isCore) {
                const angle = Math.random() * Math.PI * 2;
                const sp = baseSpeed * 0.35 * Math.random();
                vx = Math.cos(angle) * sp;
                vy = Math.sin(angle) * sp;
                color = style.coreColors[0];
            } else {
                const angle = (k / (totalCount * 0.75)) * Math.PI * 2;
                const ringTilt = 0.38;
                vx = Math.cos(angle) * (baseSpeed * 1.15);
                vy = Math.sin(angle) * (baseSpeed * 1.15 * ringTilt) - (vx * 0.25);
                color = style.colors[k % style.colors.length];
            }
        } else if (style.decayProfile === 'danzaki' && !colorOverride) {
            const angle = (k / totalCount) * Math.PI * 2;
            const layer = k % 3;
            if (layer === 0) {
                vx = Math.cos(angle) * (baseSpeed * 0.38);
                vy = Math.sin(angle) * (baseSpeed * 0.38);
                color = style.coreColors[0];
                bloomDelay = 0;
            } else if (layer === 1) {
                vx = Math.cos(angle) * (baseSpeed * 0.75);
                vy = Math.sin(angle) * (baseSpeed * 0.75);
                color = style.middleColors[0];
                bloomDelay = 14;
            } else {
                vx = Math.cos(angle) * (baseSpeed * 1.12);
                vy = Math.sin(angle) * (baseSpeed * 1.12);
                color = style.colors[0];
                bloomDelay = 28;
            }
        } else if (style.id === 'peacock_feather' || style.isPeacock) {
            const fanAngle = -Math.PI * 0.95 + (k / totalCount) * Math.PI * 0.9;
            const sp = baseSpeed * (0.85 + Math.random() * 0.3);
            vx = Math.cos(fanAngle) * sp * 1.2;
            vy = Math.sin(fanAngle) * sp;
        } else if (style.isDoubleRing) {
            const isCore = (k < totalCount * 0.4);
            const countPart = isCore ? (totalCount * 0.4) : (totalCount * 0.6);
            const angle = (k / countPart) * Math.PI * 2;
            const ringTilt = 0.38;
            const sp = isCore ? (baseSpeed * 0.6) : (baseSpeed * 1.15);
            vx = Math.cos(angle) * sp;
            vy = Math.sin(angle) * (sp * ringTilt) - (vx * 0.25);
            color = isCore ? style.coreColors[0] : style.colors[k % style.colors.length];
        } else if (style.isHeart) {
            const t = (k / totalCount) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const scale = baseSpeed * 0.055;
            vx = hx * scale;
            vy = -hy * scale; 
        } else if (style.isSmiley) {
            let ptX = 0, ptY = 0;
            if (k < totalCount * 0.6) {
                const t = (k / (totalCount * 0.6)) * Math.PI * 2;
                ptX = Math.cos(t) * 16; ptY = Math.sin(t) * 16;
            } else if (k < totalCount * 0.65) {
                ptX = -6; ptY = -5; 
            } else if (k < totalCount * 0.70) {
                ptX = 6; ptY = -5;
            } else {
                const t = ((k - totalCount * 0.70) / (totalCount * 0.30));
                const a = Math.PI * 0.15 + t * Math.PI * 0.7;
                ptX = Math.cos(a) * 10; ptY = Math.sin(a) * 10;
            }
            const scale = baseSpeed * 0.055;
            vx = ptX * scale;
            vy = ptY * scale;
            color = style.colors[0];
        } else if (style.id === 'lush_mangekyo_hanabi' && !colorOverride) {
            const angle = (k / totalCount) * Math.PI * 2;
            const layer = k % 6;
            const ringSpeeds = [0.25, 0.45, 0.65, 0.85, 1.05, 1.25];
            const sp = baseSpeed * ringSpeeds[layer] * (0.95 + Math.random() * 0.1);
            vx = Math.cos(angle) * sp;
            vy = Math.sin(angle) * sp;
            color = style.colors[layer % style.colors.length];
        } else if (style.isSenrin) {
            const clusters = style.isLush ? 8 : 6;
            const cIdx = k % clusters;
            const cAngle = (cIdx / clusters) * Math.PI * 2;
            const cx = Math.cos(cAngle) * (baseSpeed * 0.52);
            const cy = Math.sin(cAngle) * (baseSpeed * 0.52);
            const subA = Math.random() * Math.PI * 2;
            const subSp = baseSpeed * 0.54 * (0.65 + Math.random() * 0.5);
            vx = cx + Math.cos(subA) * subSp;
            vy = cy + Math.sin(subA) * subSp;
        } else if (style.id === 'yashi_ginpa') {
            const angle = -Math.PI * 0.85 + (k / totalCount) * Math.PI * 1.7;
            const sp = baseSpeed * (0.9 + Math.random() * 0.4);
            vx = Math.cos(angle) * sp * 1.1;
            vy = Math.sin(angle) * sp * 0.9;
        } else {
            const angle = (k / totalCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.08;
            const sp = baseSpeed * (0.86 + Math.random() * 0.28);
            vx = Math.cos(angle) * sp;
            vy = Math.sin(angle) * sp;
        }

        const lifetimeJitter = (Math.random() - 0.5) * (baseLifetime * 0.4);
        const individualLifetime = Math.max(56, Math.round(baseLifetime + lifetimeJitter));
        const individualDrag = style.airDrag * (0.99 + Math.random() * 0.02);

        stars.push({
            x, y,
            x1: x, y1: y,
            x2: x, y2: y,
            x3: x, y3: y,
            vx, vy,
            alpha: 1.0,
            style,
            drag: individualDrag,
            color,
            radius,
            age: 0,
            cutoffLifetime: individualLifetime,
            fadeDuration: Math.round(individualLifetime * (0.22 + Math.random() * 0.12)),
            phase: Math.random() * Math.PI * 2,
            wobbleSpeed: 0.25 + Math.random() * 0.2,
            sakiWariAge: Math.round((style.sakiWariAge || 72) + (Math.random() - 0.5) * 12),
            sakiWariTriggered: false,
            ghostReignited: false,
            bloomDelay,
            isEven: (k & 1) === 0
        });
    }
}

function renderDynamicBoats(now) {
    const horizonY = height * 0.82;
    const boats = [
        { x: width * 0.36, y: horizonY + 22, size: 28, lanternColor: '#f59e0b' },
        { x: width * 0.52, y: horizonY + 44, size: 38, lanternColor: '#ef4444' }
    ];

    boats.forEach((b, idx) => {
        const bob = Math.sin(now * 0.002 + idx * 2.2) * 1.5;
        const by = b.y + bob;

        ctx.fillStyle = '#060a16';
        ctx.beginPath();
        ctx.moveTo(b.x - b.size, by + 4);
        ctx.lineTo(b.x + b.size, by + 4);
        ctx.lineTo(b.x + b.size * 0.75, by + 12);
        ctx.lineTo(b.x - b.size * 0.75, by + 12);
        ctx.closePath();
        ctx.fill();

        ctx.fillRect(b.x - b.size * 0.5, by - 6, b.size, 8);

        const lCount = 3;
        for (let li = 0; li < lCount; li++) {
            const lx = b.x - b.size * 0.35 + (li / (lCount - 1)) * (b.size * 0.7);
            const ly = by - 1;
            const flicker = 0.75 + Math.sin(now * 0.008 + li + idx) * 0.25;

            ctx.fillStyle = b.lanternColor;
            ctx.globalAlpha = flicker;
            ctx.fillRect(lx - 2, ly - 2, 4, 4);

            if (showReflection && perfQuality > 0.75) {
                const refH = 24 + idx * 8;
                ctx.fillStyle = b.lanternColor;
                ctx.globalAlpha = flicker * 0.22;
                ctx.fillRect(lx - 1.5, by + 12, 3, refH);
            }
        }
    });

    const skytreeX = width * 0.72;
    const skytreeHeight = Math.min(height * 0.38, 380); 
    const topY = horizonY - skytreeHeight;
    const beaconPulse = Math.pow(Math.max(0, Math.sin(now * 0.002)), 3);
    if (beaconPulse > 0.05) {
        ctx.fillStyle = '#ef4444';
        ctx.globalAlpha = beaconPulse * 0.6;
        ctx.fillRect(skytreeX - 1, topY - 1, 2, 2);
    }
}

function animate(now) {
    requestAnimationFrame(animate);

    // 硬體偵測：依據即時影格耗時動態調整負載
    const delta = now - lastFrameTime;
    lastFrameTime = now;
    if (delta > 22) { // 低於 45 FPS
        perfQuality = Math.max(0.65, perfQuality - 0.02);
    } else if (delta < 17 && perfQuality < 1.0) { // 穩定 60 FPS
        perfQuality = Math.min(1.0, perfQuality + 0.005);
    }

    frameCount++;
    if (now - lastFpsUpdateTime >= 500) {
        const fps = Math.round((frameCount * 1000) / (now - lastFpsUpdateTime));
        frameCount = 0;
        lastFpsUpdateTime = now;
        fpsDisplay.textContent = `${fps} FPS`;
    }

    // 渲染背景底圖
    ctx.drawImage(sceneryCanvas, 0, 0, width, height);
    renderDynamicBoats(now);

    const horizonY = height * 0.82;

    for (let i = ambientFlashes.length - 1; i >= 0; i--) {
        const fl = ambientFlashes[i];
        ctx.globalAlpha = fl.alpha;
        ctx.drawImage(FLASH_TEXTURE, fl.x - fl.radius, fl.y - fl.radius, fl.radius * 2, fl.radius * 2);
        fl.alpha *= 0.92;
        fl.alpha -= 0.01;
        if (fl.alpha <= 0.01) {
            ambientFlashes[i] = ambientFlashes[ambientFlashes.length - 1];
            ambientFlashes.pop();
        }
    }

    ctx.globalCompositeOperation = 'lighter';

    for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.t++;
        const prog = Math.min(1.0, r.t / r.totalDuration);
        const ease = 1 - (1 - prog) * (1 - prog);

        r.ppx = r.px; r.ppy = r.py;
        r.px = r.x; r.py = r.y;
        r.x = r.startX + (r.targetX - r.startX) * prog;
        r.y = r.startY - (r.startY - r.targetY) * ease;

        if (r.isTigerTail) {
            if (ascentSparks.length < 80) {
                ascentSparks.push({
                    x: r.x + (Math.random() - 0.5) * 6,
                    y: r.y + Math.random() * 4,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: 0.6 + Math.random() * 0.9,
                    alpha: 0.9, decay: 0.035, isTiger: true
                });
            }
        } else if (ascentSparks.length < 45 && Math.random() > 0.45) {
            ascentSparks.push({
                x: r.x + (Math.random() - 0.5) * 3,
                y: r.y,
                vx: (Math.random() - 0.5) * 0.35,
                vy: 0.3 + Math.random() * 0.5,
                alpha: 0.75 * trailAlphaScale, decay: 0.026, isTiger: false
            });
        }

        ctx.beginPath();
        ctx.moveTo(r.ppx, r.ppy);
        ctx.lineTo(r.x, r.y);
        ctx.strokeStyle = r.isTigerTail ? 'rgba(251, 191, 36, 0.85)' : `rgba(255, 250, 235, ${0.95 * trailAlphaScale})`;
        ctx.lineWidth = r.isTigerTail ? 3.0 : 1.2;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(r.x - 1.2, r.y - 1.2, 2.4, 2.4);

        if (r.t >= r.totalDuration) {
            explodeRocketDirect(r.targetX, r.targetY, r.style, false, r.densityMult, r.colorOverride);
            rockets[i] = rockets[rockets.length - 1];
            rockets.pop();
        }
    }

    for (let i = ascentSparks.length - 1; i >= 0; i--) {
        const sp = ascentSparks[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.alpha -= sp.decay;
        if (sp.alpha <= 0) {
            ascentSparks[i] = ascentSparks[ascentSparks.length - 1];
            ascentSparks.pop();
            continue;
        }
        ctx.fillStyle = sp.isTiger ? `rgba(251, 191, 36, ${sp.alpha})` : `rgba(254, 215, 170, ${sp.alpha})`;
        ctx.fillRect(sp.x, sp.y, sp.isTiger ? 2.0 : 1.3, sp.isTiger ? 2.0 : 1.3);
    }

    // 將線條端點類型提前設定，省去迴圈內上千次多餘的上下文狀態切換
    ctx.lineCap = 'round';

    for (let i = stars.length - 1; i >= 0; i--) {
        const st = stars[i];

        if (st.bloomDelay > 0) {
            st.bloomDelay--;
            continue;
        }

        st.age++;
        const profile = st.style.decayProfile || 'instant_cutoff';
        let displayRadius = st.radius;

        if (st.style.id === 'kurui_hachi_mad') {
            const wobble = Math.sin(st.age * st.wobbleSpeed) * 0.7;
            st.vx += -st.vy * wobble * 0.22;
            st.vy += st.vx * wobble * 0.22;
        } else if (profile === 'flutter') {
            const wind = Math.sin(st.age * 0.12 + st.phase) * 0.22;
            st.vx += wind * 0.25;
        }

        st.x3 = st.x2; st.y3 = st.y2;
        st.x2 = st.x1; st.y2 = st.y1;
        st.x1 = st.x;  st.y1 = st.y;
        st.x += st.vx;
        st.y += st.vy;
        st.vx *= st.drag;
        st.vy = st.vy * st.drag + st.style.gravity;

        let alphaFactor = 1.0;
        const remainingTicks = st.cutoffLifetime - st.age;

        if (profile === 'color_cool') {
            const lifeRatio = st.age / st.cutoffLifetime;
            if (lifeRatio < 0.25) st.color = '#fffbe6';
            else if (lifeRatio < 0.55) st.color = '#f59e0b';
            else if (lifeRatio < 0.8) { st.color = '#ea580c'; displayRadius = st.radius * 0.85; }
            else { st.color = '#b91c1c'; displayRadius = st.radius * 0.65; }
            st.alpha -= st.style.decayRate * 0.7;
        } else if (profile === 'strobe_fade') {
            const strobeStart = st.style.strobeStartAge || 60;
            if (st.age > strobeStart) {
                const freq = Math.sin(st.age * 0.65 + st.phase);
                alphaFactor *= (freq > 0.1) ? 1.0 : 0.08;
            } else {
                st.alpha -= st.style.decayRate;
            }
        } else if (profile === 'saki_wari') {
            if (st.age >= st.sakiWariAge && !st.sakiWariTriggered) {
                st.sakiWariTriggered = true;
                soundEngine.playCrackle((st.x / width) * 2 - 1);

                if (microSparks.length < 50 && perfQuality > 0.7) {
                    const ma = Math.random() * Math.PI * 2;
                    const msp = 1.2 + Math.random() * 0.8;
                    microSparks.push({
                        x: st.x, y: st.y,
                        vx: Math.cos(ma) * msp, vy: Math.sin(ma) * msp,
                        alpha: 1.0,
                        color: st.style.sakiColor || ((Math.random() > 0.5) ? '#ffffff' : '#fde047'),
                        decay: 0.055
                    });
                }
                // 先割擴散：離散衰退時間，避免所有先割星玉在同一個影格同時消失
                const extraLife = 14 + Math.floor(Math.random() * 14);
                st.cutoffLifetime = st.age + extraLife;
                st.fadeDuration = extraLife;
            } else {
                st.alpha -= st.style.decayRate;
            }
        } else if (profile === 'ghost') {
            const darkStart = st.style.darkAgeStart || 18;
            const darkEnd = st.style.darkAgeEnd || 48;
            if (st.age >= darkStart && st.age < darkEnd) {
                // 幽靈暗態：平順過渡至極淡餘燼，避免瞬間完全切斷造成閃動停頓感
                const darkProg = (st.age - darkStart) / (darkEnd - darkStart);
                alphaFactor = 0.04 + 0.05 * Math.sin(darkProg * Math.PI);
            } else if (st.age >= darkEnd) {
                if (!st.ghostReignited) {
                    st.ghostReignited = true;
                    const reignitePalette = st.style.reigniteColors || ['#00f5d4'];
                    st.color = reignitePalette[Math.floor(Math.random() * reignitePalette.length)];
                    st.radius = 2.2;
                    soundEngine.playGhostReignite((st.x / width) * 2 - 1);
                }
                st.alpha -= 0.007;
            } else {
                st.alpha -= 0.003;
            }
        } else {
            st.alpha -= st.style.decayRate;
        }

        // 高效平滑消散計算 (SmoothStep 代替開方與指數，完全消滅 CPU 掉幀)
        if (remainingTicks <= st.fadeDuration) {
            const p = Math.max(0, remainingTicks / st.fadeDuration);
            // 代數平滑過渡曲線 S-curve: 3p^2 - 2p^3
            const pSmooth = p * p * (3 - 2 * p);
            alphaFactor *= pSmooth;
            displayRadius *= (0.5 + 0.5 * p);

            // 光軌尾巴平滑縮進
            const shrink = (1.0 - p) * 0.45;
            st.x3 += (st.x2 - st.x3) * shrink;
            st.y3 += (st.y2 - st.y3) * shrink;
            st.x2 += (st.x1 - st.x2) * shrink * 0.5;
            st.y2 += (st.y1 - st.y2) * shrink * 0.5;
        }

        const renderAlpha = Math.max(0, Math.min(1, st.alpha * alphaFactor));

        // 核心修復：只有在真正到達壽命上限時才移出陣列，未達前僅略過繪製，徹底杜絕突發性集體消失
        if (remainingTicks <= 0) {
            stars[i] = stars[stars.length - 1];
            stars.pop();
            continue;
        }
        if (renderAlpha < 0.015) {
            continue;
        }

        ctx.beginPath();
        ctx.moveTo(st.x3, st.y3);
        ctx.lineTo(st.x2, st.y2);
        ctx.lineTo(st.x1, st.y1);
        ctx.lineTo(st.x, st.y);
        ctx.strokeStyle = st.color;
        ctx.lineWidth = (profile === 'willow_long' || st.style.isLush) ? Math.max(0.85, displayRadius * 0.95) : 1.15;
        ctx.globalAlpha = renderAlpha * 0.85;
        ctx.stroke();

        if (renderAlpha > 0.06) {
            const sz = displayRadius * 1.8;
            ctx.fillStyle = st.color;
            ctx.globalAlpha = renderAlpha;
            ctx.fillRect(st.x - displayRadius, st.y - displayRadius, sz, sz);

            // 消退中的暗星不再繪製白色核心，節省大量 GPU 填充率
            if (renderAlpha > 0.45) {
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = renderAlpha * 0.9;
                ctx.fillRect(st.x - 0.75, st.y - 0.75, 1.5, 1.5);
            }
        }

        // 倒影優化：微弱星光不再計算水面倒影
        if (showReflection && st.isEven && st.y < horizonY && renderAlpha > 0.35 && perfQuality > 0.7) {
            const dy = horizonY - st.y;
            const refY = horizonY + dy * 0.62;
            if (refY < height) {
                ctx.fillStyle = st.color;
                ctx.globalAlpha = renderAlpha * 0.18;
                ctx.fillRect(st.x - displayRadius, refY, displayRadius * 2.2, 1.4);
            }
        }
    }

    for (let i = microSparks.length - 1; i >= 0; i--) {
        const m = microSparks[i];
        m.x += m.vx;
        m.y += m.vy;
        m.alpha -= m.decay;
        if (m.alpha <= 0) {
            microSparks[i] = microSparks[microSparks.length - 1];
            microSparks.pop();
            continue;
        }
        ctx.fillStyle = m.color;
        ctx.globalAlpha = m.alpha;
        ctx.fillRect(m.x, m.y, 1.4, 1.4);
    }

    ctx.globalCompositeOperation = 'source-over';

    if (autoLaunch && !isFinaleActive && !isComboActive) {
        if (now - lastAutoTime > autoInterval) {
            lastAutoTime = now;
            consecutiveSingleLaunches++;
            const comboThresholds = [9999, 10, 7, 4, 2];
            const threshold = comboThresholds[autoComboFrequencyLevel];

            if (autoComboFrequencyLevel > 0 && consecutiveSingleLaunches >= threshold) {
                consecutiveSingleLaunches = 0;
                triggerStarmineCombo();
            } else {
                const isSudden = Math.random() < suddenBurstProb;
                launchRocket(null, null, null, isSudden);
            }
        }
    }
}
requestAnimationFrame(animate);

function initSelectOptions() {
    const sel = document.getElementById('fireworkStyleSelect');
    sel.innerHTML = '';

    const groups = {};
    HANABI_STYLES_CATALOG.forEach(s => {
        const grpName = s.group || '其他名品';
        if (!groups[grpName]) groups[grpName] = [];
        groups[grpName].push(s);
    });

    for (const [grpName, items] of Object.entries(groups)) {
        const optgroup = document.createElement('optgroup');
        optgroup.label = `─── ${grpName} ───`;
        items.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = `${s.icon} ${s.name}`;
            optgroup.appendChild(opt);
        });
        sel.appendChild(optgroup);
    }

    sel.onchange = (e) => {
        currentStyleId = e.target.value;
        const found = HANABI_STYLES_CATALOG.find(s => s.id === currentStyleId);
        document.getElementById('styleCountText').textContent = found ? found.name.split(' ')[0] : '隨機';
        launchRocket(null, null, currentStyleId, false);
    };

    const comboSel = document.getElementById('comboStyleSelect');
    comboSel.onchange = (e) => {
        selectedComboId = e.target.value;
        const found = STARMINE_COMBOS.find(c => c.id === selectedComboId);
        document.getElementById('comboSelectText').textContent = found ? found.name.split(' ')[0] : '隨機輪播';
    };
}
initSelectOptions();

canvas.addEventListener('pointerdown', (e) => {
    soundEngine.init();
    launchRocket(e.clientX, e.clientY, null, false);
    const hint = document.getElementById('touchHint');
    if (hint) {
        hint.style.opacity = '0';
        setTimeout(() => hint.remove(), 1200);
    }
});

document.getElementById('comboLaunchBtn').onclick = () => triggerStarmineCombo();
document.getElementById('manualSuddenBtn').onclick = () => {
    soundEngine.init();
    launchRocket(null, null, null, true);
};

const autoBtn = document.getElementById('autoLaunchBtn');
autoBtn.onclick = () => {
    autoLaunch = !autoLaunch;
    autoBtn.classList.toggle('active', autoLaunch);
    autoBtn.querySelector('span').textContent = autoLaunch ? '✨ 自動巡航' : '⏸️ 巡航暫停';
};

const finaleBtn = document.getElementById('finaleBtn');
finaleBtn.onclick = () => {
    if (isFinaleActive || isComboActive) return;
    isFinaleActive = true;
    soundEngine.init();
    showComboToast('💥 錦冠終曲・千輪大連發');

    finaleBtn.style.opacity = '0.6';
    let count = 0;
    const maxFinale = 18;
    const finaleTimer = setInterval(() => {
        count++;
        const targetX = width * (0.15 + Math.random() * 0.7);
        const targetY = height * (0.12 + Math.random() * 0.38);
        const styles = ['lush_kamuro_curtain', 'lush_shidare_sakura', 'lush_senrin_hyakka', 'gosin_kiku', 'yurei_ghost', 'ginpa_saki_wari', 'diamond_strobe'];
        const chosen = styles[Math.floor(Math.random() * styles.length)];
        launchRocket(targetX, targetY, chosen, false, { densityMult: 0.65 });

        if (count >= maxFinale) {
            clearInterval(finaleTimer);
            setTimeout(() => {
                isFinaleActive = false;
                finaleBtn.style.opacity = '1';
            }, 3000);
        }
    }, 180);
};

const soundBtn = document.getElementById('soundToggleBtn');
soundBtn.onclick = () => {
    soundEnabled = !soundEnabled;
    soundEngine.init();
    document.getElementById('soundText').textContent = soundEnabled ? '🔊 音效: 開' : '🔇 音效: 關';
    soundBtn.classList.toggle('active', soundEnabled);
};

const fullBtn = document.getElementById('fullscreenBtn');
fullBtn.onclick = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen().catch(() => {});
};

const settingsDrawer = document.getElementById('settingsDrawer');
document.getElementById('settingsToggleBtn').onclick = () => settingsDrawer.classList.toggle('open');
document.getElementById('closeDrawerBtn').onclick = () => settingsDrawer.classList.remove('open');
document.getElementById('applyAndCloseBtn').onclick = () => settingsDrawer.classList.remove('open');

document.getElementById('densitySlider').oninput = (e) => {
    particleMult = parseFloat(e.target.value);
    const dText = document.getElementById('densityText');
    if (particleMult >= 1.4) dText.textContent = `超狂茂盛 (${particleMult}x)`;
    else if (particleMult >= 1.1) dText.textContent = `極致茂盛 (${particleMult}x)`;
    else dText.textContent = `標準精巧 (${particleMult}x)`;
};

const autoComboProbRange = document.getElementById('autoComboProbRange');
const autoComboProbText = document.getElementById('autoComboProbText');
const comboFreqTexts = ['關閉自動 Combo', '每 10 發穿插 1 次', '每 6~8 發穿插 1 次', '每 4 發穿插 1 次', '每 2 發穿插 1 次'];
autoComboProbRange.oninput = (e) => {
    autoComboFrequencyLevel = parseInt(e.target.value);
    autoComboProbText.textContent = comboFreqTexts[autoComboFrequencyLevel];
};

document.getElementById('speedFactorRange').oninput = (e) => {
    ascentBaseSteps = parseInt(e.target.value);
    const sec = (ascentBaseSteps * 0.0166).toFixed(1);
    document.getElementById('speedText').textContent = `${sec} 秒 (頂點減速)`;
};

document.getElementById('caliberRange').oninput = (e) => {
    const val = parseInt(e.target.value);
    const calNames = ['', '5號玉 (小輪精巧)', '10號尺玉 (標準大輪)', '15號尺半玉 (高空壯闊)', '20號二尺玉 (終極巨彈)'];
    const calScales = [0, 0.75, 1.0, 1.4, 2.0];
    document.getElementById('calText').textContent = calNames[val];
    caliberMultiplier = calScales[val];
};

document.getElementById('waterReflectionCheck').onchange = (e) => {
    showReflection = e.target.checked;
    document.getElementById('reflText').textContent = showReflection ? '開啟 (高效取樣)' : '關閉';
};
</script>
