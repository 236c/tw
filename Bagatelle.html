    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #2c3e50; 
            min-height: 100vh;

            user-select: none;

            touch-action: none; 
            position: relative; 
        }
        
        .machine-casing { 
            /* === 逼真木紋背景效果 === */
            background-color: #724c32; /* 木色基調 */
            background-image: 
                /* 噪點層，增加真實感 */
                radial-gradient(ellipse at center, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 70%),
                /* 木條紋層 1 */
                linear-gradient(4deg, transparent 0, rgba(100, 60, 30, 0.1) 1px, transparent 1px, transparent 100%),
                /* 木條紋層 2，不同的角度和強度 */
                linear-gradient(-3deg, transparent 0, rgba(100, 60, 30, 0.05) 1px, transparent 1px, transparent 100%),
                /* 木紋整體顏色層 */
                linear-gradient(145deg, #8b4513 0%, #5c2e0b 100%);

            background-size: auto, 100px 100px, 120px 120px, 100% 100%;

            border-radius: 10px; 
            box-shadow: 10px 10px 30px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.5);

<script>
    // ==========================================
    // 擬真音效系統
    // ==========================================
    let audioCtx;
    let noiseBuffer;
    
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = audioCtx.sampleRate * 1;
            noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPing(freqs, duration, vol) {
        if (!audioCtx) return;
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        gainNode.connect(audioCtx.destination);
        freqs.forEach(freq => {
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.connect(gainNode);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        });
    }

    function playNoise(filterFreq, type, duration, vol) {
        if (!audioCtx || !noiseBuffer) return;
        const source = audioCtx.createBufferSource();
        source.buffer = noiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = type;
        filter.frequency.value = filterFreq;
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        source.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start();
        source.stop(audioCtx.currentTime + duration);
    }

    function playCoinSound() { playPing([2000, 3100, 4300], 0.3, 0.15); }
    function playTickSound() { playNoise(1500, 'bandpass', 0.04, 0.8); }
    function playRouletteStop() { playNoise(800, 'lowpass', 0.1, 1.2); playPing([600, 900], 0.15, 0.2); }
    function playLaunchSound() { playNoise(300, 'lowpass', 0.2, 1.0); }
    function playBounceSound(isOrange) {
        if (isOrange) { playPing([300, 450], 0.06, 0.1); } 
        else { playPing([1800, 2600], 0.08, 0.1); }

        let t = 0;

    offscreenCoin.height = 64;

    oCtx.textBaseline = 'middle';
    oCtx.fillText('🪙', 32, 32);

    // ==========================================
    // 中獎特效系統
    // ==========================================
    const winEffects = [];
    class WinCoin {
        constructor(x) {
            this.x = x;
            this.y = -40;
            this.vy = Math.random() * 4 + 2;
            this.vx = (Math.random() - 0.5) * 6;
            this.rotation = Math.random() * 360;
            this.rotationSpeed = (Math.random() - 0.5) * 15;
            this.size = Math.floor(Math.random() * 15) + 25;
        }
        update() {
            this.vy += 0.25; 
            this.y += this.vy;
            this.x += this.vx;
            this.rotation += this.rotationSpeed;
            return this.y < 580; 
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation * Math.PI / 180);
            ctx.drawImage(offscreenCoin, -this.size/2, -this.size/2, this.size, this.size);
            ctx.restore();
        }
    }

    function triggerWinCoins(count) {

    // ==========================================

    const multiplierValues = [2, 4, 6, 8, 10];

    const ballRadius = 10;
    const pegRadius = 3;

    const friction = 0.995;     

    const PLUNGER_BASE_Y = 490;
    function getPlungerSurfaceY() { return PLUNGER_BASE_Y + pullStrength; }

    const playfieldLeft = 5, playfieldRight = 365;
    const slotCount = 12;
    const slotWidth = (playfieldRight - playfieldLeft) / slotCount;
    const slotMapping = [1, 0, 2, 3, 0, 1, 3, 2, 0, 4, 1, 0];

    // ==========================================
    // 提示框系統 
    // ==========================================
    class QuoteManager {
        constructor() { 
            this.quotes = []; 
        }
        addQuote(text, color = '#ffeb3b') {
            if (this.quotes.length >= 2) { this.quotes.shift(); }
            this.quotes.push({ text: text, targetY: 0, y: 550, alpha: 1.0, color: color, life: 180 });
        }
        updateAndDraw(ctx) {
            let screenCenterX = 185; 
            let screenBottomY = 430; 
            let dynamicFontSize = 16;
            let lineSpacing = dynamicFontSize + 20;
            
            for (let i = 0; i < this.quotes.length; i++) {
                if (this.quotes[i].y >= 550) this.quotes[i].y = screenBottomY + 30; 
                this.quotes[i].targetY = screenBottomY - 25 - ((this.quotes.length - 1 - i) * lineSpacing);
            }
            
            for (let i = this.quotes.length - 1; i >= 0; i--) {
                let q = this.quotes[i]; 
                q.y += (q.targetY - q.y) * 0.15; 
                q.life--;
                
                if (q.life < 20) q.alpha = Math.max(0, q.life / 20); else q.alpha = 0.95;
                if (q.life <= 0) { this.quotes.splice(i, 1); continue; }
                
                ctx.save(); 
                ctx.globalAlpha = q.alpha; 
                ctx.font = `bold ${dynamicFontSize}px "Microsoft JhengHei", sans-serif`;
                ctx.textAlign = 'center'; 
                ctx.textBaseline = 'middle';
                
                let textWidth = ctx.measureText(q.text).width;
                let bgX = screenCenterX - textWidth / 2 - 15;
                let bgY = q.y - dynamicFontSize / 2 - 8;
                let bgW = textWidth + 30; 
                let bgH = dynamicFontSize + 16; 
                let radius = 10;
                
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)'; 
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.moveTo(bgX + radius, bgY); 
                ctx.lineTo(bgX + bgW - radius, bgY); 
                ctx.quadraticCurveTo(bgX + bgW, bgY, bgX + bgW, bgY + radius); 
                ctx.lineTo(bgX + bgW, bgY + bgH - radius); 
                ctx.quadraticCurveTo(bgX + bgW, bgY + bgH, bgX + bgW - radius, bgY + bgH); 
                ctx.lineTo(bgX + radius, bgY + bgH); 
                ctx.quadraticCurveTo(bgX, bgY + bgH, bgX, bgY + bgH - radius); 
                ctx.lineTo(bgX, bgY + radius); 
                ctx.quadraticCurveTo(bgX, bgY, bgX + radius, bgY); 
                ctx.fill();
                
                ctx.shadowBlur = 0; 
                ctx.fillStyle = q.color; 
                ctx.fillText(q.text, screenCenterX, q.y); 
                ctx.restore();
            }
        }
    }
    const quoteManager = new QuoteManager();

    function initPegs() {
        pegs.length = 0;
        for (let a = 0; a >= -Math.PI/2.8; a -= 0.06) {
            let isTopPeg = (a - 0.06 < -Math.PI/2.8);
            pegs.push({ x: 205 + 160 * Math.cos(a), y: 205 + 160 * Math.sin(a), type: isTopPeg ? 'orange' : 'metal' });
        }
        pegs.push({ x: 120, y: 80, type: 'orange' }, { x: 70, y: 100, type: 'orange' });
        for(let i = 0; i < 9; i++) { pegs.push({ x: 50 + i * 34, y: 160, type: (i%2==0)?'orange':'metal' }); }
        for (let row = 0; row < 4; row++) {
            let cols = (row % 2 === 0) ? 10 : 9;
            let startX = (row % 2 === 0) ? 33 : 50;
            for (let col = 0; col < cols; col++) {
                pegs.push({ x: startX + col * 34, y: 190 + row * 25, type: 'metal' });
            }
        }
        for (let i = 1; i < slotCount; i++) {
            let px = 5 + i * slotWidth;
            for(let j=0; j<5; j++) pegs.push({ x: px, y: 355 + j*14, type: 'metal' });
        }
    }

    function drawMetallicBall(ctx, x, y, radius) {
        ctx.save();
        const metallicGradient = ctx.createRadialGradient(x - radius*0.3, y - radius*0.3, 0, x, y, radius);
        metallicGradient.addColorStop(0, '#FFFFFF');    
        metallicGradient.addColorStop(0.5, '#C0C0C0');  
        metallicGradient.addColorStop(1, '#404040');    
        ctx.fillStyle = metallicGradient;
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function insertCoin() {
        initAudio(); 
        if (isFlashing || isLoadingBall || isLocking) return; 
        if (isLocked && (!hasLaunched || ball !== null)) {
            if (topLeftMultiplier < 20) {
                playCoinSound(); topLeftMultiplier++;
                document.querySelectorAll('.odds-led').forEach(l => l.classList.remove('active'));
                document.getElementById(`odds-led-${topLeftMultiplier}`).classList.add('active');
            }
            return;
        }
        if (ball !== null || (ballInTrough.active && ballInTrough.x < 350)) return;

        playCoinSound(); isFlashing = true; isLocked = false; hasLaunched = false; topLeftMultiplier = 1; 
        document.querySelectorAll('.odds-led').forEach(l => l.classList.remove('active'));
        document.getElementById('odds-led-1').classList.add('active'); 

        if (flashInterval) clearInterval(flashInterval);
        flashInterval = setInterval(() => {
            playTickSound(); 
            document.querySelectorAll('.led').forEach(l => l.classList.remove('active'));
            currentLedIndex = (currentLedIndex + 1) % 5;
            document.getElementById(`led-${currentLedIndex}`).classList.add('active');
        }, 60);
    }

    function pressRedButton() {
        initAudio(); if (!isFlashing) return;
        clearInterval(flashInterval); isFlashing = false; isLocked = true; isLocking = true; 
        const btn = document.getElementById('redBtn'); btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 150);
        document.querySelectorAll('.led').forEach(l => l.classList.remove('active'));
        topLeftMultiplier = 1; 
        document.querySelectorAll('.odds-led').forEach(l => l.classList.remove('active'));
        let bc = 0;
        let bi = setInterval(() => {
            playTickSound(); 
            document.getElementById(`led-${currentLedIndex}`).classList.toggle('active');
            if (++bc >= 6) { 
                clearInterval(bi); playRouletteStop(); 
                document.getElementById(`led-${currentLedIndex}`).classList.add('active'); 
                document.getElementById(`odds-led-1`).classList.add('active'); 
                isLocking = false; isLoadingBall = true;  
            }
        }, 80);
    }

    let isAutoPulling = false;    
    let isManualPulling = false;  
    let pullStrength = 0;
    const launchBtn = document.getElementById('launchBtn');
    const domSpring = document.getElementById('domSpring');
    const coinPanelEl = document.getElementById('coinPanel');

    function firePlunger() {
        if (pullStrength > 5) {
            playLaunchSound();
            if (ball && ball.x > 370 && ball.y > 400) {
                let surfaceY = getPlungerSurfaceY();
                let dist = Math.abs(ball.y - (surfaceY - ballRadius));
                if (dist < 15) {
                    ball.vy = -(14 + pullStrength * 0.35);
                    ball.vx = (Math.random() - 0.5) * 0.5;
                    hasLaunched = true;
                }
            }
        }
        pullStrength = 0; 
    }

    function resizeGame() {
        const casing = document.querySelector('.machine-casing');
        const scale = Math.min(window.innerWidth / casing.offsetWidth, window.innerHeight / casing.offsetHeight); 
        casing.style.transform = `translate(-50%, 0) scale(${scale})`;
    }
    window.addEventListener('resize', resizeGame);
    setTimeout(resizeGame, 0); 

    window.addEventListener('keydown', (e) => {
        initAudio();
        if (e.code === 'KeyC' || e.key === 'c') insertCoin();
        else if (e.code === 'Space') { e.preventDefault(); pressRedButton(); }
        else if (e.code === 'ArrowDown') { e.preventDefault(); if (!isLocked || isLocking) return; isAutoPulling = true; }
    });
    window.addEventListener('keyup', (e) => { if (e.code === 'ArrowDown') { isAutoPulling = false; firePlunger(); } });

    // 全域手勢控制
    let gestureStartY = 0;
    let isGestureActive = false;

    document.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.btn-red') || e.target.closest('.coin-panel')) return;
        initAudio(); 
        if (isFlashing) { pressRedButton(); return; }
        gestureStartY = e.clientY; isGestureActive = true;
        if (e.target.id === 'launchBtn') {
            if (!isLocked || isLocking) return;
            isAutoPulling = true; isManualPulling = false; e.target.setPointerCapture(e.pointerId);
        }
    });

    document.addEventListener('pointermove', (e) => {
        if (!isGestureActive) return;
        let deltaY = e.clientY - gestureStartY;
        if (deltaY > 10 && isLocked && !isLocking) {
            isAutoPulling = false; isManualPulling = true; pullStrength = Math.max(0, Math.min(deltaY * 0.6, 45));
        }
    });

    document.addEventListener('pointerup', (e) => {
        if (!isGestureActive) return;
        isGestureActive = false;
        let deltaY = e.clientY - gestureStartY;
        if (deltaY < -40) insertCoin();
        if (isManualPulling || isAutoPulling) { isAutoPulling = false; isManualPulling = false; firePlunger(); }
        if (e.target.id === 'launchBtn') e.target.releasePointerCapture(e.pointerId);
    });

    // ==========================================
    // 遊戲主循環
    // ==========================================
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let isWaiting = (ball === null && !isLoadingBall && !isFlashing && !isLocking && ballInTrough.x >= 350);
        if (isWaiting) coinPanelEl.classList.add('highlight');
        else coinPanelEl.classList.remove('highlight');

        if (ball) {
            ball.vy += gravity; ball.vx *= friction; ball.vy *= friction;
            ball.x += ball.vx; ball.y += ball.vy;

            // 發射台底部
            if (ball.x > 370) {
                ball.x = 387.5; 
                let surfaceY = getPlungerSurfaceY();
                if (ball.y > surfaceY - ballRadius) {
                    ball.y = surfaceY - ballRadius;
                    if (ball.vy > 0) {
                        ball.vy *= -0.3; 
                        if (ball.vy < 0.2) ball.vy = 0;
                        if (Math.abs(ball.vy) > 0.05) playBounceSound(false);
                    }
                }
            }

            // 釘子碰撞
            pegs.forEach(p => {
                let dx = ball.x - p.x, dy = ball.y - p.y, dist = Math.sqrt(dx*dx + dy*dy);
                let r = (p.type==='orange') ? ballRadius + pegRadius + 1.5 : ballRadius + pegRadius;
                if (dist < r) {
                    let nx = dx / dist, ny = dy / dist;
                    ball.x = p.x + nx * (r + 0.1); ball.y = p.y + ny * (r + 0.1);
                    let dot = ball.vx * nx + ball.vy * ny;
                    if (dot < 0) {
                        let currentBounce = (p.type==='orange') ? bounce * 1.15 : bounce;
                        ball.vx = (ball.vx - 2 * dot * nx) * currentBounce + (Math.random()-0.5)*0.4;
                        ball.vy = (ball.vy - 2 * dot * ny) * currentBounce + (Math.random()-0.5)*0.4;
                        if (Date.now() - lastBounceTime > 30) { playBounceSound(p.type === 'orange'); lastBounceTime = Date.now(); }
                    }
                }
            });
            
            // 外圍牆壁碰撞 (包含修復圓弧卡頓的邏輯)
            if (ball.y < 205) {
                // 上方半圓弧判定
                let dx = ball.x - 205, dy = ball.y - 205, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 200 - ballRadius) {
                    let nx = dx / dist, ny = dy / dist; 
                    ball.x = 205 + nx * (200 - ballRadius); 
                    ball.y = 205 + ny * (200 - ballRadius);
                    let dot = ball.vx * nx + ball.vy * ny; 
                    
                    if (dot > 0) { 
                        // 改進的物理碰撞：分離法線速度與切線速度
                        // 讓法向順利反彈，但「保留切線方向的滑動動能」，避免黏在牆上
                        let vn_x = dot * nx;
                        let vn_y = dot * ny;
                        let vt_x = ball.vx - vn_x;
                        let vt_y = ball.vy - vn_y;
                        
                        ball.vx = vt_x * 0.70 - vn_x * bounce; 
                        ball.vy = vt_y * 0.70 - vn_y * bounce; 
                    }
                }
            } else {
                // 左右直線牆壁判定
                if (ball.x < 5 + ballRadius) { ball.x = 5 + ballRadius; ball.vx *= -bounce; }
                if (ball.x > 405 - ballRadius) { ball.x = 405 - ballRadius; ball.vx *= -bounce; }
                if (ball.y < 425) {
                    if (ball.x > 365 - ballRadius && ball.x <= 367.5) { ball.x = 365 - ballRadius; ball.vx *= -bounce; }
                    else if (ball.x < 370 + ballRadius && ball.x > 367.5) { ball.x = 370 + ballRadius; ball.vx *= -bounce; }
                }
            }
            
            // 掉入底部洞口判定
            if (ball.y > 440 && ball.x < 365) {
                ballInTrough = { x: ball.x, y: ball.y, active: true };
                if (isLocked && hasLaunched) {
                    let slotIndex = Math.floor((ball.x - playfieldLeft) / slotWidth);
                    if (slotMapping[slotIndex] === currentLedIndex) {
                        playWinSound(); 
                        let base = multiplierValues[currentLedIndex];
                        let totalWin = base * topLeftMultiplier;
                        
                        quoteManager.addQuote(`🎉 恭喜中獎！【糖菓 ${base} 粒】x ${topLeftMultiplier} = ${totalWin} 粒！`, '#ffeb3b');
                        
                        triggerWinCoins(totalWin); 
                    }
                }
                ball = null; 
            }
        }

        // 底部回送軌道邏輯
        if (ballInTrough.active) {
            if (!isLoadingBall) {
                if (ballInTrough.x < 350) { 
                    ballInTrough.x += 3.5; 
                    ballInTrough.y = (445 + (ballInTrough.x-5)*50/360) - ballRadius; 
                } else { 
                    ballInTrough.x = 350; 
                    ballInTrough.y = 482; 
                }
            } else {
                let tx = 387.5;
                let ty = getPlungerSurfaceY() - ballRadius; 
                let dx = tx - ballInTrough.x, dy = ty - ballInTrough.y, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 4) {
                    ball = { x: tx, y: ty, vx: 0, vy: 0 }; 
                    isLoadingBall = false; ballInTrough.active = false;
                } else { ballInTrough.x += dx/dist*7; ballInTrough.y += dy/dist*7; }
            }
        }

        // 更新中獎金幣動畫
        for (let i = winEffects.length - 1; i >= 0; i--) {
            if (winEffects[i].update()) {
                winEffects[i].draw(ctx);
            } else {
                winEffects.splice(i, 1);
            }
        }

        // 繪製拉桿
        if (isAutoPulling && pullStrength < 45) pullStrength += 3.5;
        launchBtn.style.transform = `translateY(${pullStrength}px)`; 
        domSpring.style.height = `${25 + pullStrength}px`;

        ctx.save();
        let springTop = getPlungerSurfaceY(); 
        let sBottom = 525;
        ctx.fillStyle = '#444'; ctx.fillRect(380.5, springTop, 14, sBottom - springTop);
        ctx.strokeStyle = '#aaa'; ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(387.5, springTop);
        for(let i=1; i<=8; i++) {
            ctx.lineTo(387.5 + (i%2==0?-9:9), springTop + (sBottom-springTop)/8*(i-0.5));
            ctx.lineTo(387.5, springTop + (sBottom-springTop)/8*i);
        }
        ctx.stroke();
        ctx.fillStyle = '#666'; ctx.fillRect(373.5, springTop - 2, 28, 4); 
        ctx.restore();

        // 繪製洞口燈號
        for (let i = 0; i < slotCount; i++) {
            let cx = playfieldLeft + (i + 0.5) * slotWidth, cy = 320; 
            let active = (currentLedIndex === slotMapping[i] && (isFlashing || isLocked));
            ctx.fillStyle = active ? '#ff3333' : '#330000';
            if (active) { ctx.shadowBlur = 15; ctx.shadowColor = '#ff3333'; }
            ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0; ctx.fillStyle = active ? '#fff' : '#888';
            ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; 
            ctx.fillText(multiplierValues[slotMapping[i]], cx, cy + 22);
        }

        if (ball) drawMetallicBall(ctx, ball.x, ball.y, ballRadius);
        if (ballInTrough.active) drawMetallicBall(ctx, ballInTrough.x, ballInTrough.y, ballRadius);

        // 繪製機台遮罩與軌道
        ctx.fillStyle = '#f2f2f2';
        ctx.beginPath(); ctx.moveTo(5, 445); ctx.lineTo(370, 495); ctx.lineTo(370, 515); ctx.lineTo(5, 465); ctx.fill();
        ctx.beginPath(); ctx.moveTo(370, 410); ctx.lineTo(370, 495); ctx.lineTo(280, 495); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 205, 5, 320); ctx.fillRect(365, 205, 5, 220); ctx.fillRect(405, 205, 5, 320);
        ctx.beginPath(); ctx.arc(205, 205, 202.5, 0, Math.PI, true); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.stroke();
        
        // 繪製釘子
        pegs.forEach(p => {
            ctx.fillStyle = p.type==='orange'?'#f90':'#aaa';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.type==='orange'?pegRadius+1.5:pegRadius, 0, Math.PI*2); ctx.fill();
        });

        // 繪製提示文字
        quoteManager.updateAndDraw(ctx);

        requestAnimationFrame(loop);
    }

    initPegs(); loop();
</script>
</body></html>
