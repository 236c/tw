<!DOCTYPE html>
<html lang="zh-TW"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>經典夜市彈珠檯 - 手動加碼版 (擬真音效升級)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #2c3e50; 
            min-height: 100vh; 
            width: 100vw;
            margin: 0; 
            font-family: "Microsoft JhengHei", sans-serif; 
            user-select: none; 
            overflow: hidden; 
            touch-action: none; 
            position: relative; 
        }
        
        .machine-casing { 
            background: linear-gradient(145deg, #8b4513, #5c2e0b); 
            border: 15px solid #4a2508; 
            border-radius: 10px; 
            box-shadow: 10px 10px 30px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.5); 
            width: 420px; 
            box-sizing: content-box; 
            padding: 10px; 
            position: absolute; 
            top: 0;
            left: 50%;
            transform-origin: top center; 
        }
        
        .plunger, .btn-red, .coin-panel { touch-action: none; }

        .scoreboard { 
            box-sizing: border-box; background-color: #f8f9fa; border: 3px solid #333; 
            border-radius: 5px; padding: 10px 12px; margin-bottom: 10px; height: 126px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1); overflow: hidden; 
        }
        
        .odds-board { display: flex; gap: 6px; padding: 5px; height: 100px; font-family: "Courier New", Courier, monospace; box-sizing: border-box; flex-shrink: 0; }
        .odds-col { display: flex; flex-direction: column; justify-content: flex-start; gap: 4px; }
        .odds-item { display: flex; align-items: center; font-size: 0.75rem; line-height: 1; font-weight: bold; color: #444; width: 26px; height: 8px; }
        .odds-led { width: 6px; height: 6px; background-color: #4a0000; border-radius: 50%; margin-right: 4px; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.6); flex-shrink: 0; }
        .odds-led.active { background-color: #ff3333; box-shadow: 0 0 6px #ff3333, 0 0 12px #ff0000; }

        .scores-container { display: flex; justify-content: center; gap: 15px; flex: 1 1 auto; margin: 0 10px; height: 100px; }
        .score-column { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100px; }
        .score-text { writing-mode: vertical-rl; font-weight: bold; font-size: 1.1rem; letter-spacing: 2px; color: #333; }
        .led { width: 14px; height: 14px; background-color: #4a0000; border-radius: 50%; margin-top: 6px; transition: 0.1s; }
        .led.active { background-color: #ff3333; box-shadow: 0 0 12px #ff3333, 0 0 25px #ff0000; }

        .coin-panel { 
            width: 50px; height: 100px; box-sizing: border-box; flex-shrink: 0; margin-right: 8px; 
            background: linear-gradient(135deg, #e0e0e0, #999999); border: 2px solid #666; border-radius: 5px; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; cursor: pointer; 
            box-shadow: inset 1px 1px 5px rgba(255,255,255,0.8), 2px 2px 5px rgba(0,0,0,0.3); transition: 0.3s; 
        }
        .coin-slot { width: 6px; height: 30px; background-color: #111; border: 1px solid #444; border-radius: 3px; margin-bottom: 6px; }
        .coin-text { font-size: 0.8rem; font-weight: bold; color: #222; writing-mode: vertical-rl; line-height: 1.1; }
        
        @keyframes breathe-glow {
            0% { box-shadow: 0 0 5px #ffeb3b, inset 1px 1px 5px rgba(255,255,255,0.8), 2px 2px 5px rgba(0,0,0,0.3); border-color: #ffc107; }
            50% { box-shadow: 0 0 15px #ff9800, 0 0 25px #ffeb3b, inset 1px 1px 5px rgba(255,255,255,0.8), 2px 2px 5px rgba(0,0,0,0.3); border-color: #fff; }
            100% { box-shadow: 0 0 5px #ffeb3b, inset 1px 1px 5px rgba(255,255,255,0.8), 2px 2px 5px rgba(0,0,0,0.3); border-color: #ffc107; }
        }
        .coin-panel.highlight { animation: breathe-glow 1.5s ease-in-out infinite; }
        
        .playfield { 
            background-color: #222; 
            border: 5px solid #333; 
            border-radius: 5px; 
            position: relative; 
            height: 530px; 
            width: 410px; 
            margin: 0 auto; 
            box-sizing: content-box; 
            overflow: hidden; 
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8); 
        }
        
        .controls { position: relative; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; height: 90px; }
        .red-btn-container { background-color: #ddd; padding: 10px; border-radius: 5px; border: 2px solid #999; }
        .btn-red { width: 50px; height: 50px; background: radial-gradient(circle, #ff4444, #cc0000); border-radius: 50%; border: 3px solid #fff; box-shadow: 0 5px #880000; cursor: pointer; }
        .btn-red:active, .btn-red.active { transform: translateY(5px); box-shadow: 0 0px #880000; }
        
        .plunger-container { position: absolute; left: 372.5px; top: 0; width: 40px; display: flex; flex-direction: column; align-items: center; height: 90px; justify-content: flex-start; }
        .dom-spring { width: 14px; height: 25px; background: repeating-linear-gradient(to bottom, #999, #999 4px, #444 4px, #444 8px); position: absolute; top: -10px; z-index: 5; border-radius: 2px; box-shadow: inset 2px 0 5px rgba(0,0,0,0.5); }
        .plunger { width: 40px; height: 50px; background-color: #e6c200; border-radius: 5px 5px 15px 15px; cursor: pointer; position: absolute; top: 15px; z-index: 10; box-shadow: 0 5px #998000; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #4a2508; }

        #danmakuContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; overflow: hidden; }
        .danmaku-msg {
            position: absolute; white-space: nowrap; font-weight: bold; font-family: "Microsoft JhengHei", sans-serif;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            animation: scrollDanmaku 4s linear forwards; pointer-events: none;
        }
        .danmaku-win { color: #ffeb3b; font-size: 1.4rem; z-index: 22; }
        @keyframes scrollDanmaku {
            0% { left: 100%; transform: translateX(0); }
            100% { left: 0%; transform: translateX(-100%); }
        }
    </style>
</head>
<body>

<div class="machine-casing">
    <div class="scoreboard">

                <div class="odds-item"><div class="odds-led" id="odds-led-16"></div>16</div>
                <div class="odds-item"><div class="odds-led" id="odds-led-17"></div>17</div>
                <div class="odds-item"><div class="odds-led" id="odds-led-18"></div>18</div>
                <div class="odds-item"><div class="odds-led" id="odds-led-19"></div>19</div>
                <div class="odds-item"><div class="odds-led" id="odds-led-20"></div>20</div>
            </div>
        </div>

        <div class="scores-container">
            <div class="score-column"><div class="score-text">糖菓二粒</div><div class="led" id="led-0"></div></div>
            <div class="score-column"><div class="score-text">糖菓四粒</div><div class="led" id="led-1"></div></div>
            <div class="score-column"><div class="score-text">糖菓六粒</div><div class="led active" id="led-2"></div></div>
            <div class="score-column"><div class="score-text">糖菓八粒</div><div class="led" id="led-3"></div></div>
            <div class="score-column"><div class="score-text">糖菓十粒</div><div class="led" id="led-4"></div></div>
        </div>

        <div class="coin-panel highlight" id="coinPanel" title="快速鍵: C" onpointerdown="insertCoin()">
            <div class="coin-slot"></div>
            <div class="coin-text" id="coinActionText">投幣放球</div>
        </div>
    </div>

    <div class="playfield">
        <canvas id="gameCanvas" width="410" height="530"></canvas>
        <div id="danmakuContainer"></div> 
    </div>

    <div class="controls">
        <div class="red-btn-container" title="快速鍵: 空白鍵">
            <div class="btn-red" id="redBtn" onpointerdown="pressRedButton()"></div>
        </div>
        <div class="plunger-container" title="快速鍵: 向下方向鍵(↓)">
            <div class="dom-spring" id="domSpring" style="height: 25px;"></div>
            <div class="plunger" id="launchBtn" style="transform: translateY(0px);">拉</div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 擬真音效系統 (Web Audio API)
    // ==========================================
    let audioCtx;
    let noiseBuffer;
    
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = audioCtx.sampleRate * 1;
            noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPing(freqs, duration, vol) {
        if (!audioCtx) return;
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        gainNode.connect(audioCtx.destination);

        freqs.forEach(freq => {
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.connect(gainNode);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        });
    }

    function playNoise(filterFreq, type, duration, vol) {
        if (!audioCtx || !noiseBuffer) return;
        const source = audioCtx.createBufferSource();
        source.buffer = noiseBuffer;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = type;
        filter.frequency.value = filterFreq;
        filter.Q.value = 1;
        
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        source.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        source.start();
        source.stop(audioCtx.currentTime + duration);
    }

    function playCoinSound() {
        playPing([2000, 3100, 4300], 0.3, 0.15); 
        setTimeout(() => playPing([1800, 2800, 3900], 0.2, 0.08), 80); 
        setTimeout(() => playPing([2100, 3200, 4400], 0.4, 0.1), 160); 
    }

    function playTickSound() {
        playNoise(1500, 'bandpass', 0.04, 0.8); 
    }

    function playRouletteStop() {
        playNoise(800, 'lowpass', 0.1, 1.2);
        playPing([600, 900], 0.15, 0.2);
    }

    function playLaunchSound() {
        playNoise(300, 'lowpass', 0.2, 1.0); 
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.4);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }

    function playBounceSound(isOrange) {
        if (isOrange) {
            playNoise(500, 'bandpass', 0.08, 0.8);
            playPing([300, 450], 0.06, 0.1);
        } else {
            playPing([1800, 2600, 3800], 0.12, 0.15);
            playNoise(5000, 'highpass', 0.03, 0.3); 
        }
    }

    function playWinSound() {
        let t = 0;
        for(let i=0; i<12; i++) {
            setTimeout(() => playPing([1200, 1500, 2200], 0.15, 0.25), t);
            t += 60; 
        }
    }


    // ==========================================
    // 遊戲主邏輯與雙重拉桿系統
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let ball = null;            
    let ballInTrough = { x: 350, y: 482, active: true }; 
    let ballInPlunger = false;  
    let isLoadingBall = false;  
    
    let isFlashing = false;
    let isLocked = false;
    let isLocking = false;      
    let hasLaunched = false;    
    
    let currentLedIndex = -1; 
    let topLeftMultiplier = 1;  
    let flashInterval = null;
    let lastBounceTime = 0; 
    
    const multiplierValues = [2, 4, 6, 8, 10];

    const pegs = [];
    const ballRadius = 10;
    const pegRadius = 3;
    
    const gravity = 0.32;       
    const bounce = 0.62;        
    const friction = 0.995;     

    const playfieldLeft = 5, playfieldRight = 365;
    const slotCount = 12;
    const slotWidth = (playfieldRight - playfieldLeft) / slotCount;
    const slotMapping = [1, 0, 2, 3, 0, 1, 3, 2, 0, 4, 1, 0];

    function initPegs() {
        pegs.length = 0;
        // 修正：大幅縮小間距，增加釘子數量，形成堅固的圓弧引導，絕對不卡彈珠
        for (let a = 0; a >= -Math.PI/2.8; a -= 0.06) {
            // 判斷是否為圓拱最上方的一根 (最後一次進入迴圈的釘子)
            let isTopPeg = (a - 0.06 < -Math.PI/2.8);
            pegs.push({ 
                x: 205 + 160 * Math.cos(a), 
                y: 205 + 160 * Math.sin(a), 
                type: isTopPeg ? 'orange' : 'metal' // 最上方改為橘色
            });
        }
        
        pegs.push({ x: 120, y: 80, type: 'orange' }, { x: 70, y: 100, type: 'orange' });
        
        for(let i = 0; i < 9; i++) {
            pegs.push({ x: 50 + i * 34, y: 160, type: (i%2==0)?'orange':'metal' });
        }
        
        for (let row = 0; row < 4; row++) {
            let cols = (row % 2 === 0) ? 10 : 9;
            let startX = (row % 2 === 0) ? 33 : 50;
            for (let col = 0; col < cols; col++) {
                let px = startX + col * 34;
                pegs.push({ x: px, y: 190 + row * 25, type: 'metal' });
            }
        }

        for (let i = 1; i < slotCount; i++) {
            let px = 5 + i * slotWidth;
            pegs.push({ x: px, y: 355, type: 'metal' });
            pegs.push({ x: px, y: 369, type: 'metal' });
            pegs.push({ x: px, y: 383, type: 'metal' });
            pegs.push({ x: px, y: 397, type: 'metal' });
            pegs.push({ x: px, y: 411, type: 'metal' });
        }
    }

    function drawMetallicBall(ctx, x, y, radius) {
        ctx.save();
        const startX = x - radius * 0.3;
        const startY = y - radius * 0.3;
        const metallicGradient = ctx.createRadialGradient(
            startX, startY, 0,
            x, y, radius
        );
        
        metallicGradient.addColorStop(0, '#FFFFFF');    
        metallicGradient.addColorStop(0.2, '#E0E0E0');  
        metallicGradient.addColorStop(0.5, '#C0C0C0');  
        metallicGradient.addColorStop(0.8, '#808080');  
        metallicGradient.addColorStop(1, '#404040');    
        
        ctx.fillStyle = metallicGradient;
        ctx.strokeStyle = '#606060';
        ctx.lineWidth = 0.5;
        
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    function shootDanmaku(text, isWin) {
        const container = document.getElementById('danmakuContainer');
        const msg = document.createElement('div');
        msg.className = 'danmaku-msg ' + (isWin ? 'danmaku-win' : '');
        msg.innerText = text;
        
        const randomTop = Math.random() * 40 + 20; 
        msg.style.top = `${randomTop}%`;
        
        container.appendChild(msg);
        
        setTimeout(() => {
            if (container.contains(msg)) {
                container.removeChild(msg);
            }
        }, 4000);
    }

    function insertCoin() {
        initAudio(); 
        
        if (isFlashing || isLoadingBall || isLocking) return; 

        if (isLocked && (!hasLaunched || ball !== null)) {
            if (topLeftMultiplier < 20) {
                playCoinSound(); 
                topLeftMultiplier++;
                document.querySelectorAll('.odds-led').forEach(l => l.classList.remove('active'));
                document.getElementById(`odds-led-${topLeftMultiplier}`).classList.add('active');
            }
            return;
        }

        if (ball !== null || ballInPlunger || (ballInTrough.active && ballInTrough.x < 350)) return;

        playCoinSound(); 
        isFlashing = true; 
        isLocked = false;
        hasLaunched = false;
        topLeftMultiplier = 1; 

        document.querySelectorAll('.odds-led').forEach(l => l.classList.remove('active'));
        document.getElementById('odds-led-1').classList.add('active'); 

        if (flashInterval) clearInterval(flashInterval);
        flashInterval = setInterval(() => {
            playTickSound(); 
            document.querySelectorAll('.led').forEach(l => l.classList.remove('active'));
            currentLedIndex = (currentLedIndex + 1) % 5;
            document.getElementById(`led-${currentLedIndex}`).classList.add('active');
        }, 60);
    }

    function pressRedButton() {
        initAudio(); 
        if (!isFlashing) return;
        clearInterval(flashInterval);
        isFlashing = false; 
        isLocked = true;
        isLocking = true; 
        
        const btn = document.getElementById('redBtn');
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 150);

        document.querySelectorAll('.led').forEach(l => l.classList.remove('active'));
        let activeLedMiddle = document.getElementById(`led-${currentLedIndex}`);
        
        topLeftMultiplier = 1; 
        document.querySelectorAll('.odds-led').forEach(l => l.classList.remove('active'));
        
        let bc = 0;
        let bi = setInterval(() => {
            playTickSound(); 
            activeLedMiddle.classList.toggle('active');
            let currentLeftLed = document.getElementById(`odds-led-${topLeftMultiplier}`);
            if (currentLeftLed) currentLeftLed.classList.toggle('active');
            
            if (++bc >= 6) { 
                clearInterval(bi); 
                playRouletteStop(); 
                activeLedMiddle.classList.add('active'); 
                let finalLeftLed = document.getElementById(`odds-led-${topLeftMultiplier}`);
                if (finalLeftLed) finalLeftLed.classList.add('active'); 
                isLocking = false; isLoadingBall = true;  
            }
        }, 80);
    }

    let isAutoPulling = false;    
    let isManualPulling = false;  
    let pullStrength = 0;
    
    const launchBtn = document.getElementById('launchBtn');
    const domSpring = document.getElementById('domSpring');
    const coinPanelEl = document.getElementById('coinPanel');

    function firePlunger() {
        if (pullStrength > 10 && ballInPlunger) {
            playLaunchSound(); 
            ball = { x: 387.5, y: 485 + pullStrength, vx: (Math.random()-0.5)*0.5, vy: -(14 + pullStrength * 0.28) };
            ballInPlunger = false; hasLaunched = true; 
        }
        pullStrength = 0; 
    }

    function resizeGame() {
        const casing = document.querySelector('.machine-casing');
        const scaleX = window.innerWidth / casing.offsetWidth; 
        const scaleY = window.innerHeight / casing.offsetHeight; 
        const scale = Math.min(scaleX, scaleY); 
        casing.style.transform = `translate(-50%, 0) scale(${scale})`;
    }
    window.addEventListener('resize', resizeGame);
    setTimeout(resizeGame, 0); 

    window.addEventListener('keydown', function(e) {
        initAudio();
        if (e.code === 'KeyC' || e.key === 'c' || e.key === 'C') {
            insertCoin();
        } else if (e.code === 'Space') {
            e.preventDefault(); 
            pressRedButton();
        } else if (e.code === 'ArrowDown') {
            e.preventDefault();
            if (!isLocked || isLocking || !ballInPlunger) return;
            isAutoPulling = true;
        }
    });

    window.addEventListener('keyup', function(e) {
        if (e.code === 'ArrowDown') {
            if (!isAutoPulling) return;
            isAutoPulling = false;
            firePlunger();
        }
    });

    let dragStartYBtn = 0;
    launchBtn.addEventListener('pointerdown', (e) => {
        initAudio();
        e.preventDefault();
        if (!isLocked || isLocking || !ballInPlunger) return; 
        isAutoPulling = true;
        isManualPulling = false;
        dragStartYBtn = e.clientY;
        launchBtn.setPointerCapture(e.pointerId);
    });

    launchBtn.addEventListener('pointermove', (e) => {
        if (!isAutoPulling && !isManualPulling) return;
        let deltaY = e.clientY - dragStartYBtn;
        if (deltaY > 5) {
            isAutoPulling = false;
            isManualPulling = true;
            pullStrength = Math.max(0, Math.min(deltaY * 0.6, 45)); 
        }
    });

    launchBtn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        if (isAutoPulling || isManualPulling) {
            isAutoPulling = false;
            isManualPulling = false;
            firePlunger();
            launchBtn.releasePointerCapture(e.pointerId);
        }
    });

    let touchStartY = 0;
    let touchLastY = 0;
    let isTouchClick = false;

    window.addEventListener('touchstart', (e) => {
        initAudio();
        if (e.target.closest('.coin-panel') || e.target.closest('.btn-red') || e.target.closest('.plunger-container')) return;
        
        touchStartY = e.touches[0].穩定;
        touchLastY = touchStartY;
        isTouchClick = true;
        isManualPulling = false;
    }, {passive: false});

    window.addEventListener('touchmove', (e) => {
        if (e.target.closest('.coin-panel') || e.target.closest('.btn-red') || e.target.closest('.plunger-container')) return;

        touchLastY = e.touches[0].clientY;
        let deltaY = touchLastY - touchStartY;

        if (Math.abs(deltaY) > 10) {
            isTouchClick = false;
        }

        if (deltaY > 10 && isLocked && !isLocking && ballInPlunger) {
            e.preventDefault(); 
            isManualPulling = true;
            isAutoPulling = false; 
            pullStrength = Math.max(0, Math.min((deltaY - 10) * 0.5, 45));
        }
    }, {passive: false});

    window.addEventListener('touchend', (e) => {
        if (e.target.closest('.coin-panel') || e.target.closest('.btn-red') || e.target.closest('.plunger-container')) return;

        let deltaY = touchLastY - touchStartY;

        if (isManualPulling) {
            isManualPulling = false;
            firePlunger();
        } else if (deltaY < -30) {
            insertCoin();
        } else if (isTouchClick && isFlashing) {
            pressRedButton();
        }
    });

    window.addEventListener('pointerup', (e) => {
        if(isAutoPulling || isManualPulling) {
            isAutoPulling = false;
            isManualPulling = false;
            firePlunger();
        }
    });

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let isWaitingForNewGame = (ball === null && !ballInPlunger && !isLoadingBall && !isFlashing && !isLocking && ballInTrough.x >= 350);
        if (isWaitingForNewGame) {
            if (!coinPanelEl.classList.contains('highlight')) coinPanelEl.classList.add('highlight');
        } else {
            if (coinPanelEl.classList.contains('highlight')) coinPanelEl.classList.remove('highlight');
        }

        if (ball) {
            ball.vy += gravity; ball.vx *= friction; ball.vy *= friction;
            ball.x += ball.vx; ball.y += ball.vy;

            pegs.forEach(p => {
                let dx = ball.x - p.x, dy = ball.y - p.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let r = (p.type==='orange') ? ballRadius + pegRadius + 1.5 : ballRadius + pegRadius;
                if (dist < r) {
                    let nx = dx / dist, ny = dy / dist;
                    ball.x = p.x + nx * (r + 0.1);
                    ball.y = p.y + ny * (r + 0.1);
                    let dot = ball.vx * nx + ball.vy * ny;
                    if (dot < 0) {
                        let currentBounce = (p.type==='orange') ? bounce * 1.15 : bounce;
                        ball.vx = (ball.vx - 2 * dot * nx) * currentBounce + (Math.random()-0.5)*0.4;
                        ball.vy = (ball.vy - 2 * dot * ny) * currentBounce + (Math.random()-0.5)*0.4;
                        
                        let now = Date.now();
                        if (now - lastBounceTime > 30) {
                            playBounceSound(p.type === 'orange');
                            lastBounceTime = now;
                        }
                    }
                }
            });
            
            if (ball.y < 205) {
                let dx = ball.x - 205, dy = ball.y - 205, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 200 - ballRadius) {
                    let nx = dx / dist, ny = dy / dist; 
                    ball.x = 205 + nx * (200 - ballRadius); 
                    ball.y = 205 + ny * (200 - ballRadius);
                    let dot = ball.vx * nx + ball.vy * ny; 
                    if (dot > 0) { ball.vx = (ball.vx - 2 * dot * nx) * bounce; ball.vy = (ball.vy - 2 * dot * ny) * bounce; }
                }
            } else {
                if (ball.x < 5 + ballRadius) { ball.x = 5 + ballRadius; ball.vx *= -bounce; }
                if (ball.x > 405 - ballRadius) { ball.x = 405 - ballRadius; ball.vx *= -bounce; }
                
                if (ball.y < 425) {
                    if (ball.x > 365 - ballRadius && ball.x <= 367.5) { ball.x = 365 - ballRadius; ball.vx *= -bounce; }
                    else if (ball.x < 370 + ballRadius && ball.x > 367.5) { ball.x = 370 + ballRadius; ball.vx *= -bounce; }
                }
            }
            
            if (ball.y > 440 && ball.x < 365) {
                ballInTrough = { x: ball.x, y: ball.y, active: true };
                
                if (isLocked && hasLaunched) {
                    let slotIndex = Math.floor((ball.x - playfieldLeft) / slotWidth);
                    if (slotIndex < 0) slotIndex = 0;
                    if (slotIndex >= slotCount) slotIndex = slotCount - 1;
                    
                    let landedLedIndex = slotMapping[slotIndex];
                    
                    if (landedLedIndex === currentLedIndex) {
                        playWinSound(); 
                        let baseScore = multiplierValues[landedLedIndex]; 
                        let totalScore = baseScore * topLeftMultiplier;   
                        shootDanmaku(`🎉 恭喜中獎！打中【糖菓 ${baseScore} 粒】洞口，加碼 ${topLeftMultiplier} 倍，總計贏得：${totalScore} 粒！`, true);
                    }
                }
                
                ball = null; 
            } else if (ball.y >= 485 && ball.x >= 365 && ball.vy > 0) {
                ball = null;
                ballInPlunger = true;
                playBounceSound(true); 
            }
        }

        if (ballInTrough.active) {
            let targetYFloor = 445 + (ballInTrough.x - 5) * (50/365); 
            if (!isLoadingBall) {
                if (ballInTrough.x < 350) {
                    ballInTrough.x += 2.0; ballInTrough.y = targetYFloor - ballRadius;
                } else {
                    ballInTrough.x = 350; ballInTrough.y = 482; 
                }
            } else {
                let targetX = 387.5; let targetY = 485; 
                let dx = targetX - ballInTrough.x; let dy = targetY - ballInTrough.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 2) {
                    ballInTrough.x = targetX; ballInTrough.y = targetY;
                    isLoadingBall = false; ballInPlunger = true; ballInTrough.active = false;
                } else {
                    ballInTrough.x += (dx / dist) * 2.5; ballInTrough.y += (dy / dist) * 2.5;
                }
            }
        }

        if (isAutoPulling && pullStrength < 45) { 
            pullStrength += 3.5; 
        }

        launchBtn.style.transform = `translateY(${pullStrength}px)`; 
        domSpring.style.height = `${25 + pullStrength}px`;

        ctx.save(); ctx.strokeStyle = '#888'; ctx.lineWidth = 2; ctx.beginPath();
        let springTopCanvas = 495 + pullStrength; let springBottomCanvas = 525; 
        let coils = 8; let coilHeight = (springBottomCanvas - springTopCanvas) / coils;
        
        ctx.fillStyle = '#444';
        ctx.fillRect(380.5, springTopCanvas, 14, springBottomCanvas - springTopCanvas);

        ctx.strokeStyle = '#aaa'; ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(387.5, springTopCanvas);
        for(let i=1; i<=coils; i++) {
            let cx = 387.5 + (i%2===0 ? -9 : 9); let cy = springTopCanvas + coilHeight * (i - 0.5);
            ctx.lineTo(cx, cy); ctx.lineTo(387.5, springTopCanvas + coilHeight * i);
        }
        ctx.stroke();

        ctx.fillStyle = '#666'; 
        ctx.fillRect(373.5, springTopCanvas, 28, 5); 
        ctx.restore();

        for (let i = 0; i < slotCount; i++) {
            let cx = playfieldLeft + (i + 0.5) * slotWidth; 
            let cy = 320; 
            let isActive = (currentLedIndex === slotMapping[i] && (isFlashing || isLocked));
            
            ctx.fillStyle = isActive ? '#ff3333' : '#330000';
            if (isActive) { ctx.shadowBlur = 18; ctx.shadowColor = '#ff3333'; }
            ctx.beginPath(); 
            ctx.arc(cx, cy, 9, 0, Math.PI*2); 
            ctx.fill(); 
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = isActive ? '#ffffff' : '#888888';
            ctx.font = 'bold 12px "Courier New"'; ctx.textAlign = 'center'; 
            ctx.fillText(multiplierValues[slotMapping[i]], cx, cy + 22);
        }

        if (ball) { drawMetallicBall(ctx, ball.x, ball.y, ballRadius); }
        if (ballInTrough.active) { drawMetallicBall(ctx, ballInTrough.x, ballInTrough.y, ballRadius); }
        if (ballInPlunger) { let ballY = 485 + pullStrength; drawMetallicBall(ctx, 387.5, ballY, ballRadius); }

        ctx.save(); ctx.fillStyle = '#f2f2f2'; ctx.shadowBlur = 4; ctx.shadowColor = 'black';
        ctx.beginPath(); ctx.moveTo(5, 445); ctx.lineTo(370, 495); ctx.lineTo(370, 515); ctx.lineTo(5, 465); ctx.fill();
        ctx.beginPath(); ctx.moveTo(370, 410); ctx.lineTo(370, 495); ctx.lineTo(280, 495); ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#fff'; 
        ctx.fillRect(0, 205, 5, 320);     
        ctx.fillRect(365, 205, 5, 220);   
        ctx.fillRect(405, 205, 5, 320);   
        ctx.beginPath(); 
        ctx.arc(205, 205, 202.5, 0, Math.PI, true); 
        ctx.strokeStyle = '#fff'; 
        ctx.lineWidth = 5; 
        ctx.stroke();

        pegs.forEach(p => {
            ctx.fillStyle = p.type==='orange'?'#f90':'#aaa';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.type==='orange'?pegRadius+1.5:pegRadius, 0, Math.PI*2); ctx.fill();
        });

        requestAnimationFrame(loop);
    }

    initPegs(); loop();
</script>

</body></html>
