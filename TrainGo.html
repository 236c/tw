        function drawWeather(timeRatio) {
            let currentType = (transitionAlpha > 0.5 && nextWeather) ? nextWeather.type : currentWeather.type;
            if (currentType === 'sunny' || currentType === 'cloudy') return; 

            ctx.save();
            let pAlpha = currentType === currentWeather.type ? (1 - transitionAlpha) : transitionAlpha;

            for (let i = 0; i < weatherParticles.length; i++) {
                let p = weatherParticles[i];
                let dynamicSpeedX = p.speedX - (speed * 0.09); 
                let dynamicSpeedY = (currentType === 'rain') ? p.speedY : p.speedY * 0.35; 

                p.x += dynamicSpeedX * timeRatio; p.y += dynamicSpeedY * timeRatio;

                if (p.y > height) { p.y = 0; p.x = Math.random() * width; }
                if (p.x < 0) { p.x = width; p.y = Math.random() * height; } 

                if (currentType === 'rain') {
                    ctx.strokeStyle = `rgba(174, 219, 255, ${0.4 * pAlpha})`; ctx.lineWidth = 1.0;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + dynamicSpeedX * 1.2, p.y + dynamicSpeedY * 1.2); ctx.stroke();
                } else if (currentType === 'snow') {
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.75 * pAlpha})`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                }
            }
            ctx.restore();
        }

        function getSkyGradient(scene, weather) {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            if (weather.type === 'sunny') {
                skyGrad.addColorStop(0, scene.skyTop); skyGrad.addColorStop(1, scene.skyBottom);
            } else if (weather.type === 'cloudy') {
                skyGrad.addColorStop(0, '#4a5568'); skyGrad.addColorStop(1, '#718096');
            } else if (weather.type === 'rain') {
                skyGrad.addColorStop(0, '#2d3748'); skyGrad.addColorStop(1, '#4a5568');
            } else { 
                skyGrad.addColorStop(0, '#1a202c'); skyGrad.addColorStop(1, '#2d3748');
            }
            return skyGrad;
        }

        function drawSceneDetails(scene, weather, horizonY) {
            const scale = Math.max(0.4, width / 600); 

            if (scene.id === 'mountain') {
                ctx.save();
                const farOffset = (distance * 0.05) % width;
                let farColor = weather.type === 'sunny' ? '#9ab7d3' : '#4a5a6a';
                ctx.fillStyle = farColor;
                
                ctx.beginPath();
                ctx.moveTo(0 - farOffset, horizonY);
                ctx.lineTo(width * 0.25 - farOffset, horizonY - height * 0.25);
                ctx.lineTo(width * 0.55 - farOffset, horizonY);
                ctx.lineTo(width * 0.8 - farOffset, horizonY - height * 0.22);
                ctx.lineTo(width * 1.2 - farOffset, horizonY);
                ctx.fill();

                const nearOffset = (distance * 0.12) % width;
                const peaks = [
                    { rx: 0.2, ry: 0.32, rw: 0.5 },
                    { rx: 0.7, ry: 0.35, rw: 0.6 }
                ];

                peaks.forEach(p => {
                    let peakX = width * p.rx - nearOffset;
                    let peakY = horizonY - height * p.ry;
                    let peakW = width * p.rw;
                    let leftX = peakX - peakW * 0.5;
                    let rightX = peakX + peakW * 0.5;

                    for (let loop = 0; loop <= 1; loop++) {
                        let shift = loop * width;
                        let curLeft = leftX + shift;
                        let curPeak = peakX + shift;
                        let curRight = rightX + shift;

                        ctx.fillStyle = weather.type === 'sunny' ? '#4a567d' : '#23293d';
                        ctx.beginPath(); ctx.moveTo(curLeft, horizonY); ctx.lineTo(curPeak, peakY); ctx.lineTo(curPeak, horizonY); ctx.closePath(); ctx.fill();

                        ctx.fillStyle = weather.type === 'sunny' ? '#687fa6' : '#2f3954';
                        ctx.beginPath(); ctx.moveTo(curPeak, peakY); ctx.lineTo(curRight, horizonY); ctx.lineTo(curPeak, horizonY); ctx.closePath(); ctx.fill();

                        if (weather.type !== 'rain') {
                            let snowH = height * 0.05;
                            ctx.fillStyle = '#d2dae2';
                            ctx.beginPath(); ctx.moveTo(curPeak, peakY); ctx.lineTo(curPeak - snowH * 0.7, peakY + snowH); ctx.lineTo(curPeak, peakY + snowH * 0.8); ctx.closePath(); ctx.fill();

                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath(); ctx.moveTo(curPeak, peakY); ctx.lineTo(curPeak + snowH * 0.7, peakY + snowH); ctx.lineTo(curPeak, peakY + snowH * 0.8); ctx.closePath(); ctx.fill();
                        }
                    }
                });
                ctx.restore();
            } 
            else if (scene.id === 'ocean') {
                let oceanHeight = Math.max(80, height * 0.22);
                let oceanTopY = horizonY - oceanHeight;
                let oceanGrad = ctx.createLinearGradient(0, oceanTopY, 0, horizonY);
                oceanGrad.addColorStop(0, '#1b4f72'); oceanGrad.addColorStop(1, '#5dade2');
                ctx.fillStyle = oceanGrad; ctx.fillRect(0, oceanTopY, width, oceanHeight);
                
                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                const waveOffset = (distance * 0.5) % 80;
                for (let i = -80; i < width + 80; i += 80) {
                    let waveW = 40 + Math.sin(Date.now() / 200 + i) * 15;
                    ctx.fillRect(i - waveOffset, oceanTopY + (oceanHeight * 0.4) + Math.sin(i) * 5, waveW, 2);
                }
            } 
            else if (scene.id === 'forest') {
                ctx.save();
                const farTreeOffset = (distance * 0.2) % 180;
                for (let x = -100; x < width + 100; x += 40 * scale) {
                    let drawX = x - farTreeOffset;
                    let tHeight = (45 + (Math.sin(x) * 12)) * scale; let tWidth = 20 * scale;
                    ctx.fillStyle = weather.type === 'sunny' ? '#1abc9c' : '#117a65'; 
                    ctx.beginPath(); ctx.moveTo(drawX, horizonY); ctx.lineTo(drawX + tWidth/2, horizonY - tHeight); ctx.lineTo(drawX + tWidth, horizonY); ctx.closePath(); ctx.fill();
                }

                const nearTreeOffset = (distance * 0.45) % 240;
                for (let x = -120; x < width + 120; x += 50 * scale) {
                    let drawX = x - nearTreeOffset;
                    let treeH = (75 + Math.sin(x * 0.05) * 20) * scale; let treeW = 34 * scale;
                    ctx.fillStyle = '#5c3a21';
                    let trunkW = 3 * scale; let trunkH = treeH * 0.25;
                    ctx.fillRect(drawX + treeW/2 - trunkW/2, horizonY - trunkH, trunkW, trunkH);

                    let leafStartY = horizonY - trunkH; let layerH = (treeH - trunkH) / 3;
                    let leafColors = weather.type === 'sunny' ? ['#196f3d', '#229954', '#2ecc71'] : ['#145a32', '#196f3d', '#229954']; 

                    for (let layer = 0; layer < 3; layer++) {
                        ctx.fillStyle = leafColors[layer];
                        let curBottomY = leafStartY - layer * (layerH * 0.7);
                        let curHeight = layerH * (1.3 - layer * 0.15); let curWidth = treeW * (1.0 - layer * 0.22);
                        ctx.beginPath(); ctx.moveTo(drawX + treeW/2 - curWidth/2, curBottomY); ctx.lineTo(drawX + treeW/2, curBottomY - curHeight); ctx.lineTo(drawX + treeW/2 + curWidth/2, curBottomY); ctx.closePath(); ctx.fill();
                    }
                }
                ctx.restore();
            } 
            else if (scene.id === 'city') {
                ctx.save();
                const farOffset = (distance * 0.12) % 400;
                ctx.fillStyle = weather.type === 'sunny' ? '#222f3e' : '#141d26'; 
                for (let i = -1; i < (width / (80 * scale)) + 2; i++) {
                    let drawX = i * (110 * scale) - farOffset;
                    let bHeight = (100 + (i % 3) * 40) * scale; let bWidth = 45 * scale;
                    ctx.fillRect(drawX, horizonY - bHeight, bWidth, bHeight);
                }

                const nearOffset = (distance * 0.35) % 500;
                for (let i = -1; i < (width / (110 * scale)) + 2; i++) {
                    let drawX = i * (160 * scale) - nearOffset;
                    let bHeight = (140 + (i * 73 % 4) * 35) * scale; let bWidth = 65 * scale;
                    ctx.fillStyle = weather.type === 'sunny' ? '#34495e' : '#1c2631'; ctx.fillRect(drawX, horizonY - bHeight, bWidth, bHeight);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; ctx.fillRect(drawX + bWidth * 0.75, horizonY - bHeight, bWidth * 0.25, bHeight);

                    let winW = 4 * scale; let winH = 5 * scale; let gapX = 8 * scale; let gapY = 11 * scale;
                    for (let wx = drawX + 6 * scale; wx < drawX + bWidth * 0.7; wx += gapX) {
                        for (let wy = horizonY - bHeight + 10 * scale; wy < horizonY - 10 * scale; wy += gapY) {
                            if (Math.sin(wx * 2 + wy * 5 + i) > -0.2) {
                                ctx.fillStyle = `rgba(241, 196, 15, ${weather.type === 'sunny' ? 0.4 : 0.65})`; 
                                ctx.fillRect(wx, wy, winW, winH);
                            }
                        }
                    }
                }
                ctx.restore();
            } 
            else if (scene.id === 'country') {
                ctx.fillStyle = '#27ae60'; ctx.fillRect(0, horizonY - 12, width, 12);
            }
        }

        function drawBackground(timeRatio) {
            ctx.save();
            const horizonY = height - 25; 

            ctx.fillStyle = getSkyGradient(currentScene, currentWeather);
            ctx.fillRect(0, 0, width, height);
            drawSceneDetails(currentScene, currentWeather, horizonY);
            updateAndDrawSkyObjects(1 - transitionAlpha, timeRatio); 

            if (isTransitioning && nextScene && nextWeather) {
                ctx.save(); ctx.globalAlpha = transitionAlpha;
                ctx.fillStyle = getSkyGradient(nextScene, nextWeather); ctx.fillRect(0, 0, width, height);
                drawSceneDetails(nextScene, nextWeather, horizonY); ctx.restore();
                updateAndDrawSkyObjects(transitionAlpha, timeRatio);
            }
            ctx.restore();

            ctx.fillStyle = '#1a202c'; ctx.fillRect(0, horizonY, width, 25);
            const trackOffset = (distance * 2) % 40; ctx.fillStyle = '#718096';
            for (let i = -1; i < width / 40 + 1; i++) {
                ctx.fillRect(i * 40 - trackOffset, horizonY + 6, 14, 5);
            }
        }

        // ============================================================================
        // 🏢 頂級現代化頂棚與日式傳統色系統
        // ============================================================================
        function drawModernPlatformRoof(platformX, platformTopY, platformWidth, scale, style) {
            ctx.save();
            const roofHeight = 85 * scale;
            const roofY = platformTopY - 145 * scale;

            let roofColors, pillarColor, pillarEdge;

            if (style === 0) { 
                roofColors = ['#17184b', '#20225c', '#0f1033', '#07081c'];
                pillarColor = '#13143b'; pillarEdge = '#2b2d73';
            } else if (style === 1) { 
                roofColors = ['#3d2e27', '#4a3a32', '#2a201c', '#17100e'];
                pillarColor = '#2a201c'; pillarEdge = '#4a3a32';
            } else if (style === 2) { 
                roofColors = ['#1a2924', '#283c36', '#121f1b', '#0a120f'];
                pillarColor = '#121f1b'; pillarEdge = '#283c36';
            } else { 
                roofColors = ['#422933', '#523440', '#2b1a21', '#170d11'];
                pillarColor = '#2b1a21'; pillarEdge = '#523440';
            }

            let roofGrad = ctx.createLinearGradient(0, roofY, 0, roofY + roofHeight);
            roofGrad.addColorStop(0, roofColors[0]);
            roofGrad.addColorStop(0.4, roofColors[1]);
            roofGrad.addColorStop(0.8, roofColors[2]);
            roofGrad.addColorStop(1, roofColors[3]);
            ctx.fillStyle = roofGrad;
            ctx.fillRect(platformX, roofY, platformWidth, roofHeight);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1 * scale;
            for (let rx = platformX; rx < platformX + platformWidth; rx += 45 * scale) {
                ctx.beginPath();
                ctx.moveTo(rx, roofY);
                ctx.lineTo(rx + 10 * scale, roofY + roofHeight);
                ctx.stroke();
            }

            let ledGlow = ctx.createLinearGradient(0, roofY + roofHeight - 5 * scale, 0, roofY + roofHeight);
            if (style === 0) {
                ledGlow.addColorStop(0, 'rgba(0, 229, 255, 0.95)'); 
            } else if (style === 1) {
                ledGlow.addColorStop(0, 'rgba(253, 230, 138, 0.9)'); 
            } else if (style === 2) {
                ledGlow.addColorStop(0, 'rgba(52, 211, 153, 0.9)'); 
            } else {
                ledGlow.addColorStop(0, 'rgba(251, 113, 133, 0.9)'); 
            }
            ledGlow.addColorStop(0.4, '#ffffff');
            ledGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.fillStyle = ledGlow;
            ctx.fillRect(platformX, roofY + roofHeight - 4 * scale, platformWidth, 4 * scale);

            ctx.fillStyle = pillarColor;
            for (let cx = platformX + 60 * scale; cx < platformX + platformWidth; cx += 320 * scale) {
                ctx.fillRect(cx, roofY + roofHeight, 10 * scale, 145 * scale);
                ctx.fillStyle = pillarEdge;
                ctx.fillRect(cx, roofY + roofHeight, 1.5 * scale, 145 * scale); 
                ctx.fillStyle = pillarColor;
            }
            ctx.restore();
        }

        function drawPlatform() {
            ctx.save();
            const horizonY = height - 25; 
            const scale = Math.max(0.4, width / 600); 
            
            const trainStartX = width * 0.15; 
            const baseLength = 240 * scale; 
            const headLength = 90 * scale;
            
            const platformTopY = horizonY - 4 * scale; 
            const perfectStopCanvasX = trainStartX + baseLength + headLength; 
            
            let stopLineX;
            if (isLeavingStationPhase) {
                stopLineX = perfectStopCanvasX - departureLeftShift;
            } else {
                stopLineX = perfectStopCanvasX + (distanceToStation * 8); 
            }
            
            const platformX = stopLineX - 1300 * scale; 
            const platformWidth = width * 10;

            drawModernPlatformRoof(platformX, platformTopY, platformWidth, scale, currentStationLandscape);

            let wallColor = '#e2e8f0';
            let baseColor = '#0f172a';
            if (currentStationLandscape === 0) { wallColor = '#1e293b'; baseColor = '#020617'; }
            else if (currentStationLandscape === 1) { wallColor = '#e5e5e0'; baseColor = '#451a03'; }
            else if (currentStationLandscape === 2) { wallColor = '#d1d5db'; baseColor = '#064e3b'; }
            else if (currentStationLandscape === 3) { wallColor = '#fff1f2'; baseColor = '#881337'; }

            ctx.fillStyle = wallColor;
            ctx.fillRect(platformX, platformTopY - 55 * scale, platformWidth, 55 * scale);
            ctx.fillStyle = baseColor;
            ctx.fillRect(platformX, platformTopY - 5 * scale, platformWidth, 5 * scale);

            let zenX = stopLineX + 50 * scale;
            let zenW = 140 * scale; 
            
            if (zenX > platformX && zenX + zenW < platformX + platformWidth) {
                ctx.save();
                ctx.fillStyle = '#1e293b'; ctx.fillRect(zenX, platformTopY - 50 * scale, zenW, 45 * scale);
                ctx.fillStyle = '#020617'; ctx.fillRect(zenX + 2*scale, platformTopY - 48 * scale, zenW - 4*scale, 41 * scale);

                if (currentStationLandscape === 0) {
                    let lGrad = ctx.createLinearGradient(zenX, 0, zenX+zenW, 0);
                    lGrad.addColorStop(0, '#020617'); lGrad.addColorStop(0.5, '#1e1b4b'); lGrad.addColorStop(1, '#020617');
                    ctx.fillStyle = lGrad; ctx.fillRect(zenX + 2*scale, platformTopY - 48 * scale, zenW - 4*scale, 41 * scale);
                    ctx.fillStyle = '#00e5ff';
                    ctx.fillRect(zenX + zenW*0.2, platformTopY - 35*scale, 20*scale, 12*scale);
                    ctx.fillStyle = '#00ff88';
                    ctx.fillRect(zenX + zenW*0.6, platformTopY - 40*scale, 30*scale, 8*scale);
                } 
                else if (currentStationLandscape === 1) {
                    ctx.fillStyle = '#e5e5e0'; ctx.fillRect(zenX + 2*scale, platformTopY - 48 * scale, zenW - 4*scale, 41 * scale); 
                    ctx.fillStyle = '#f5f5f0'; ctx.fillRect(zenX + 2*scale, platformTopY - 18 * scale, zenW - 4*scale, 11 * scale); 
                    ctx.strokeStyle = '#d4d4cc'; ctx.lineWidth = 0.8 * scale;
                    ctx.beginPath(); ctx.arc(zenX + zenW*0.4, platformTopY - 14*scale, 12*scale, Math.PI, 0); ctx.stroke();
                    ctx.fillStyle = '#14532d'; 
                    ctx.beginPath(); ctx.arc(zenX + zenW*0.38, platformTopY - 33 * scale, 12*scale, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(zenX + zenW*0.54, platformTopY - 36 * scale, 9*scale, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#451a03'; 
                    ctx.fillRect(zenX + zenW*0.44, platformTopY - 26 * scale, 3 * scale, 12 * scale);
                    ctx.fillStyle = '#737373'; ctx.fillRect(zenX + zenW*0.75, platformTopY - 25 * scale, 6 * scale, 10 * scale);
                    ctx.beginPath(); ctx.arc(zenX + zenW*0.75 + 3*scale, platformTopY - 25 * scale, 4*scale, 0, Math.PI*2); ctx.fill();
                } 
                else if (currentStationLandscape === 2) {
                    ctx.fillStyle = '#064e3b'; ctx.fillRect(zenX + 2*scale, platformTopY - 48 * scale, zenW - 4*scale, 41 * scale); 
                    ctx.fillStyle = '#059669'; ctx.beginPath(); ctx.arc(zenX+zenW*0.25, platformTopY-30*scale, 15*scale, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#10b981'; ctx.beginPath(); ctx.arc(zenX+zenW*0.5, platformTopY-25*scale, 18*scale, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#34d399'; ctx.beginPath(); ctx.arc(zenX+zenW*0.75, platformTopY-35*scale, 14*scale, 0, Math.PI*2); ctx.fill();
                    let pGlow = ctx.createRadialGradient(zenX+zenW/2, platformTopY-45*scale, 1, zenX+zenW/2, platformTopY-45*scale, 30*scale);
                    pGlow.addColorStop(0, 'rgba(255,255,200,0.3)'); pGlow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = pGlow; ctx.fillRect(zenX+2*scale, platformTopY-48*scale, zenW-4*scale, 41*scale);
                } 
                else {
                    ctx.fillStyle = '#fff1f2'; ctx.fillRect(zenX + 2*scale, platformTopY - 48 * scale, zenW - 4*scale, 41 * scale); 
                    ctx.fillStyle = '#fda4af';
                    ctx.beginPath(); ctx.arc(zenX+zenW*0.45, platformTopY-32*scale, 15*scale, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath(); ctx.arc(zenX+zenW*0.6, platformTopY-28*scale, 12*scale, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#1e293b'; 
                    ctx.fillRect(zenX + zenW*0.35, platformTopY - 18 * scale, zenW*0.35, 4 * scale);
                }

                let glassGrad = ctx.createLinearGradient(zenX, 0, zenX + zenW, 0);
                glassGrad.addColorStop(0, 'rgba(255,255,255,0.22)');
                glassGrad.addColorStop(0.3, 'rgba(255,255,255,0.04)');
                glassGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = glassGrad; ctx.fillRect(zenX + 2*scale, platformTopY - 48 * scale, zenW - 4*scale, 41 * scale);
                ctx.restore();
            }

            let floorGrad = ctx.createLinearGradient(0, platformTopY, 0, height);
            floorGrad.addColorStop(0, '#475569');
            floorGrad.addColorStop(0.04, '#1e293b');
            floorGrad.addColorStop(0.4, '#0f172a');
            floorGrad.addColorStop(1, '#020617');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(platformX, platformTopY, platformWidth, height - platformTopY);

            ctx.save();
            ctx.globalAlpha = 0.15; 
            ctx.fillStyle = '#0033cc';
            ctx.fillRect(platformX, platformTopY + 4 * scale, platformWidth, 8 * scale);
            if (isHeadlightOn) {
                let reflectLight = ctx.createRadialGradient(perfectStopCanvasX, platformTopY, 0, perfectStopCanvasX, platformTopY, 120 * scale);
                reflectLight.addColorStop(0, 'rgba(0, 229, 255, 0.55)');
                reflectLight.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = reflectLight;
                ctx.beginPath(); ctx.ellipse(perfectStopCanvasX + 40*scale, platformTopY + 10*scale, 100*scale, 15*scale, 0, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();

            ctx.fillStyle = '#94a3b8'; ctx.fillRect(platformX, platformTopY, platformWidth, 8 * scale);
            ctx.fillStyle = '#ca8a04'; ctx.fillRect(platformX, platformTopY + 2.5 * scale, platformWidth, 3 * scale);
            ctx.strokeStyle = '#eab308'; ctx.lineWidth = 1 * scale;
            ctx.beginPath();
            for (let bx = platformX; bx < platformX + platformWidth; bx += 6 * scale) {
                ctx.moveTo(bx, platformTopY + 2.5 * scale);
                ctx.lineTo(bx + 2 * scale, platformTopY + 5.5 * scale);
            }
            ctx.stroke();

            passengers.forEach(p => {
                const pX = stopLineX + p.relX * scale;
                if (pX > platformX && pX < platformX + platformWidth) {
                    ctx.save(); 
                    let breathe = Math.sin(Date.now() * 0.003 + p.relX) * 0.4 * scale;
                    ctx.translate(pX, platformTopY - 1 * scale);
                    
                    const pHeight = p.heightFactor * scale + breathe;
                    const pWidth = p.widthFactor * scale;
                    
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.beginPath(); ctx.ellipse(0, 0, pWidth * 1.2, 1.8 * scale, 0, 0, Math.PI * 2); ctx.fill();

                    ctx.fillStyle = p.color; 
                    ctx.fillRect(-pWidth / 2, -pHeight * 0.82, pWidth, pHeight * 0.82);
                    if(p.relX % 3 === 0) {
                        ctx.fillStyle = '#475569';
                        ctx.fillRect(pWidth * 0.6, -pHeight * 0.5, 4 * scale, pHeight * 0.5);
                        ctx.fillStyle = '#1e293b';
                        ctx.fillRect(pWidth * 0.6 + 1*scale, -pHeight * 0.5 - 3*scale, 2 * scale, 3 * scale);
                    }
                    ctx.fillStyle = '#ffdbb5'; 
                    ctx.beginPath(); ctx.arc(0, -pHeight * 0.82 - (pWidth * 0.5), pWidth * 0.55, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
            });

            leavingPassengers.forEach(lp => {
                let currentLpX = isLeavingStationPhase ? (lp.x - departureLeftShift) : lp.x;
                if (currentLpX > platformX && currentLpX < platformX + platformWidth) {
                    ctx.save();
                    ctx.globalAlpha = lp.alpha; 
                    
                    let stepBob = Math.abs(Math.sin(lp.bobOffset)) * 2.5 * scale;
                    ctx.translate(currentLpX, platformTopY + stepBob);
                    
                    const pHeight = lp.heightFactor * scale;
                    const pWidth = lp.widthFactor * scale;
                    
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath(); ctx.ellipse(0, -stepBob, pWidth, 1.5 * scale, 0, 0, Math.PI * 2); ctx.fill();

                    ctx.fillStyle = lp.color;
                    ctx.fillRect(-pWidth / 2, -pHeight * 0.82, pWidth, pHeight * 0.82);
                    ctx.fillStyle = '#ffdbb5';
                    ctx.beginPath(); ctx.arc(0, -pHeight * 0.82 - (pWidth * 0.5), pWidth * 0.55, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
            });

            const signX = stopLineX - 120 * scale; 
            ctx.fillStyle = '#334155'; ctx.fillRect(signX, platformTopY - 125 * scale, 4 * scale, 55 * scale); 
            
            let containerX = signX - 45 * scale; 
            ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2 * scale;
            ctx.fillRect(containerX, platformTopY - 95 * scale, 94 * scale, 30 * scale); 
            ctx.strokeRect(containerX, platformTopY - 95 * scale, 94 * scale, 30 * scale);
            ctx.fillStyle = '#0033cc'; ctx.fillRect(containerX, platformTopY - 95 * scale, 94 * scale, 4 * scale);
            
            ctx.fillStyle = '#0f172a'; ctx.font = `bold ${Math.round(11 * scale)}px 'Segoe UI', sans-serif`; 
            ctx.fillText(currentStationName.split(" ")[0], signX - 25 * scale, platformTopY - 76 * scale);
            ctx.fillStyle = '#64748b'; ctx.font = `600 ${Math.round(6.5 * scale)}px sans-serif`;
            ctx.fillText("のりば Track 1", signX - 25 * scale, platformTopY - 68 * scale);

            const infoBoardX = stopLineX + 220 * scale;
            ctx.fillStyle = '#1e293b'; ctx.fillRect(infoBoardX, platformTopY - 110 * scale, 3 * scale, 45 * scale); 
            ctx.fillStyle = '#020617'; ctx.strokeStyle = '#475569'; ctx.lineWidth = 1 * scale;
            ctx.fillRect(infoBoardX - 40 * scale, platformTopY - 95 * scale, 83 * scale, 32 * scale);
            ctx.strokeRect(infoBoardX - 40 * scale, platformTopY - 95 * scale, 83 * scale, 32 * scale);
            
            ctx.fillStyle = '#000000'; ctx.fillRect(infoBoardX - 37 * scale, platformTopY - 92 * scale, 77 * scale, 26 * scale);
            let blinkState = Math.sin(Date.now() * 0.005) > 0;
            ctx.fillStyle = blinkState ? '#ffcc00' : '#ff9900';
            ctx.font = `900 ${Math.round(7 * scale)}px monospace`;
            ctx.fillText("先発 15:32 新幹線", infoBoardX - 34 * scale, platformTopY - 82 * scale);
            ctx.fillStyle = doorOpen ? '#ef4444' : '#00ff88';
            ctx.font = `700 ${Math.round(6 * scale)}px sans-serif`;
            ctx.fillText(doorOpen ? "● 当駅止まり" : "● 1-12号車乗車位置", infoBoardX - 34 * scale, platformTopY - 71 * scale);

            const psdY = platformTopY - 24 * scale;
            const doorWidth = 16 * scale;
            const psdMoveOffset = (doorWidth / 2) * doorWidthPercent; 

            let psdDoor1X = trainStartX + 8 * scale;
            let psdDoor2X = (trainStartX - (240 * scale) - 8 * scale) + (240 * scale) - 25 * scale;
            
            if (isLeavingStationPhase) {
                psdDoor1X -= departureLeftShift;
                psdDoor2X -= departureLeftShift;
            } else if (!isArrived && distanceToStation > 0) {
                psdDoor1X = stopLineX - baseLength - 80 * scale; 
                psdDoor2X = stopLineX - baseLength * 2 - 110 * scale;
            }

            [psdDoor1X, psdDoor2X].forEach(px => {
                if (px > platformX - 50 && px < platformX + platformWidth + 50) {
                    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(px - 14 * scale, psdY, 14 * scale, 24 * scale);
                    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(px + doorWidth, psdY, 14 * scale, 24 * scale);
                    ctx.fillStyle = 'rgba(0, 149, 255, 0.2)'; ctx.fillRect(px - 10 * scale, psdY + 4 * scale, 10 * scale, 16 * scale);
                    ctx.fillRect(px + doorWidth, psdY + 4 * scale, 10 * scale, 16 * scale);

                    ctx.fillStyle = '#eab308';
                    ctx.fillRect(px - 14 * scale, psdY, 14 * scale, 3 * scale);
                    ctx.fillRect(px + doorWidth, psdY, 14 * scale, 3 * scale);

                    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)'; 
                    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1 * scale;
                    ctx.fillRect(px - psdMoveOffset, psdY + 2 * scale, doorWidth / 2, 22 * scale);
                    ctx.strokeRect(px - psdMoveOffset, psdY + 2 * scale, doorWidth / 2, 22 * scale);
                    ctx.fillRect(px + doorWidth / 2 + psdMoveOffset, psdY + 2 * scale, doorWidth / 2, 22 * scale);
                    ctx.strokeRect(px + doorWidth / 2 + psdMoveOffset, psdY + 2 * scale, doorWidth / 2, 22 * scale);

                    ctx.fillStyle = doorWidthPercent > 0.9 ? '#00ff88' : (Math.sin(Date.now()*0.02)>0 ? '#ef4444' : '#7f1d1d');
                    ctx.beginPath(); ctx.arc(px - 7 * scale, psdY + 6 * scale, 1.5 * scale, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(px + doorWidth + 7 * scale, psdY + 6 * scale, 1.5 * scale, 0, Math.PI * 2); ctx.fill();
                }
            });

            ctx.save();
            ctx.translate(stopLineX, platformTopY);
            
            const totalZWidth = 70 * scale;  
            const zoneHeight = 28 * scale;   
            
            let beamGrad = ctx.createLinearGradient(0, -120 * scale, 0, 0);
            beamGrad.addColorStop(0, 'rgba(255, 59, 59, 0)');
            beamGrad.addColorStop(0.5, 'rgba(255, 59, 59, 0.15)');
            beamGrad.addColorStop(1, 'rgba(255, 59, 59, 0.6)');
            ctx.fillStyle = beamGrad;
            ctx.fillRect(-1.5 * scale, -120 * scale, 3 * scale, 120 * scale);

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-totalZWidth / 2, 0, totalZWidth, zoneHeight);
            
            ctx.strokeStyle = '#ffee00';
            ctx.lineWidth = 6 * scale;
            ctx.save();
            ctx.beginPath();
            ctx.rect(-totalZWidth / 2, 0, totalZWidth, zoneHeight);
            ctx.clip(); 
            for (let offset = -totalZWidth; offset < totalZWidth; offset += 12 * scale) {
                ctx.moveTo(offset, 0);
                ctx.lineTo(offset + 16 * scale, zoneHeight);
            }
            ctx.stroke();
            ctx.restore();

            ctx.shadowColor = '#ff3b3b';
            ctx.shadowBlur = 10 * scale;
            ctx.strokeStyle = '#ff3b3b';
            ctx.lineWidth = 4 * scale;
            ctx.beginPath();
            ctx.moveTo(0, -5 * scale); 
            ctx.lineTo(0, zoneHeight + 5 * scale);
            ctx.stroke();
            ctx.shadowBlur = 0; 

            let blink = Math.sin(Date.now() * 0.008) > 0;
            ctx.shadowColor = blink ? '#00ff88' : '#ff003c';
            ctx.shadowBlur = 12 * scale;
            ctx.fillStyle = blink ? '#00ff88' : '#ff3b3b';
            ctx.font = `900 ${Math.round(16 * scale)}px Impact, sans-serif`; 
            ctx.textAlign = 'center';
            
            ctx.lineWidth = 2.5 * scale;
            ctx.strokeStyle = '#020617';
            ctx.strokeText("STOP", 0, zoneHeight + 18 * scale);
            ctx.fillText("STOP", 0, zoneHeight + 18 * scale);
            
            ctx.restore();
            ctx.restore();
        }

        function drawShinkansen() {
            const horizonY = height - 25; 
            const scale = Math.max(0.4, width / 600); 
            const baseLength = 240 * scale; const headLength = 90 * scale; const trainHeight = 45 * scale;
            const bounce = speed > 0 ? Math.sin(Date.now() / 40) * 1.0 : 0;
            const firstCarStartX = width * 0.15; const secondCarStartX = firstCarStartX - baseLength - 8 * scale; 
            const lightSourceX = firstCarStartX + baseLength + headLength - 6 * scale; 
            const lightSourceY = horizonY - trainHeight * 0.23 + bounce;

            if (isHeadlightOn) {
                ctx.save();
                let lightBeamGrad = ctx.createLinearGradient(lightSourceX, lightSourceY, width, lightSourceY);
                lightBeamGrad.addColorStop(0, 'rgba(255, 255, 245, 0.85)');    
                lightBeamGrad.addColorStop(0.04, 'rgba(235, 250, 255, 0.55)');  
                lightBeamGrad.addColorStop(0.15, 'rgba(255, 255, 240, 0.25)'); 
                lightBeamGrad.addColorStop(0.5, 'rgba(255, 255, 240, 0.08)');  
                lightBeamGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');       
                
                ctx.fillStyle = lightBeamGrad; 
                ctx.beginPath(); 
                ctx.moveTo(lightSourceX, lightSourceY - 1.5 * scale);
                ctx.lineTo(width, lightSourceY - height * 0.25); 
                ctx.lineTo(width, lightSourceY + height * 0.35); 
                ctx.closePath(); 
                ctx.fill(); 

                let groundGlow = ctx.createRadialGradient(lightSourceX, lightSourceY, 10 * scale, lightSourceX + 120 * scale, lightSourceY + 15 * scale, 130 * scale);
                groundGlow.addColorStop(0, 'rgba(255, 255, 230, 0.35)');
                groundGlow.addColorStop(0.5, 'rgba(255, 255, 240, 0.1)');
                groundGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = groundGlow;
                ctx.beginPath();
                ctx.ellipse(lightSourceX + 80 * scale, lightSourceY + 12 * scale, 120 * scale, 22 * scale, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.save(); ctx.translate(secondCarStartX, horizonY - trainHeight + bounce);
            let bodyGrad2 = ctx.createLinearGradient(0, 0, 0, trainHeight);
            bodyGrad2.addColorStop(0, '#ffffff'); bodyGrad2.addColorStop(0.15, '#f8fafc'); bodyGrad2.addColorStop(0.75, '#e2e8f0'); bodyGrad2.addColorStop(1, '#94a3b8');
            ctx.fillStyle = bodyGrad2; ctx.fillRect(0, 0, baseLength, trainHeight);
            ctx.fillStyle = '#334155'; ctx.fillRect(0, trainHeight - 4 * scale, baseLength, 4 * scale);
            ctx.fillStyle = '#0033cc'; ctx.fillRect(0, trainHeight * 0.44, baseLength, trainHeight * 0.12);
            for (let i = 15 * scale; i < baseLength - 35 * scale; i += 32 * scale) {
                ctx.fillStyle = '#1e293b'; ctx.fillRect(i, trainHeight * 0.2, 22 * scale, 11 * scale);
            }
            drawPhysicalDoor(baseLength - 25 * scale, trainHeight, scale); ctx.restore();

            ctx.save(); ctx.translate(secondCarStartX + baseLength, horizonY - trainHeight + bounce);
            let gangwayGrad = ctx.createLinearGradient(0, 0, 8 * scale, 0);
            gangwayGrad.addColorStop(0, '#0f172a'); gangwayGrad.addColorStop(0.5, '#475569'); gangwayGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = gangwayGrad; ctx.fillRect(0, trainHeight * 0.06, 8 * scale, trainHeight * 0.88);
            ctx.restore();

            ctx.save(); ctx.translate(firstCarStartX, horizonY - trainHeight + bounce);
            let bodyGrad1 = ctx.createLinearGradient(0, 0, 0, trainHeight);
            bodyGrad1.addColorStop(0, '#ffffff'); bodyGrad1.addColorStop(0.2, '#f8fafc'); bodyGrad1.addColorStop(0.7, '#e2e8f0'); bodyGrad1.addColorStop(1, '#94a3b8');
            ctx.fillStyle = bodyGrad1;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(baseLength, 0);
            ctx.quadraticCurveTo(baseLength + headLength * 0.75, -0.5 * scale, baseLength + headLength * 0.95, trainHeight * 0.62);
            ctx.quadraticCurveTo(baseLength + headLength, trainHeight * 0.76, baseLength + headLength, trainHeight);
            ctx.lineTo(0, trainHeight); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#334155'; ctx.fillRect(0, trainHeight - 4 * scale, baseLength + headLength * 0.7, 4 * scale);
            ctx.fillStyle = '#0033cc'; ctx.beginPath();
            ctx.moveTo(0, trainHeight * 0.44); ctx.lineTo(baseLength, trainHeight * 0.44);
            ctx.quadraticCurveTo(baseLength + headLength * 0.72, trainHeight * 0.44, baseLength + headLength * 0.92, trainHeight * 0.68);
            ctx.lineTo(baseLength + headLength * 0.85, trainHeight * 0.78);
            ctx.quadraticCurveTo(baseLength + headLength * 0.68, trainHeight * 0.56, baseLength, trainHeight * 0.56);
            ctx.lineTo(0, trainHeight * 0.56); ctx.fill();

            ctx.fillStyle = '#0f172a'; ctx.beginPath();
            ctx.moveTo(baseLength - 10 * scale, trainHeight * 0.08); ctx.lineTo(baseLength + 25 * scale, trainHeight * 0.08);
            ctx.quadraticCurveTo(baseLength + 45 * scale, trainHeight * 0.10, baseLength + 56 * scale, trainHeight * 0.35);
            ctx.lineTo(baseLength + 34 * scale, trainHeight * 0.35); ctx.closePath(); ctx.fill();
            
            for (let i = 35 * scale; i < baseLength - 20 * scale; i += 32 * scale) {
                ctx.fillStyle = '#1e293b'; ctx.fillRect(i, trainHeight * 0.2, 22 * scale, 11 * scale);
            }
            drawPhysicalDoor(8 * scale, trainHeight, scale);

            const lampX = baseLength + headLength - 8 * scale;
            const lampY = trainHeight * 0.72;

            ctx.fillStyle = '#111625';
            ctx.beginPath();
            ctx.ellipse(lampX, lampY, 4 * scale, 2.8 * scale, -Math.PI/12, 0, Math.PI * 2);
            ctx.fill();

            if (isHeadlightOn) {
                ctx.save();
                let pulse = 0.96 + Math.sin(Date.now() * 0.08) * 0.04;
                let flareGrad = ctx.createRadialGradient(lampX, lampY, 0.2 * scale, lampX, lampY, 15 * scale);
                flareGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                flareGrad.addColorStop(0.1, 'rgba(255, 255, 220, 0.8)');
                flareGrad.addColorStop(0.25, 'rgba(0, 229, 255, 0.35)'); 
                flareGrad.addColorStop(0.6, 'rgba(255, 255, 240, 0.06)');
                flareGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                ctx.fillStyle = flareGrad;
                ctx.globalAlpha = pulse;
                ctx.beginPath(); 
                ctx.arc(lampX, lampY, 15 * scale, 0, Math.PI * 2); 
                ctx.fill();

                ctx.shadowColor = '#00e5ff'; 
                ctx.shadowBlur = 8 * scale; 
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); 
                ctx.arc(lampX - 0.5 * scale, lampY, 1.8 * scale, 0, Math.PI * 2); 
                ctx.arc(lampX + 1.2 * scale, lampY + 0.3 * scale, 1.2 * scale, 0, Math.PI * 2); 
                ctx.fill();
                ctx.restore(); 
            } else {
                ctx.fillStyle = '#475569';
                ctx.beginPath();
                ctx.arc(lampX, lampY, 1.5 * scale, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore(); drawHornWaves(lightSourceX, lightSourceY);
        }

        function drawPhysicalDoor(doorX, trainHeight, scale) {
            const doorWidth = 16 * scale; 
            const doorHeight = 31 * scale; 
            const doorY = trainHeight - doorHeight - 4 * scale;

            ctx.save();
            ctx.fillStyle = '#111625'; 
            ctx.fillRect(doorX, doorY, doorWidth, doorHeight);
            
            const doorMoveOffset = (doorWidth / 2) * doorWidthPercent;
            let doorMetalGrad = ctx.createLinearGradient(doorX, doorY, doorX + doorWidth, doorY);
            doorMetalGrad.addColorStop(0, '#cbd5e1'); 
            doorMetalGrad.addColorStop(0.5, '#f1f5f9'); 
            doorMetalGrad.addColorStop(1, '#94a3b8');
            ctx.fillStyle = doorMetalGrad;

            ctx.save();
            ctx.beginPath(); 
            ctx.rect(doorX - doorMoveOffset, doorY, doorWidth / 2, doorHeight); 
            ctx.clip();
            ctx.fillRect(doorX - doorMoveOffset, doorY, doorWidth / 2, doorHeight);
            ctx.strokeStyle = '#64748b'; 
            ctx.lineWidth = Math.max(0.5, 0.5 * scale); 
            ctx.strokeRect(doorX - doorMoveOffset, doorY, doorWidth / 2, doorHeight);
            ctx.fillStyle = '#0f172a'; 
            ctx.fillRect(doorX - doorMoveOffset + (doorWidth / 4) - 1.5 * scale, doorY + 5 * scale, 3 * scale, 9 * scale);
            ctx.restore();

            ctx.save();
            ctx.beginPath(); 
            ctx.rect(doorX + doorWidth / 2 + doorMoveOffset, doorY, doorWidth / 2, doorHeight); 
            ctx.clip();
            ctx.fillRect(doorX + doorWidth / 2 + doorMoveOffset, doorY, doorWidth / 2, doorHeight);
            ctx.strokeStyle = '#64748b'; 
            ctx.lineWidth = Math.max(0.5, 0.5 * scale); 
            ctx.strokeRect(doorX + doorWidth / 2 + doorMoveOffset, doorY, doorWidth / 2, doorHeight);
            ctx.fillStyle = '#0f172a'; 
            ctx.fillRect(doorX + (doorWidth / 2) + doorMoveOffset + 1.5 * scale, doorY + 5 * scale, 3 * scale, 9 * scale);
            ctx.restore();

            ctx.fillStyle = '#1e293b'; 
            ctx.fillRect(doorX + (doorWidth / 2) - 0.4 * scale, doorY + 1 * scale, 0.8 * scale, doorHeight - 2 * scale);
            ctx.strokeStyle = '#475569'; 
            ctx.lineWidth = Math.max(0.5, 0.8 * scale); 
            ctx.strokeRect(doorX, doorY, doorWidth, doorHeight);
            ctx.restore();
        }

        function triggerHorn() {
            hornWaves.push({ radius: 8, alpha: 1.0, maxRadius: 100 }); playHornSound(); 
        }

        function drawHornWaves(startX, startY) {
            ctx.save();
            for (let i = hornWaves.length - 1; i >= 0; i--) {
                let wave = hornWaves[i]; wave.radius += 3; wave.alpha -= 0.03;
                if (wave.alpha <= 0) { hornWaves.splice(i, 1); continue; }
                ctx.strokeStyle = `rgba(0, 229, 255, ${wave.alpha})`; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(startX, startY, wave.radius, -Math.PI/3, Math.PI/3, false); ctx.stroke();
            }
            ctx.restore();
        }

        function prepareNextStationScene() {
            nextScene = scenePool[Math.floor(Math.random() * scenePool.length)];
            nextWeather = weatherPool[Math.floor(Math.random() * weatherPool.length)];
            isTransitioning = true; transitionAlpha = 0; 
        }

        function commitNextStation() {
            let availableStations = stationPool.filter(s => s.name !== currentStationName);
            currentStationName = availableStations[Math.floor(Math.random() * availableStations.length)].name;
            totalStationDistance = Math.floor(Math.random() * 2501) + 2500; distanceToStation = totalStationDistance;
            document.getElementById('station-name-display').innerText = currentStationName;
            if (nextScene && nextWeather) { currentScene = nextScene; currentWeather = nextWeather; }
            isTransitioning = false; hasTriggeredTransition = false; transitionAlpha = 0;
            
            currentStationLandscape = Math.floor(Math.random() * 4); 

            initWeatherParticles(); initSkyObjects(); initStars();
        }

        function gameLoop(timestamp) {
            let dt = timestamp - lastTime;
            if (dt > 100) dt = 16.66; 
            lastTime = timestamp;

            const timeRatio = dt / 16.66; 
            const scale = Math.max(0.4, width / 600); 

            if (skyObjects.filter(o => o.type === 'plane').length === 0 && Math.random() < 0.001 * timeRatio) skyObjects.push(generatePlane());
            if (skyObjects.filter(o => o.type === 'bird').length === 0 && Math.random() < 0.002 * timeRatio) generateBirdFlock();

            if (isMissionFailed) {
                failureResetTimer -= 1 * timeRatio;
                targetSpeed = 0; speed = 0; 
                if (failureResetTimer <= 0) {
                    isMissionFailed = false; distanceToStation = 10; 
                    isArrived = false; doorOpen = false; isClosingDoors = false; doorWidthPercent = 0; 
                    isLeavingStationPhase = false; departureLeftShift = 0;
                    resetLeverUI(); 
                    stationMessage = "重新挑戰！請拖動左側拉桿精準停靠 0m 處"; messageTimer = 180;
                }
            }

            if (isMovingUp && doorOpen && !isClosingDoors && !isMissionFailed) {
                isClosingDoors = true; 
                hasSpawnedLeavers = false;
                isLeavingStationPhase = true; 
                departureLeftShift = 0; 
            } 

            if (isClosingDoors) {
                targetSpeed = 0; speed = 0; doorWidthPercent -= 0.05 * timeRatio; 
                if (doorWidthPercent <= 0) {
                    doorWidthPercent = 0; doorOpen = false; isClosingDoors = false; isArrived = false;
                    stationMessage = "列車啟動，正全速離開月台..."; messageTimer = 100;
                }
            } else {
                let accelRate = isTurboMode ? 7.5 : 2.5;
                if (isMovingUp && !isMissionFailed && !doorOpen) targetSpeed = Math.min(maxSpeedLimit, targetSpeed + accelRate * timeRatio);
                
                if (isArrived && speed === 0 && !isMissionFailed) {
                    doorWidthPercent = Math.min(1.0, doorWidthPercent + 0.04 * timeRatio);
                    
                    if (doorWidthPercent >= 1.0 && !hasSpawnedLeavers) {
                        const trainStartX = width * 0.15;
                        const baseLength = 240 * scale;
                        let door1CanvasX = trainStartX + 8 * scale + (16 * scale / 2); 
                        let door2CanvasX = (trainStartX - baseLength - 8 * scale) + baseLength - 25 * scale + (16 * scale / 2); 
                        
                        spawnLeavingPassengers(door1CanvasX, door2CanvasX, scale);
                        hasSpawnedLeavers = true;
                    }
                }
            }

            if (isMovingDown && !isMissionFailed) targetSpeed = Math.max(0, targetSpeed - 3 * timeRatio);

            if (!isMissionFailed) {
                speed += (targetSpeed - speed) * (0.03 * timeRatio);
                if (Math.abs(speed) < 0.1) speed = 0;
                distance += speed * 0.5 * timeRatio;
                
                if (isLeavingStationPhase) {
                    departureLeftShift += speed * 0.5 * timeRatio; 
                    
                    const trainStartX = width * 0.15;
                    const baseLength = 240 * scale;
                    const headLength = 90 * scale;
                    const perfectStopCanvasX = trainStartX + baseLength + headLength;
                    const stopLineX = perfectStopCanvasX - departureLeftShift;
                    const platformX = stopLineX - 1300 * scale;
                    const platformWidth = width * 8;
                    const platformRightEdge = platformX + platformWidth; 
                    
                    if (platformRightEdge < 0) {
                        isLeavingStationPhase = false; 
                        departureLeftShift = 0; 
                        commitNextStation(); 
                        stationMessage = `出發！前方進入【${currentScene.label}】`; messageTimer = 160;
                    }
                }
            }

            if (!isTurboMode && targetSpeed > 320) targetSpeed = 320;

            updateTrainSounds();
            
            if (hasSpawnedLeavers && leavingPassengers.length > 0) {
                updateLeavingPassengers(timeRatio, scale);
            }
            
            if (!isArrived && !isMissionFailed && !isLeavingStationPhase) {
                distanceToStation -= (speed / 360) * timeRatio; 

                if (distanceToStation <= 500 && distanceToStation > 0 && !hasTriggeredTransition) {
                    prepareNextStationScene(); hasTriggeredTransition = true;
                }

                if (isTransitioning) transitionAlpha = (distanceToStation > 50) ? 1 - ((distanceToStation - 50) / 450) : 1;
                
                if (speed === 0 && distanceToStation <= 20) { 
                    if (Math.abs(distanceToStation) <= 10) {
                        isArrived = true; doorOpen = true;
                        let error = Math.round(distanceToStation);
                        stationMessage = error === 0 ? "完美停靠！誤差 0m，車門已開啟" : `合格停靠！${error > 0 ? '提早' : '衝過頭'}了 ${Math.abs(error)}m，車門已開啟`;
                        messageTimer = 120;
                    } else if (distanceToStation < -10) {
                        isMissionFailed = true; targetSpeed = 0; speed = 0;
                        stationMessage = "任務失敗：過站未停！(正在回送中...)"; failureResetTimer = 90; 
                    }
                }
                if (distanceToStation < -50) {
                    isMissionFailed = true; targetSpeed = 0; speed = 0;
                    stationMessage = "任務失敗：過站未停！"; failureResetTimer = 90; 
                }
            }

            const distDisplay = document.getElementById('station-dist-display');
            if (isLeavingStationPhase) {
                distDisplay.innerText = "出站中..."; distDisplay.style.color = "#64748b";
            } else if (distanceToStation > 1000) {
                distDisplay.innerText = (distanceToStation / 1000).toFixed(2) + " km"; distDisplay.style.color = "#00e5ff";
            } else if (distanceToStation > 0) {
                distDisplay.innerText = Math.round(distanceToStation) + " m"; distDisplay.style.color = (distanceToStation < 150) ? "#ff3b3b" : "#eab308";
            } else {
                distDisplay.innerText = "0 m (ARRIVED)"; distDisplay.style.color = "#00ff88";
            }

            document.getElementById('gauge-fill-circle').style.strokeDashoffset = 240 - (240 * (speed / maxSpeedLimit));
            updateTachoVisuals();

            document.getElementById('speed-display').innerText = Math.round(speed).toString().padStart(3, '0');
            document.getElementById('odometer-display').innerText = (distance / 250).toFixed(1);

            updateLedTicker(timeRatio);
            updateSensorMatrix();

            ctx.clearRect(0, 0, width, height);
            drawBackground(timeRatio); 

            if ((distanceToStation <= 250 && distanceToStation >= -120) || isArrived || isMissionFailed || isLeavingStationPhase) {
                drawPlatform(); 
            }

            drawShinkansen(); 
            drawWeather(timeRatio);    

            requestAnimationFrame(gameLoop);
        }

        /* 🎛️ 拉桿控制邏輯 */
        const container = document.getElementById('leverContainer');
        const handle = document.getElementById('leverHandle');
        const lblP = document.getElementById('lbl-p');
        const lblN = document.getElementById('lbl-n');
        const lblB = document.getElementById('lbl-b');

        let MIN_TOP = 6;    
        let MID_TOP = 47;   
        let MAX_TOP = 88;  

        function recalcLeverPositions() {
            const containerHeight = container.clientHeight;
            const handleHeight = handle.clientHeight;
            MIN_TOP = 6;
            MAX_TOP = containerHeight - handleHeight - 6;
            MID_TOP = (containerHeight - handleHeight) / 2;
            if(!isInteractingWithLever) {
                handle.style.top = MID_TOP + 'px';
            }
        }

        let isInteractingWithLever = false;
        let startClientY = 0;
        let startTop = MID_TOP;

        function updateLeverUI(currentTop) {
            handle.style.top = currentTop + 'px';
            lblP.className = (currentTop < MID_TOP - 10) ? 'active-p' : '';
            lblN.className = (currentTop >= MID_TOP - 10 && currentTop <= MID_TOP + 10) ? 'active-n' : '';
            lblB.className = (currentTop > MID_TOP + 10) ? 'active-b' : '';
        }

        function resetLeverUI() {
            isMovingUp = false;
            isMovingDown = false;
            updateLeverUI(MID_TOP);
        }

        function handleLeverStart(clientY) {
            if (isMissionFailed) return;
            if (!audioCtx) initAudio();
            isInteractingWithLever = true;
            startClientY = clientY;
            startTop = parseFloat(handle.style.top) || MID_TOP;
            handle.style.transition = 'none'; 
        }

        function handleLeverMove(clientY) {
            if (!isInteractingWithLever) return;
            const deltaY = clientY - startClientY;
            let newTop = startTop + deltaY;

            if (newTop < MIN_TOP) newTop = MIN_TOP;
            if (newTop > MAX_TOP) newTop = MAX_TOP;

            updateLeverUI(newTop);

            if (newTop < MID_TOP - 12) {
                isMovingUp = true;   
                isMovingDown = false;
            } else if (newTop > MID_TOP + 12) {
                isMovingDown = true; 
                isMovingUp = false;
            } else {
                isMovingUp = false;  
                isMovingDown = false;
            }
        }

        function handleLeverEnd() {
            if (!isInteractingWithLever) return;
            isInteractingWithLever = false;
            handle.style.transition = 'top 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            resetLeverUI();
        }

        handle.addEventListener('mousedown', (e) => { e.preventDefault(); handleLeverStart(e.clientY); });
        window.addEventListener('mousemove', (e) => { handleLeverMove(e.clientY); });
        window.addEventListener('mouseup', handleLeverEnd);

        handle.addEventListener('touchstart', (e) => { e.preventDefault(); handleLeverStart(e.touches[0].clientY); }, { passive: false });
        window.addEventListener('touchmove', (e) => { handleLeverMove(e.touches[0].clientY); }, { passive: false });
        window.addEventListener('touchend', handleLeverEnd);

        /* ⌨️ 鍵盤/點擊監聽 */
        let lastTouchTime = 0; 
        window.addEventListener('touchstart', (e) => {
            if (document.getElementById('dashboard').contains(e.target) || isMissionFailed) return;
            const MathNow = performance.now();
            const timespan = MathNow - lastTouchTime;
            lastTouchTime = MathNow;
            if (timespan > 0 && timespan < 300) { e.preventDefault(); isHeadlightOn = !isHeadlightOn; return; }
            if (!audioCtx) initAudio(); 
        }, { passive: false }); 

        window.addEventListener('mousedown', (e) => {
            if (!audioCtx) initAudio(); 
            if (document.getElementById('dashboard').contains(e.target) || isMissionFailed) return;
            
            if (e.button === 2) {
                e.preventDefault();
                isHeadlightOn = !isHeadlightOn;
            } 
            else if (e.button === 0) { 
                triggerHorn(); 
            } 
        });

        window.addEventListener('dblclick', (e) => {
            if (document.getElementById('dashboard').contains(e.target) || isMissionFailed) return;
            isHeadlightOn = !isHeadlightOn;
        });

        window.addEventListener('keydown', (e) => {
            if (!audioCtx) initAudio(); if (isMissionFailed) return;
            
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault(); 
                triggerHorn();
                return;
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                isHeadlightOn = !isHeadlightOn;
                return;
            }

            if (e.key === 't' || e.key === 'T') {
                isTurboMode = !isTurboMode;
                if (isTurboMode) {
                    maxSpeedLimit = 960; 
                    targetSpeed = targetSpeed * 3;
                    stationMessage = "⚡ 限制完全解除！進入 3 倍超載模式 (極速 960 KM/H)";
                    messageTimer = 140;
                } else {
                    maxSpeedLimit = 320;
                    targetSpeed = Math.min(320, targetSpeed / 3);
                    stationMessage = "安全保護恢復：標準速限 320 KM/H";
                    messageTimer = 120;
                }
                return;
            }

            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                if(e.key === 'ArrowUp') e.preventDefault(); 
                isMovingUp = true; isMovingDown = false;
                handle.style.transition = 'top 0.1s ease-out'; updateLeverUI(MIN_TOP);
            }
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                if(e.key === 'ArrowDown') e.preventDefault();
                isMovingDown = true; isMovingUp = false;
                handle.style.transition = 'top 0.1s ease-out'; updateLeverUI(MAX_TOP);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                handle.style.transition = 'top 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; resetLeverUI();
            }
        });

        window.addEventListener('wheel', (e) => {
            if (!audioCtx) initAudio(); if (isMissionFailed) return;
            let wheelStep = isTurboMode ? 45 : 15; 
            if (e.deltaY < 0) {
                if (doorOpen) { isMovingUp = true; setTimeout(() => { isMovingUp = false; }, 200); } 
                else targetSpeed = Math.min(maxSpeedLimit, targetSpeed + wheelStep);
            } else if (e.deltaY > 0) targetSpeed = Math.max(0, targetSpeed - wheelStep);
        });

        /* 🎵 音樂播放器精簡功能 */
        const btnMusic = document.getElementById('btn-music');
        const musicUpload = document.getElementById('music-upload');
        const bgmPlayer = document.getElementById('bgm-player');

        btnMusic.addEventListener('mousedown', (e) => {
            e.stopPropagation(); // 防止點擊按鈕時觸發火車鳴笛
            if (!bgmPlayer.src || bgmPlayer.src === window.location.href) {
                musicUpload.click(); // 尚未選擇音樂時，彈出選擇視窗
            } else {
                if (bgmPlayer.paused) { 
                    bgmPlayer.play(); 
                    btnMusic.classList.add('playing'); 
                } else { 
                    bgmPlayer.pause(); 
                    btnMusic.classList.remove('playing'); 
                }
            }
        });

        musicUpload.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                bgmPlayer.src = URL.createObjectURL(file);
                bgmPlayer.play();
                btnMusic.classList.add('playing');
                // 利用跑馬燈顯示正在播放的音樂
                stationMessage = "🎵 播放 BGM: " + file.name;
                messageTimer = 180;
            }
        });

        initTachoTicks();
        resize();
        recalcLeverPositions();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
