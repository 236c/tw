<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>擬真新幹線控制台</title>
    <style>
        :root {
            --primary-color: #00e5ff;
            --panel-glow: 0 0 20px rgba(0, 229, 255, 0.25);
            --bg-dark: rgba(10, 15, 26, 0.95);
            --metal-gradient: linear-gradient(180deg, #1e2640 0%, #111625 40%, #070a12 100%);
            --btn-gradient: linear-gradient(180deg, #2d3859 0%, #1c233a 100%);
            --border-radius: 12px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            touch-action: none;
            display: flex;
            flex-direction: column;
        }

        canvas {
            display: block;
            flex: 1; 
            width: 100%;
            height: 100%;
            z-index: 5;
            min-height: 0; 
            will-change: transform; 
        }

        #dashboard {
            width: 100%;
            background: var(--metal-gradient);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0; 
            display: flex;
            flex-direction: row;
            flex-wrap: wrap; 
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            gap: 16px;
            box-sizing: border-box;
            box-shadow: 
                inset 0 1px 1px rgba(255,255,255,0.15), 
                inset 0 -3px 10px rgba(0,0,0,0.95),
                0 -10px 30px rgba(0, 0, 0, 0.5);
            color: #fff;
            z-index: 10;
            user-select: none;
            -webkit-user-select: none;
            flex-shrink: 0; 
            max-height: 25vh; 
        }

        #dashboard::after {
            content: '';
            position: absolute;
            top: 4px; right: 4px; bottom: 4px; left: 4px;
            background-image: 
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 8px 8px;
            pointer-events: none;
        }

        .gauge-cluster {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            min-width: 280px;
            max-width: 450px; 
        }

        .segmented-gauge {
            width: 84px;
            height: 84px;
            position: relative;
            background: #04070f;
            border-radius: 50%;
            border: 2px solid #2d3748;
            box-shadow: 
                inset 0 4px 12px rgba(0,0,0,0.95), 
                0 1px 2px rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .gauge-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .gauge-track { fill: none; stroke: #141a29; stroke-width: 6; }
        .gauge-fill {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 6;
            stroke-dasharray: 220;
            stroke-dashoffset: 220;
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
        }

        .gauge-center-text {
            position: absolute;
            font-size: 10px;
            color: #475569;
            font-weight: 800;
            letter-spacing: 1.5px;
            top: 20px;
        }

        .dash-metrics {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dash-label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-weight: 700;
        }

        .dash-value-container {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .dash-value {
            font-size: 42px;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
            color: var(--primary-color);
            text-shadow: var(--panel-glow);
            background: #02050b;
            padding: 4px 14px;
            border-radius: 6px;
            box-shadow: 
                inset 0 4px 8px rgba(0,0,0,0.95),
                0 1px 1px rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.02);
            position: relative;
            overflow: hidden;
        }

        .dash-value::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 229, 255, 0.04) 50%, transparent 50%);
            background-size: 100% 3px;
            pointer-events: none;
        }

        .dash-unit { font-size: 12px; color: #475569; font-weight: 800; letter-spacing: 1px; }
        .odometer {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #64748b;
            background-color: #050811;
            padding: 3px 10px;
            border-radius: 4px;
            width: fit-content;
            border: 1px solid rgba(255,255,255,0.01);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .dash-control-center {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex: 1.2;
            min-width: 320px;
            max-width: 600px;
        }

        .station-panel {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #02050b;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
            min-width: 120px;
            flex: 1;
        }
        .station-title {
            font-size: 9px;
            color: #475569;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .station-dist-num {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: 700;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255,204,0,0.3);
            text-align: right;
        }
        .station-name {
            font-size: 11px;
            color: #94a3b8;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        #status-panel {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 10px;
            color: #475569;
            font-weight: 800;
            padding-right: 15px;
            border-right: 1px solid rgba(255,255,255,0.08);
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        .status-item { display: flex; align-items: center; }
        .status-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid rgba(0,0,0,0.5);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
        }
        .status-on { background-color: #00ff88; box-shadow: 0 0 10px #00ff88, 0 0 4px #00ff88; }
        .status-off { background-color: #1e293b; }
        .status-brake { background-color: #ff3b3b; box-shadow: 0 0 10px #ff3b3b, 0 0 4px #ff3b3b; }
        .status-yellow { background-color: #ffcc00; box-shadow: 0 0 10px #ffcc00, 0 0 4px #ffcc00; }
        .status-door { background-color: #00e5ff; box-shadow: 0 0 10px #00e5ff, 0 0 4px #00e5ff; }

        .button-matrix { display: flex; gap: 10px; flex-shrink: 0; }

        .realistic-button {
            background: var(--btn-gradient);
            border: 1px solid rgba(255,255,255,0.08);
            border-top: 1px solid rgba(255,255,255,0.18);
            color: #e2e8f0;
            padding: 10px 20px;
            border-radius: var(--border-radius);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.1), 
                0 4px 6px rgba(0,0,0,0.5),
                0 1px 1px rgba(0,0,0,0.5);
            touch-action: manipulation;
        }

        @media (max-width: 768px) {
            #dashboard {
                padding: 12px 20px;
                gap: 8px;
                max-height: none; 
            }
            .gauge-cluster {
                justify-content: center;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                padding-bottom: 8px;
                margin-bottom: 2px;
                flex: 1 0 100%; 
                max-width: 100%;
            }
            .dash-control-center {
                flex: 1 0 100%; 
                max-width: 100%;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="transition-overlay"></div>

    <div id="dashboard" oncontextmenu="return false;">
        <div class="gauge-cluster">
            <div class="segmented-gauge">
                <div class="gauge-center-text">TACHO</div>
                <svg class="gauge-svg" viewBox="0 0 100 100">
                    <circle class="gauge-track" cx="50" cy="50" r="40"></circle>
                    <circle class="gauge-fill" id="gauge-fill-circle" cx="50" cy="50" r="40"></circle>
                </svg>
            </div>
            
            <div class="dash-metrics">
                <div class="dash-label">CRUISE SPEED</div>
                <div class="dash-value-container">
                    <div class="dash-value" id="speed-display">000</div>
                    <div class="dash-unit">KM/H</div>
                </div>
                <div class="odometer">ODO: <span id="odometer-display">0000.0</span> KM</div>
            </div>
        </div>
        
        <div class="dash-control-center">
            <div class="station-panel">
                <div class="station-title">NEXT STATION</div>
                <div class="station-name" id="station-name-display">東京 (TOKYO)</div>
                <div class="station-dist-num" id="station-dist-display">3000m</div>
            </div>

            <div id="status-panel">
                <div class="status-item"><span class="status-led status-off" id="led-power"></span>ENG PWR</div>
                <div class="status-item"><span class="status-led status-off" id="led-brake"></span>BRK SYS</div>
                <div class="status-item"><span class="status-led status-on" id="led-headlight"></span>H-LIGHT</div>
                <div class="status-item"><span class="status-led status-off" id="led-door"></span>DOOR OPEN</div>
            </div>
            
            <div class="button-matrix">
                <button class="realistic-button" id="btn-decel">減速 (↓)</button>
                <button class="realistic-button" id="btn-accel">加速 (↑)</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let speed = 0;
        let targetSpeed = 0;
        let distance = 0;
        
        let isHeadlightOn = true; 
        let hornWaves = []; 

        let isMovingUp = false;
        let isMovingDown = false;
        let weatherParticles = [];

        let lastTime = performance.now();

        let audioCtx = null;
        let runGainNode = null;      
        let lastTrackClackTime = 0;  

        function initAudio() {
            if (audioCtx) return; 
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer; noiseSource.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(150, audioCtx.currentTime); 

            runGainNode = audioCtx.createGain(); runGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            noiseSource.connect(filter); filter.connect(runGainNode); runGainNode.connect(audioCtx.destination);
            noiseSource.start();
        }

        function playHornSound() {
            if (!audioCtx) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator();
            const hornGain = audioCtx.createGain();
            osc1.type = 'triangle'; osc1.frequency.setValueAtTime(400, now);
            osc2.type = 'triangle'; osc2.frequency.setValueAtTime(480, now);
            hornGain.gain.setValueAtTime(0, now);
            hornGain.gain.linearRampToValueAtTime(0.25, now + 0.1);
            hornGain.gain.setValueAtTime(0.25, now + 0.6);
            hornGain.gain.linearRampToValueAtTime(0, now + 1.1);
            osc1.connect(hornGain); osc2.connect(hornGain); hornGain.connect(audioCtx.destination);
            osc1.start(now); osc2.start(now); osc1.stop(now + 1.2); osc2.stop(now + 1.2);
        }

        function updateTrainSounds() {
            if (!audioCtx || !runGainNode) return;
            const now = audioCtx.currentTime;
            const currentSpeedPercent = speed / 320; 
            runGainNode.gain.setTargetAtTime(currentSpeedPercent * 0.15, now, 0.1);
            if (speed > 10) {
                const clackInterval = 1500 / speed; 
                if (now - lastTrackClackTime > clackInterval) {
                    playTrackClack(); lastTrackClackTime = now;
                }
            }
        }

        function playTrackClack() {
            const now = audioCtx.currentTime;
            const oscReal = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
            oscReal.type = 'sine'; oscReal.frequency.setValueAtTime(60, now);
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(100, now);
            const speedVol = (speed / 320) * 0.25;
            gain.gain.setValueAtTime(speedVol, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            oscReal.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            oscReal.start(now); oscReal.stop(now + 0.1);
            setTimeout(() => {
                if (!audioCtx || speed < 10) return;
                const now2 = audioCtx.currentTime;
                const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain(); const filter2 = audioCtx.createBiquadFilter();
                osc2.type = 'sine'; osc2.frequency.setValueAtTime(55, now2);
                filter2.type = 'lowpass'; filter2.frequency.setValueAtTime(90, now2);
                gain2.gain.setValueAtTime(speedVol * 0.7, now2); gain2.gain.exponentialRampToValueAtTime(0.001, now2 + 0.07);
                osc2.connect(filter2); filter2.connect(gain2); gain2.connect(audioCtx.destination);
                osc2.start(now2); osc2.stop(now2 + 0.09);
            }, 120);
        }

        const stationPool = [
            { name: "東京 (TOKYO)" }, { name: "品川 (SHINAGAWA)" }, { name: "新横浜 (SHIN-YOKOHAMA)" },
            { name: "名古屋 (NAGOYA)" }, { name: "京都 (KYOTO)" }, { name: "新大阪 (SHIN-OSAKA)" },
            { name: "博多 (HAKATA)" }, { name: "新青森 (SHIN-AOMORI)" }
        ];
        let currentStationName = "東京 (TOKYO)";
        let totalStationDistance = 3000; let distanceToStation = totalStationDistance; 
        let isArrived = false; let doorOpen = false; let isClosingDoors = false; 
        let doorWidthPercent = 0; let stationMessage = ""; let messageTimer = 0;
        let isMissionFailed = false; let failureResetTimer = 0;

        const weatherPool = [
            { type: 'sunny', label: "晴天 (☀️ SUNNY)", mountainColor: 'rgba(0,0,0,0.06)' },
            { type: 'cloudy', label: "陰天 (☁️ CLOUDY)", mountainColor: 'rgba(0,0,0,0.12)' },
            { type: 'rain', label: "雨天 (🌧️ RAIN)", mountainColor: 'rgba(0,0,0,0.15)' },
            { type: 'snow', label: "下雪 (❄️ SNOW)", mountainColor: 'rgba(0,0,0,0.18)' }
        ];
        const scenePool = [
            { id: 'mountain', label: "山景 ⛰️", skyTop: '#74b9ff', skyBottom: '#eccc68' }, // 升級清晨群山日落天空色彩
            { id: 'ocean', label: "海景 🌊", skyTop: '#0a3d62', skyBottom: '#3c6382' },
            { id: 'forest', label: "樹林 🌲", skyTop: '#2bcbba', skyBottom: '#e8f8f5' },   // 升級林間清爽天空色
            { id: 'city', label: "都市 🏙️", skyTop: '#1e272c', skyBottom: '#405059' }, 
            { id: 'country', label: "鄉村 🏡", skyTop: '#f6b93b', skyBottom: '#f8fafc' }
        ];

        let currentWeather = weatherPool[Math.floor(Math.random() * weatherPool.length)]; 
        let currentScene = scenePool[Math.floor(Math.random() * scenePool.length)]; 
        let nextScene = null; let nextWeather = null;
        let transitionAlpha = 0; let isTransitioning = false; let hasTriggeredTransition = false; 
        let skyObjects = [];

        function initSkyObjects() {
            skyObjects = [];
            for (let i = 0; i < 5; i++) { 
                skyObjects.push({
                    type: 'cloud',
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.23) + 30,
                    size: Math.random() * 40 + 40,
                    baseSpeed: Math.random() * 0.2 + 0.1,
                    layer: Math.random() > 0.5 ? 1 : 2 
                });
            }
            if (Math.random() > 0.3) skyObjects.push(generatePlane());
            generateBirdFlock();
        }

        function generatePlane() {
            return {
                type: 'plane', x: -150 - Math.random() * 200, y: Math.random() * (height * 0.15) + 20,
                size: Math.random() * 15 + 15, baseSpeed: Math.random() * 0.8 + 0.5, contrail: [] 
            };
        }

        function generateBirdFlock() {
            let startX = width + 50 + Math.random() * 150;
            let startY = Math.random() * (height * 0.18) + 40;
            let size = Math.floor(Math.random() * 3) + 2; 
            for(let i=0; i<size; i++) {
                skyObjects.push({
                    type: 'bird',
                    x: startX + (i * 22),
                    y: startY + (Math.sin(i) * 12),
                    size: Math.random() * 4 + 6,
                    baseSpeed: -(Math.random() * 1.0 + 1.2), 
                    wingWing: Math.random() * Math.PI
                });
            }
        }

        function updateAndDrawSkyObjects(globalAlphaValue, timeRatio) {
            ctx.save();
            ctx.globalAlpha = globalAlphaValue;

            let activeWeatherType = (transitionAlpha > 0.5 && nextWeather) ? nextWeather.type : currentWeather.type;
            if (activeWeatherType === 'sunny') {
                let sunX = width * 0.75; let sunY = height * 0.18;
                let sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 65);
                sunGlow.addColorStop(0, 'rgba(255, 253, 230, 1)');
                sunGlow.addColorStop(0.2, 'rgba(255, 200, 80, 0.8)');
                sunGlow.addColorStop(1, 'rgba(255, 120, 0, 0)');
                ctx.fillStyle = sunGlow; ctx.beginPath(); ctx.arc(sunX, sunY, 65, 0, Math.PI * 2); ctx.fill();
            }

            for (let i = skyObjects.length - 1; i >= 0; i--) {
                let obj = skyObjects[i];
                let speedFactor = 0;
                if (obj.type === 'cloud') speedFactor = obj.layer === 1 ? 0.04 : 0.08; 
                if (obj.type === 'plane') speedFactor = 0.12; 
                if (obj.type === 'bird') speedFactor = 0.25;

                obj.x += (obj.baseSpeed - (speed * speedFactor)) * timeRatio;

                if (obj.type === 'cloud' && obj.x < -obj.size * 2) { 
                    obj.x = width + obj.size; obj.y = Math.random() * (height * 0.25) + 30; 
                }
                if (obj.type === 'plane' && obj.x > width + 250) { skyObjects.splice(i, 1); continue; }
                if (obj.type === 'bird' && obj.x < -100) { skyObjects.splice(i, 1); continue; }

                if (obj.type === 'cloud') {
                    ctx.fillStyle = activeWeatherType === 'sunny' ? 'rgba(255, 255, 255, 0.85)' : 'rgba(200, 207, 214, 0.6)';
                    ctx.beginPath();
                    ctx.arc(obj.x, obj.y, obj.size * 0.4, 0, Math.PI * 2);
                    ctx.arc(obj.x + obj.size * 0.25, obj.y - obj.size * 0.2, obj.size * 0.5, 0, Math.PI * 2);
                    ctx.arc(obj.x + obj.size * 0.55, obj.y - obj.size * 0.1, obj.size * 0.4, 0, Math.PI * 2);
                    ctx.arc(obj.x + obj.size * 0.3, obj.y + obj.size * 0.1, obj.size * 0.4, 0, Math.PI * 2);
                    ctx.arc(obj.x + obj.size * 0.6, obj.y, obj.size * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                } 
                else if (obj.type === 'plane') {
                    if (speed > 5 && Math.random() > 0.4) obj.contrail.push({x: obj.x, y: obj.y + 2});
                    if (obj.contrail.length > 30) obj.contrail.shift();
                    if (obj.contrail.length > 1) {
                        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2;
                        ctx.beginPath(); ctx.moveTo(obj.contrail[0].x, obj.contrail[0].y);
                        for(let e=1; e<obj.contrail.length; e++) ctx.lineTo(obj.contrail[e].x, obj.contrail[e].y);
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#f8fafc'; ctx.save(); ctx.translate(obj.x, obj.y);
                    ctx.fillRect(0, 0, obj.size, obj.size * 0.18);
                    ctx.beginPath();
                    ctx.moveTo(obj.size * 0.4, obj.size * 0.09);
                    ctx.lineTo(obj.size * 0.2, -obj.size * 0.35);
                    ctx.lineTo(obj.size * 0.35, -obj.size * 0.35);
                    ctx.lineTo(obj.size * 0.55, obj.size * 0.09);
                    ctx.fill();
                    ctx.restore();
                }
                else if (obj.type === 'bird') {
                    obj.wingWing += 0.2 * timeRatio;
                    let wingY = Math.sin(obj.wingWing) * obj.size;
                    ctx.strokeStyle = activeWeatherType === 'sunny' ? '#475569' : '#1e293b';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(obj.x - obj.size, obj.y + wingY);
                    ctx.quadraticCurveTo(obj.x - obj.size * 0.4, obj.y - obj.size * 0.2, obj.x, obj.y);
                    ctx.quadraticCurveTo(obj.x + obj.size * 0.4, obj.y - obj.size * 0.2, obj.x + obj.size, obj.y + wingY);
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        let passengers = [];
        function initPassengers() {
            passengers = [];
            for (let i = 0; i < 20; i++) {
                passengers.push({
                    relX: Math.random() * 1100 - 1120, type: Math.floor(Math.random() * 3), 
                    color: ['#1e3a8a', '#b45309', '#047857'][Math.floor(Math.random() * 3)],
                    height: Math.random() * 5 + 16, swayOffset: Math.random() * 100
                });
            }
        }

        function resize() {
            const dpr = Math.min(1.5, window.devicePixelRatio || 1);
            width = canvas.clientWidth;
            height = canvas.clientHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr); 
            initWeatherParticles(); initPassengers(); initSkyObjects(); 
        }
        window.addEventListener('resize', resize);
        window.addEventListener('contextmenu', (e) => e.preventDefault());

        function initWeatherParticles() {
            weatherParticles = [];
            const count = width < 600 ? 70 : 130; 
            for (let i = 0; i < count; i++) {
                weatherParticles.push({
                    x: Math.random() * width, y: Math.random() * height,
                    size: Math.random() * 1.5 + 1, speedY: Math.random() * 5 + 6, speedX: Math.random() * 1 - 0.5
                });
            }
        }

        function drawWeather(timeRatio) {
            let currentType = (transitionAlpha > 0.5 && nextWeather) ? nextWeather.type : currentWeather.type;
            if (currentType === 'sunny' || currentType === 'cloudy') return; 

            ctx.save();
            let pAlpha = currentType === currentWeather.type ? (1 - transitionAlpha) : transitionAlpha;

            for (let i = 0; i < weatherParticles.length; i++) {
                let p = weatherParticles[i];
                let dynamicSpeedX = p.speedX - (speed * 0.09); 
                let dynamicSpeedY = (currentType === 'rain') ? p.speedY : p.speedY * 0.35; 

                p.x += dynamicSpeedX * timeRatio; p.y += dynamicSpeedY * timeRatio;

                if (p.y > height) { p.y = 0; p.x = Math.random() * width; }
                if (p.x < 0) { p.x = width; p.y = Math.random() * height; } 

                if (currentType === 'rain') {
                    ctx.strokeStyle = `rgba(174, 219, 255, ${0.4 * pAlpha})`; ctx.lineWidth = 1.0;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + dynamicSpeedX * 1.2, p.y + dynamicSpeedY * 1.2); ctx.stroke();
                } else if (currentType === 'snow') {
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.75 * pAlpha})`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                }
            }
            ctx.restore();
        }

        function getSkyGradient(scene, weather) {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            if (weather.type === 'sunny') {
                skyGrad.addColorStop(0, scene.skyTop); skyGrad.addColorStop(1, scene.skyBottom);
            } else if (weather.type === 'cloudy') {
                skyGrad.addColorStop(0, '#4a5568'); skyGrad.addColorStop(1, '#718096');
            } else if (weather.type === 'rain') {
                skyGrad.addColorStop(0, '#2d3748'); skyGrad.addColorStop(1, '#4a5568');
            } else { 
                skyGrad.addColorStop(0, '#1a202c'); skyGrad.addColorStop(1, '#2d3748');
            }
            return skyGrad;
        }

        // 🛠️ 核心美化重構：精緻化山景（雙層3D向光切面、雪帽）、樹林（立體針葉、樹幹、遠近視差）
        function drawSceneDetails(scene, weather, horizonY) {
            const scale = Math.max(0.4, width / 1200); 

            // ================= ⛰️ 【精緻化山景】 =================
            if (scene.id === 'mountain') {
                ctx.save();
                
                // [1. 遠山 (Far Mountains)] - 移動速度極慢，顏色帶有遠景透視霧感
                const farOffset = (distance * 0.05) % width;
                let farColor = weather.type === 'sunny' ? '#9ab7d3' : '#4a5a6a';
                ctx.fillStyle = farColor;
                
                ctx.beginPath();
                ctx.moveTo(0 - farOffset, horizonY);
                ctx.lineTo(width * 0.25 - farOffset, horizonY - height * 0.25);
                ctx.lineTo(width * 0.55 - farOffset, horizonY);
                ctx.lineTo(width * 0.8 - farOffset, horizonY - height * 0.22);
                ctx.lineTo(width * 1.2 - farOffset, horizonY);
                ctx.lineTo(width * 1.5 - farOffset, horizonY - height * 0.28);
                ctx.lineTo(width * 2 - farOffset, horizonY);
                ctx.lineTo(0, horizonY);
                ctx.fill();

                // [2. 近山 (Near Mountains)] - 移動速度稍快，具備明暗3D切面與皚皚雪帽
                const nearOffset = (distance * 0.12) % width;
                
                // 定義三座近景主峰的相對頂點位置
                const peaks = [
                    { rx: 0.15, ry: 0.35, rw: 0.4 },
                    { rx: 0.5, ry: 0.38, rw: 0.45 },
                    { rx: 0.85, ry: 0.32, rw: 0.38 }
                ];

                peaks.forEach(p => {
                    let peakX = width * p.rx - nearOffset;
                    let peakY = horizonY - height * p.ry;
                    let peakW = width * p.rw;
                    let leftX = peakX - peakW * 0.5;
                    let rightX = peakX + peakW * 0.5;

                    // 確保群山在左右循環繪製時不會斷軌
                    for (let loop = 0; loop <= 1; loop++) {
                        let shift = loop * width;
                        let curLeft = leftX + shift;
                        let curPeak = peakX + shift;
                        let curRight = rightX + shift;

                        // A. 繪製背光面 (暗部 - 左側)
                        ctx.fillStyle = weather.type === 'sunny' ? '#4a567d' : '#23293d';
                        ctx.beginPath();
                        ctx.moveTo(curLeft, horizonY);
                        ctx.lineTo(curPeak, peakY);
                        ctx.lineTo(curPeak, horizonY);
                        ctx.closePath();
                        ctx.fill();

                        // B. 繪製向光面 (亮部 - 右側)
                        ctx.fillStyle = weather.type === 'sunny' ? '#687fa6' : '#2f3954';
                        ctx.beginPath();
                        ctx.moveTo(curPeak, peakY);
                        ctx.lineTo(curRight, horizonY);
                        ctx.lineTo(curPeak, horizonY);
                        ctx.closePath();
                        ctx.fill();

                        // C. 繪製山頂「立體積雪 (Snow Cap)」
                        if (weather.type !== 'rain') {
                            let snowH = height * 0.06;
                            
                            // 左側暗雪
                            ctx.fillStyle = '#d2dae2';
                            ctx.beginPath();
                            ctx.moveTo(curPeak, peakY);
                            ctx.lineTo(curPeak - snowH * 0.7, peakY + snowH);
                            ctx.lineTo(curPeak, peakY + snowH * 0.8);
                            ctx.closePath();
                            ctx.fill();

                            // 右側亮雪
                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.moveTo(curPeak, peakY);
                            ctx.lineTo(curPeak + snowH * 0.7, peakY + snowH);
                            ctx.lineTo(curPeak, peakY + snowH * 0.8);
                            ctx.closePath();
                            ctx.fill();
                        }
                    }
                });
                ctx.restore();
            } 
            else if (scene.id === 'ocean') {
                let oceanHeight = Math.max(100, height * 0.25);
                let oceanTopY = horizonY - oceanHeight;
                let oceanGrad = ctx.createLinearGradient(0, oceanTopY, 0, horizonY);
                oceanGrad.addColorStop(0, '#1b4f72'); oceanGrad.addColorStop(1, '#5dade2');
                ctx.fillStyle = oceanGrad; ctx.fillRect(0, oceanTopY, width, oceanHeight);
                
                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                const waveOffset = (distance * 0.5) % 80;
                for (let i = -80; i < width + 80; i += 80) {
                    let waveW = 40 + Math.sin(Date.now() / 200 + i) * 15;
                    ctx.fillRect(i - waveOffset, oceanTopY + (oceanHeight * 0.4) + Math.sin(i) * 5, waveW, 2);
                }
            } 
            // ================= 🌲 【精緻化樹林】 =================
            else if (scene.id === 'forest') {
                ctx.save();
                
                // [1. 遠景小樹林] - 顏色較淺、移動較慢
                const farTreeOffset = (distance * 0.2) % 180;
                for (let x = -100; x < width + 100; x += 45 * scale) {
                    let drawX = x - farTreeOffset;
                    let tHeight = (50 + (Math.sin(x) * 15)) * scale;
                    let tWidth = 22 * scale;
                    
                    ctx.fillStyle = weather.type === 'sunny' ? '#1abc9c' : '#117a65'; // 遠方偏藍綠的林木
                    ctx.beginPath();
                    ctx.moveTo(drawX, horizonY);
                    ctx.lineTo(drawX + tWidth/2, horizonY - tHeight);
                    ctx.lineTo(drawX + tWidth, horizonY);
                    ctx.closePath();
                    ctx.fill();
                }

                // [2. 近景高精緻立體松樹林] - 擁有獨立樹幹、三層漸層針葉樹冠，且具備高低起伏
                const nearTreeOffset = (distance * 0.45) % 240;
                
                for (let x = -120; x < width + 120; x += 55 * scale) {
                    let drawX = x - nearTreeOffset;
                    // 根據正弦函數創造自然高低變化的樹木高度
                    let treeH = (85 + Math.sin(x * 0.05) * 25) * scale;
                    let treeW = 38 * scale;

                    // A. 繪製深棕色實體樹幹 (Trunk)
                    ctx.fillStyle = '#5c3a21';
                    let trunkW = 4 * scale;
                    let trunkH = treeH * 0.25;
                    ctx.fillRect(drawX + treeW/2 - trunkW/2, horizonY - trunkH, trunkW, trunkH);

                    // B. 繪製三層立體漸層松葉 (三層三角形葉片疊加)
                    let leafStartY = horizonY - trunkH;
                    let layerH = (treeH - trunkH) / 3;

                    // 顏色陣列 (底層最暗 -> 頂層最亮)
                    let leafColors = weather.type === 'sunny' 
                        ? ['#196f3d', '#229954', '#2ecc71']  
                        : ['#145a32', '#196f3d', '#229954']; 

                    for (let layer = 0; layer < 3; layer++) {
                        ctx.fillStyle = leafColors[layer];
                        
                        let curBottomY = leafStartY - layer * (layerH * 0.7);
                        let curHeight = layerH * (1.3 - layer * 0.15);
                        let curWidth = treeW * (1.0 - layer * 0.22);
                        
                        ctx.beginPath();
                        ctx.moveTo(drawX + treeW/2 - curWidth/2, curBottomY);             // 左底點
                        ctx.lineTo(drawX + treeW/2, curBottomY - curHeight);            // 頂點
                        ctx.lineTo(drawX + treeW/2 + curWidth/2, curBottomY);            // 右底點
                        ctx.closePath();
                        ctx.fill();
                        
                        // 側邊向光立體高光線（亮部點綴）
                        if (weather.type === 'sunny') {
                            ctx.fillStyle = 'rgba(255,255,255,0.08)';
                            ctx.beginPath();
                            ctx.moveTo(drawX + treeW/2, curBottomY - curHeight);
                            ctx.lineTo(drawX + treeW/2 + curWidth/2, curBottomY);
                            ctx.lineTo(drawX + treeW/2, curBottomY);
                            ctx.closePath();
                            ctx.fill();
                        }
                    }
                }
                ctx.restore();
            } 
            else if (scene.id === 'city') {
                ctx.save();
                const farOffset = (distance * 0.12) % 400;
                ctx.fillStyle = weather.type === 'sunny' ? '#222f3e' : '#141d26'; 
                for (let i = -1; i < (width / (100 * scale)) + 2; i++) {
                    let drawX = i * (140 * scale) - farOffset;
                    let bHeight = (120 + (i % 3) * 50) * scale; let bWidth = 55 * scale;
                    ctx.fillRect(drawX, horizonY - bHeight, bWidth, bHeight);
                    if (i % 2 === 0) ctx.fillRect(drawX + bWidth * 0.4, horizonY - bHeight - 15 * scale, 4 * scale, 15 * scale);
                }

                const nearOffset = (distance * 0.35) % 500;
                for (let i = -1; i < (width / (150 * scale)) + 2; i++) {
                    let drawX = i * (220 * scale) - nearOffset;
                    let bHeight = (180 + (i * 73 % 4) * 45) * scale; let bWidth = 85 * scale;
                    ctx.fillStyle = weather.type === 'sunny' ? '#34495e' : '#1c2631'; ctx.fillRect(drawX, horizonY - bHeight, bWidth, bHeight);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.18)'; ctx.fillRect(drawX + bWidth * 0.75, horizonY - bHeight, bWidth * 0.25, bHeight);

                    ctx.fillStyle = weather.type === 'sunny' ? '#2c3e50' : '#151c24';
                    if (i % 2 === 0) {
                        ctx.fillRect(drawX + bWidth * 0.2, horizonY - bHeight - 10 * scale, bWidth * 0.6, 10 * scale);
                        ctx.fillStyle = '#ff3b3b'; ctx.fillRect(drawX + bWidth * 0.5 - 1 * scale, horizonY - bHeight - 25 * scale, 2 * scale, 2 * scale);
                    } else if (i % 3 === 0) {
                        ctx.fillRect(drawX + bWidth * 0.1, horizonY - bHeight - 6 * scale, bWidth * 0.8, 6 * scale);
                        ctx.fillRect(drawX + bWidth * 0.25, horizonY - bHeight - 12 * scale, bWidth * 0.5, 6 * scale);
                    }

                    let winW = 5 * scale; let winH = 7 * scale; let gapX = 10 * scale; let gapY = 14 * scale;
                    for (let wx = drawX + 10 * scale; wx < drawX + bWidth * 0.7; wx += gapX) {
                        for (let wy = horizonY - bHeight + 15 * scale; wy < horizonY - 15 * scale; wy += gapY) {
                            let seed = Math.sin(wx * 2 + wy * 5 + i);
                            if (seed > -0.2) {
                                ctx.fillStyle = `rgba(241, 196, 15, ${weather.type === 'sunny' ? 0.4 + Math.abs(seed) * 0.4 : 0.6 + Math.abs(seed) * 0.4})`; 
                                ctx.fillRect(wx, wy, winW, winH);
                            }
                        }
                    }
                }
                ctx.restore();
            } 
            else if (scene.id === 'country') {
                const offset = (distance * 0.25) % 360;
                ctx.fillStyle = '#27ae60'; ctx.fillRect(0, horizonY - 15, width, 15);
            }
        }

        function drawBackground(timeRatio) {
            ctx.save();
            const horizonY = height - 30; 

            ctx.fillStyle = getSkyGradient(currentScene, currentWeather);
            ctx.fillRect(0, 0, width, height);
            drawSceneDetails(currentScene, currentWeather, horizonY);
            updateAndDrawSkyObjects(1 - transitionAlpha, timeRatio); 

            if (isTransitioning && nextScene && nextWeather) {
                ctx.save(); ctx.globalAlpha = transitionAlpha;
                ctx.fillStyle = getSkyGradient(nextScene, nextWeather); ctx.fillRect(0, 0, width, height);
                drawSceneDetails(nextScene, nextWeather, horizonY); ctx.restore();
                updateAndDrawSkyObjects(transitionAlpha, timeRatio);
            }
            ctx.restore();

            ctx.fillStyle = '#1a202c'; ctx.fillRect(0, horizonY, width, 30);
            const trackOffset = (distance * 2) % 40; ctx.fillStyle = '#718096';
            for (let i = -1; i < width / 40 + 1; i++) {
                ctx.fillRect(i * 40 - trackOffset, horizonY + 8, 14, 6);
            }
        }

        function drawPlatform() {
            ctx.save();
            const horizonY = height - 30; const scale = Math.max(0.4, width / 1200); 
            const trainStartX = width * 0.15; 
            const baseLength = 480 * scale; const headLength = 180 * scale;
            const platformTopY = horizonY - 4 * scale; const perfectStopCanvasX = trainStartX + baseLength + headLength; 
            const stopLineX = perfectStopCanvasX + (distanceToStation * 8);
            const platformX = stopLineX - 1150; const platformWidth = width * 3;

            ctx.fillStyle = '#7f8c8d'; ctx.fillRect(platformX, platformTopY, platformWidth, height - platformTopY);
            ctx.fillStyle = '#bdc3c7'; ctx.fillRect(platformX, platformTopY, platformWidth, 12);
            ctx.fillStyle = '#f1c40f'; ctx.fillRect(platformX, platformTopY + 4, platformWidth, 4);

            passengers.forEach(p => {
                const pX = stopLineX + p.relX;
                if (pX > platformX && pX < platformX + platformWidth) {
                    ctx.save(); ctx.translate(pX, platformTopY);
                    ctx.fillStyle = p.color; ctx.fillRect(-2.5, -p.height, 5, p.height);
                    ctx.fillStyle = '#ffdbb5'; ctx.beginPath(); ctx.arc(0, -p.height - 2, 2.5, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                }
            });

            const signX = stopLineX - 120; ctx.fillStyle = '#95a5a6'; ctx.fillRect(signX, platformTopY - 65, 5, 65);
            ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 1.5;
            let container = signX - 50; ctx.fillRect(container, platformTopY - 95, 106, 32); ctx.strokeRect(container, platformTopY - 95, 106, 32);
            ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 11px sans-serif'; ctx.fillText(currentStationName.split(" ")[0], signX - 25, platformTopY - 76);
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(stopLineX - 3, platformTopY, 6, 25);
            ctx.restore();
        }

        UXScaleMax = 1200;
        function drawShinkansen() {
            const horizonY = height - 30; const scale = Math.max(0.4, width / UXScaleMax); 
            const baseLength = 480 * scale; const headLength = 180 * scale; const trainHeight = 85 * scale;
            const bounce = speed > 0 ? Math.sin(Date.now() / 40) * 1.5 : 0;
            const firstCarStartX = width * 0.15; const secondCarStartX = firstCarStartX - baseLength - 12 * scale; 
            const lightSourceX = firstCarStartX + baseLength + headLength - 5 * scale;
            const lightSourceY = horizonY - trainHeight * 0.25 + bounce;

            if (isHeadlightOn) {
                ctx.save();
                let lightBeamGrad = ctx.createLinearGradient(lightSourceX, lightSourceY, width, lightSourceY);
                lightBeamGrad.addColorStop(0, 'rgba(255, 255, 230, 0.45)');
                lightBeamGrad.addColorStop(0.3, 'rgba(255, 255, 240, 0.12)');
                lightBeamGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = lightBeamGrad; ctx.beginPath(); ctx.moveTo(lightSourceX, lightSourceY - 3);
                ctx.lineTo(width, lightSourceY - height * 0.4); ctx.lineTo(width, lightSourceY + height * 0.4);
                ctx.closePath(); ctx.fill(); ctx.restore();
            }

            // 【第二節車廂】
            ctx.save(); ctx.translate(secondCarStartX, horizonY - trainHeight + bounce);
            let bodyGrad2 = ctx.createLinearGradient(0, 0, 0, trainHeight);
            bodyGrad2.addColorStop(0, '#ffffff'); bodyGrad2.addColorStop(0.15, '#f8fafc');
            bodyGrad2.addColorStop(0.75, '#e2e8f0'); bodyGrad2.addColorStop(1, '#94a3b8');
            ctx.fillStyle = bodyGrad2; ctx.fillRect(0, 0, baseLength, trainHeight);
            ctx.fillStyle = '#334155'; ctx.fillRect(0, trainHeight - 7 * scale, baseLength, 7 * scale);
            ctx.fillStyle = '#0033cc'; ctx.fillRect(0, trainHeight * 0.44, baseLength, trainHeight * 0.12);
            
            for (let i = 25 * scale; i < baseLength - 70 * scale; i += 65 * scale) {
                ctx.fillStyle = '#475569'; ctx.fillRect(i - 1, trainHeight * 0.19, 44 * scale, 22 * scale);
                let winGrad = ctx.createLinearGradient(i, trainHeight * 0.2, i, trainHeight * 0.38);
                winGrad.addColorStop(0, '#1e293b'); winGrad.addColorStop(1, '#0f172a');
                ctx.fillStyle = winGrad; ctx.fillRect(i, trainHeight * 0.2, 42 * scale, 20 * scale);
            }
            drawPhysicalDoor(baseLength - 45 * scale, trainHeight, scale); ctx.restore();

            // 【中央防風褶棚】
            ctx.save(); ctx.translate(secondCarStartX + baseLength, horizonY - trainHeight + bounce);
            let gangwayGrad = ctx.createLinearGradient(0, 0, 12 * scale, 0);
            gangwayGrad.addColorStop(0, '#0f172a'); gangwayGrad.addColorStop(0.5, '#475569'); gangwayGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = gangwayGrad; ctx.fillRect(0, trainHeight * 0.06, 12 * scale, trainHeight * 0.88);
            ctx.restore();

            // 【第一節車廂】
            ctx.save(); ctx.translate(firstCarStartX, horizonY - trainHeight + bounce);
            let bodyGrad1 = ctx.createLinearGradient(0, 0, 0, trainHeight);
            bodyGrad1.addColorStop(0, '#ffffff'); bodyGrad1.addColorStop(0.2, '#f8fafc');
            bodyGrad1.addColorStop(0.7, '#e2e8f0'); bodyGrad1.addColorStop(1, '#94a3b8');
            ctx.fillStyle = bodyGrad1;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(baseLength, 0);
            ctx.quadraticCurveTo(baseLength + headLength * 0.75, -1 * scale, baseLength + headLength * 0.95, trainHeight * 0.62);
            ctx.quadraticCurveTo(baseLength + headLength, trainHeight * 0.76, baseLength + headLength, trainHeight);
            ctx.lineTo(0, trainHeight); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#334155'; ctx.fillRect(0, trainHeight - 7 * scale, baseLength + headLength * 0.7, 7 * scale);
            ctx.fillStyle = '#0033cc'; ctx.beginPath();
            ctx.moveTo(0, trainHeight * 0.44); ctx.lineTo(baseLength, trainHeight * 0.44);
            ctx.quadraticCurveTo(baseLength + headLength * 0.72, trainHeight * 0.44, baseLength + headLength * 0.92, trainHeight * 0.68);
            ctx.lineTo(baseLength + headLength * 0.85, trainHeight * 0.78);
            ctx.quadraticCurveTo(baseLength + headLength * 0.68, trainHeight * 0.56, baseLength, trainHeight * 0.56);
            ctx.lineTo(0, trainHeight * 0.56); ctx.fill();

            let cockpitGrad = ctx.createLinearGradient(baseLength - 20 * scale, trainHeight * 0.08, baseLength + 85 * scale, trainHeight * 0.35);
            cockpitGrad.addColorStop(0, '#0f172a'); cockpitGrad.addColorStop(0.5, '#1e293b'); cockpitGrad.addColorStop(1, '#020617');
            ctx.fillStyle = cockpitGrad; ctx.beginPath();
            ctx.moveTo(baseLength - 20 * scale, trainHeight * 0.08); ctx.lineTo(baseLength + 50 * scale, trainHeight * 0.08);
            ctx.quadraticCurveTo(baseLength + 90 * scale, trainHeight * 0.10, baseLength + 112 * scale, trainHeight * 0.35);
            ctx.lineTo(baseLength + 68 * scale, trainHeight * 0.35); ctx.closePath(); ctx.fill();
            
            for (let i = 65 * scale; i < baseLength - 40 * scale; i += 65 * scale) {
                ctx.fillStyle = '#475569'; ctx.fillRect(i - 1, trainHeight * 0.19, 44 * scale, 22 * scale);
                let winGrad1 = ctx.createLinearGradient(i, trainHeight * 0.2, i, trainHeight * 0.38);
                winGrad1.addColorStop(0, '#1e293b'); winGrad1.addColorStop(1, '#0f172a');
                ctx.fillStyle = winGrad1; ctx.fillRect(i, trainHeight * 0.2, 42 * scale, 20 * scale);
            }

            if (isHeadlightOn) {
                ctx.shadowColor = '#ffffcc'; ctx.shadowBlur = 10; ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(baseLength + headLength - 15 * scale, trainHeight * 0.72, 4.5 * scale, 0, Math.PI * 2);
                ctx.arc(baseLength + headLength - 25 * scale, trainHeight * 0.75, 3.5 * scale, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; 
            }
            ctx.restore(); drawHornWaves(lightSourceX, lightSourceY);
        }

        function drawPhysicalDoor(doorX, trainHeight, scale) {
            const doorWidth = 32 * scale; 
            const doorHeight = 58 * scale; 
            const doorY = trainHeight - doorHeight - 7 * scale;

            ctx.save();
            ctx.fillStyle = '#111625'; 
            ctx.fillRect(doorX, doorY, doorWidth, doorHeight);
            
            const doorMoveOffset = (doorWidth / 2) * doorWidthPercent;
            let doorMetalGrad = ctx.createLinearGradient(doorX, doorY, doorX + doorWidth, doorY);
            doorMetalGrad.addColorStop(0, '#cbd5e1'); 
            doorMetalGrad.addColorStop(0.5, '#f1f5f9'); 
            doorMetalGrad.addColorStop(1, '#94a3b8');
            ctx.fillStyle = doorMetalGrad;

            // 【左側半扇車門】
            ctx.save();
            ctx.beginPath(); 
            ctx.rect(doorX - doorMoveOffset, doorY, doorWidth / 2, doorHeight); 
            ctx.clip();
            ctx.fillRect(doorX - doorMoveOffset, doorY, doorWidth / 2, doorHeight);
            
            ctx.strokeStyle = '#64748b'; 
            ctx.lineWidth = Math.max(0.5, 1 * scale); 
            ctx.strokeRect(doorX - doorMoveOffset, doorY, doorWidth / 2, doorHeight);
            
            ctx.fillStyle = '#0f172a'; 
            ctx.fillRect(
                doorX - doorMoveOffset + (doorWidth / 4) - 3 * scale, 
                doorY + 10 * scale, 
                6 * scale, 
                18 * scale
            );
            ctx.restore();

            // 【右側半扇車門】
            ctx.save();
            ctx.beginPath(); 
            ctx.rect(doorX + doorWidth / 2 + doorMoveOffset, doorY, doorWidth / 2, doorHeight); 
            ctx.clip();
            ctx.fillRect(doorX + doorWidth / 2 + doorMoveOffset, doorY, doorWidth / 2, doorHeight);
            
            ctx.strokeStyle = '#64748b'; 
            ctx.lineWidth = Math.max(0.5, 1 * scale); 
            ctx.strokeRect(doorX + doorWidth / 2 + doorMoveOffset, doorY, doorWidth / 2, doorHeight);
            
            ctx.fillStyle = '#0f172a'; 
            ctx.fillRect(
                doorX + (doorWidth / 2) + doorMoveOffset + 3 * scale, 
                doorY + 10 * scale, 
                6 * scale, 
                18 * scale
            );
            ctx.restore();

            ctx.fillStyle = '#1e293b'; 
            ctx.fillRect(
                doorX + (doorWidth / 2) - 0.75 * scale, 
                doorY + 2 * scale, 
                1.5 * scale, 
                doorHeight - 4 * scale
            );
            
            ctx.strokeStyle = '#475569'; 
            ctx.lineWidth = Math.max(0.6, 1.5 * scale); 
            ctx.strokeRect(doorX, doorY, doorWidth, doorHeight);
            ctx.restore();
        }

        function triggerHorn() {
            hornWaves.push({ radius: 10, alpha: 1.0, maxRadius: 135 }); playHornSound(); 
        }

        function drawHornWaves(startX, startY) {
            ctx.save();
            for (let i = hornWaves.length - 1; i >= 0; i--) {
                let wave = hornWaves[i]; wave.radius += 3.5; wave.alpha -= 0.025;
                if (wave.alpha <= 0) { hornWaves.splice(i, 1); continue; }
                ctx.strokeStyle = `rgba(0, 229, 255, ${wave.alpha})`; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(startX, startY, wave.radius, -Math.PI/3, Math.PI/3, false); ctx.stroke();
            }
            ctx.restore();
        }

        function prepareNextStationScene() {
            nextScene = scenePool[Math.floor(Math.random() * scenePool.length)];
            nextWeather = weatherPool[Math.floor(Math.random() * weatherPool.length)];
            isTransitioning = true; transitionAlpha = 0; 
        }

        function commitNextStation() {
            let availableStations = stationPool.filter(s => s.name !== currentStationName);
            currentStationName = availableStations[Math.floor(Math.random() * availableStations.length)].name;
            totalStationDistance = Math.floor(Math.random() * 2501) + 2500; distanceToStation = totalStationDistance;
            document.getElementById('station-name-display').innerText = currentStationName;
            if (nextScene && nextWeather) { currentScene = nextScene; currentWeather = nextWeather; }
            isTransitioning = false; hasTriggeredTransition = false; transitionAlpha = 0;
            initWeatherParticles(); initSkyObjects(); 
        }

        function gameLoop(timestamp) {
            let dt = timestamp - lastTime;
            if (dt > 100) dt = 16.66; 
            lastTime = timestamp;

            const timeRatio = dt / 16.66; 

            if (skyObjects.filter(o => o.type === 'plane').length === 0 && Math.random() < 0.001 * timeRatio) {
                skyObjects.push(generatePlane());
            }
            if (skyObjects.filter(o => o.type === 'bird').length === 0 && Math.random() < 0.002 * timeRatio) {
                generateBirdFlock();
            }

            if (isMissionFailed) {
                failureResetTimer -= 1 * timeRatio;
                targetSpeed = 0; speed = 0; 
                if (failureResetTimer <= 0) {
                    isMissionFailed = false; distanceToStation = 10; 
                    isArrived = false; doorOpen = false; isClosingDoors = false; doorWidthPercent = 0; 
                    stationMessage = "重新挑戰！請上下滑動精準停靠 0m 處"; messageTimer = 180;
                }
            }

            if (isMovingUp && doorOpen && !isClosingDoors && !isMissionFailed) isClosingDoors = true; 

            if (isClosingDoors) {
                targetSpeed = 0; speed = 0; doorWidthPercent -= 0.05 * timeRatio; 
                if (doorWidthPercent <= 0) {
                    doorWidthPercent = 0; doorOpen = false; isClosingDoors = false; isArrived = false;
                    commitNextStation(); 
                    stationMessage = `出發！前方進入【${currentScene.label}】，氣候：${currentWeather.label}`; messageTimer = 160;
                }
            } else {
                if (isMovingUp && !isMissionFailed && !doorOpen) targetSpeed = Math.min(320, targetSpeed + 2.5 * timeRatio);
                if (isArrived && speed === 0 && !isMissionFailed) {
                    doorWidthPercent = Math.min(1.0, doorWidthPercent + 0.04 * timeRatio);
                }
            }

            if (isMovingDown && !isMissionFailed) targetSpeed = Math.max(0, targetSpeed - 3 * timeRatio);

            if (!isMissionFailed) {
                speed += (targetSpeed - speed) * (0.03 * timeRatio);
                if (Math.abs(speed) < 0.1) speed = 0;
                distance += speed * 0.5 * timeRatio;
            }

            updateTrainSounds();
            
            if (!isArrived && !isMissionFailed) {
                distanceToStation -= (speed / 360) * timeRatio; 

                if (distanceToStation <= 500 && distanceToStation > 0 && !hasTriggeredTransition) {
                    prepareNextStationScene(); hasTriggeredTransition = true;
                }

                if (isTransitioning) {
                    transitionAlpha = (distanceToStation > 50) ? 1 - ((distanceToStation - 50) / 450) : 1;
                }
                
                if (speed === 0 && distanceToStation <= 20) { 
                    if (Math.abs(distanceToStation) <= 10) {
                        isArrived = true; doorOpen = true;
                        let error = Math.round(distanceToStation);
                        stationMessage = error === 0 ? "完美停靠！誤差 0m，車門已開啟" : `合格停靠！${error > 0 ? '提早' : '衝過頭'}了 ${Math.abs(error)}m，車門已開啟`;
                        messageTimer = 120;
                    } else if (distanceToStation < -10) {
                        isMissionFailed = true; targetSpeed = 0; speed = 0;
                        stationMessage = "任務失敗：過站未停！(正在將車移回到站處...)"; failureResetTimer = 90; 
                    }
                }
                if (distanceToStation < -50) {
                    isMissionFailed = true; targetSpeed = 0; speed = 0;
                    stationMessage = "任務失敗：過站未停！(正在將車移回到站處...)"; failureResetTimer = 90; 
                }
            }

            if (messageTimer > 0) messageTimer -= 1 * timeRatio;

            const distDisplay = document.getElementById('station-dist-display');
            if (distanceToStation > 1000) {
                distDisplay.innerText = (distanceToStation / 1000).toFixed(2) + " km"; distDisplay.style.color = "#00e5ff";
            } else if (distanceToStation > 0) {
                distDisplay.innerText = Math.round(distanceToStation) + " m"; distDisplay.style.color = (distanceToStation < 150) ? "#ff3b3b" : "#eab308";
            } else {
                distDisplay.innerText = "0 m (ARRIVED)"; distDisplay.style.color = "#00ff88";
            }

            document.getElementById('gauge-fill-circle').style.strokeDashoffset = 220 - (220 * (speed / 320));
            document.getElementById('speed-display').innerText = Math.round(speed).toString().padStart(3, '0');
            document.getElementById('odometer-display').innerText = (distance / 250).toFixed(1);

            document.getElementById('led-power').className = (targetSpeed > speed) ? 'status-led status-on' : 'status-led status-off';
            document.getElementById('led-brake').className = (isMovingDown || (targetSpeed === 0 && speed > 2) || isMissionFailed) ? 'status-led status-brake' : 'status-led status-off';
            document.getElementById('led-door').className = (doorWidthPercent > 0.1) ? 'status-led status-door' : 'status-led status-off';

            ctx.clearRect(0, 0, width, height);
            drawBackground(timeRatio); 

            if ((distanceToStation <= 250 && distanceToStation >= -120) || isArrived || isMissionFailed) drawPlatform(); 

            drawShinkansen(); 
            drawWeather(timeRatio);    

            if (stationMessage && messageTimer > 0) {
                ctx.save(); ctx.fillStyle = isMissionFailed ? 'rgba(44, 11, 14, 0.95)' : 'rgba(10, 15, 26, 0.85)';
                ctx.fillRect(width / 2 - 270, 50, 540, 50); ctx.strokeStyle = isMissionFailed ? '#ff3b3b' : 'var(--primary-color)';
                ctx.strokeRect(width / 2 - 270, 50, 540, 50); ctx.fillStyle = isMissionFailed ? '#ff3b3b' : '#ffffff';
                ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(stationMessage, width / 2, 82); ctx.restore();
            }

            requestAnimationFrame(gameLoop);
        }

        let touchStartY = 0; let isDragging = false; const swipeThreshold = 30;
        let lastTouchTime = 0; 

        window.addEventListener('touchstart', (e) => {
            if (document.getElementById('dashboard').contains(e.target) || isMissionFailed) return;
            
            const now = performance.now();
            const timespan = now - lastTouchTime;
            lastTouchTime = now;

            if (timespan > 0 && timespan < 300) {
                e.preventDefault(); 
                isHeadlightOn = !isHeadlightOn;
                isDragging = false;
                return;
            }

            touchStartY = e.touches[0].clientY; isDragging = true; if (!audioCtx) initAudio(); 
        }, { passive: false }); 

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || isMissionFailed) return;
            const currentY = e.touches[0].clientY; const diffY = touchStartY - currentY;
            if (Math.abs(diffY) > swipeThreshold) {
                if (diffY > 0) { isMovingUp = true; isMovingDown = false; } else { isMovingDown = true; isMovingUp = false; }
                isDragging = false; 
            }
        }, { passive: true });

        window.addEventListener('touchend', () => { isMovingUp = false; isMovingDown = false; isDragging = false; });

        window.addEventListener('mousedown', (e) => {
            if (!audioCtx) initAudio(); 
            if (document.getElementById('dashboard').contains(e.target) || isMissionFailed) return;
            if (e.button === 0) { touchStartY = e.clientY; isDragging = true; triggerHorn(); } 
        });

        window.addEventListener('dblclick', (e) => {
            if (document.getElementById('dashboard').contains(e.target) || isMissionFailed) return;
            isHeadlightOn = !isHeadlightOn;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging || isMissionFailed) return;
            const diffY = touchStartY - e.clientY;
            if (Math.abs(diffY) > swipeThreshold) {
                if (diffY > 0) { isMovingUp = true; isMovingDown = false; } else { isMovingDown = true; isMovingUp = false; }
                isDragging = false;
            }
        });

        window.addEventListener('mouseup', () => { isMovingUp = false; isMovingDown = false; isDragging = false; });

        const btnAccel = document.getElementById('btn-accel'); const btnDecel = document.getElementById('btn-decel');
        btnAccel.addEventListener('mousedown', (e) => { e.preventDefault(); if (!audioCtx) initAudio(); if(!isMissionFailed) isMovingUp = true; });
        btnAccel.addEventListener('touchstart', (e) => { e.preventDefault(); if (!audioCtx) initAudio(); if(!isMissionFailed) isMovingUp = true; });
        btnAccel.addEventListener('mouseup', () => isMovingUp = false); btnAccel.addEventListener('touchend', () => isMovingUp = false);
        btnDecel.addEventListener('mousedown', (e) => { e.preventDefault(); if (!audioCtx) initAudio(); if(!isMissionFailed) isMovingDown = true; });
        btnDecel.addEventListener('touchstart', (e) => { e.preventDefault(); if (!audioCtx) initAudio(); if(!isMissionFailed) isMovingDown = true; });
        btnDecel.addEventListener('mouseup', () => isMovingDown = false); btnDecel.addEventListener('touchend', () => isMovingDown = false);

        window.addEventListener('keydown', (e) => {
            if (!audioCtx) initAudio(); if (isMissionFailed) return;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') isMovingUp = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') isMovingDown = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') isMovingUp = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') isMovingDown = false;
        });

        window.addEventListener('wheel', (e) => {
            if (!audioCtx) initAudio(); if (isMissionFailed) return;
            if (e.deltaY < 0) {
                if (doorOpen) { isMovingUp = true; setTimeout(() => { isMovingUp = false; }, 200); } 
                else targetSpeed = Math.min(320, targetSpeed + 15);
            } else if (e.deltaY > 0) targetSpeed = Math.max(0, targetSpeed - 15);
        });

        resize();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
